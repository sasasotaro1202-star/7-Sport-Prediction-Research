name: Prediction-Core PyMC Real Data Shadow

on:
  push:
    paths:
      - "scripts/pymc_pit_shadow_dataset.py"
      - "scripts/research_pymc_real_shadow.py"
      - "scripts/test_pymc_pit_shadow_dataset.py"
      - "scripts/test_pymc_real_shadow.py"
      - ".github/workflows/prediction_core_pymc_real_shadow.yml"
  pull_request:
    paths:
      - "scripts/pymc_pit_shadow_dataset.py"
      - "scripts/research_pymc_real_shadow.py"
      - "scripts/test_pymc_pit_shadow_dataset.py"
      - "scripts/test_pymc_real_shadow.py"
      - ".github/workflows/prediction_core_pymc_real_shadow.yml"
  workflow_dispatch:
  schedule:
    - cron: "47 5 * * 1"

permissions:
  contents: read

concurrency:
  group: prediction-core-pymc-real-shadow-${{ github.ref }}
  cancel-in-progress: true

env:
  PYMC_REAL_SHADOW_VERSION: "v1-sport-isolated"

jobs:
  real-shadow:
    name: PyMC real shadow / ${{ matrix.sport }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        sport: [basketball, volleyball, ufc, rizin, valorant]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install isolated PyMC research dependency
        run: python -m pip install --retries 5 --timeout 60 "pymc==6.3.2"

      - name: Validate contracts
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/test_pymc_pit_shadow_dataset.py
          PYTHONPATH=. python scripts/test_pymc_real_shadow.py

      - name: Restore latest PIT-safe sport database
        id: source_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: data/db
          key: pymc-real-shadow-${{ matrix.sport }}-${{ github.run_id }}
          restore-keys: |
            active-scope-target-db-v4-${{ matrix.sport }}-pit-
            nine-sport-research-db-v4-${{ matrix.sport }}-
            nine-sport-target-db-v4-${{ matrix.sport }}-pit-
            nine-sport-target-db-v4-${{ matrix.sport }}-

      - name: Build sport-isolated PIT dataset
        env:
          SPORT_NAME: ${{ matrix.sport }}
          CACHE_MATCHED_KEY: ${{ steps.source_cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          mkdir -p results/research
          if [ -z "${CACHE_MATCHED_KEY:-}" ] || [ ! -s data/db/sports_v45.sqlite ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          sport=os.environ["SPORT_NAME"]
          out=Path(f"results/research/pymc_pit_shadow_dataset_{sport}.json")
          out.write_text(json.dumps({
              "status":"BLOCKED_NO_PIT_SOURCE_CACHE",
              "sport":sport,
              "dataset_scope":"SPORT_SINGLE",
              "research_only":True,
              "production_dependency":False,
              "automatic_promotion":False,
          },ensure_ascii=False,indent=2)+"
",encoding="utf-8")
          print(f"PYMC_REAL_SHADOW={sport} BLOCKED_NO_PIT_SOURCE_CACHE")
          PY
            exit 0
          fi

          python -m src.pit_replay_builder --force --sport "${SPORT_NAME}"
          python scripts/pymc_pit_shadow_dataset.py             --sport "${SPORT_NAME}"             --db data/db/sports_v45.sqlite             --out "results/research/pymc_pit_shadow_dataset_${SPORT_NAME}.json"

      - name: Fit PyMC real-data shadow
        env:
          SPORT_NAME: ${{ matrix.sport }}
        run: |
          set -euo pipefail
          dataset="results/research/pymc_pit_shadow_dataset_${SPORT_NAME}.json"
          output="results/research/pymc_real_shadow_${SPORT_NAME}.json"
          if python - "$dataset" <<'PY'
          import json,sys
          from pathlib import Path
          obj=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          raise SystemExit(0 if obj.get("status")=="READY" else 1)
          PY
          then
            python scripts/research_pymc_real_shadow.py               --dataset "$dataset"               --output "$output"
          else
            python - "$dataset" "$output" <<'PY'
          import json,sys
          from pathlib import Path
          dataset=Path(sys.argv[1])
          output=Path(sys.argv[2])
          obj=json.loads(dataset.read_text(encoding="utf-8"))
          output.write_text(json.dumps({
              "status":"BLOCKED_PIT_DATASET",
              "sport":obj.get("sport"),
              "dataset_status":obj.get("status"),
              "research_only":True,
              "production_dependency":False,
              "automatic_promotion":False,
              "promotion_status":"HOLD",
          },ensure_ascii=False,indent=2)+"
",encoding="utf-8")
          PY
          fi

      - name: Upload real shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-core-pymc-real-shadow-${{ matrix.sport }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 21
          path: |
            results/research/pymc_pit_shadow_dataset_${{ matrix.sport }}.json
            results/research/pymc_real_shadow_${{ matrix.sport }}.json
