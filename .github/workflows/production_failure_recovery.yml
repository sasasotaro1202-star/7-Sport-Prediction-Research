name: Production Failure Recovery

on:
  workflow_run:
    # Recover only production/data workflows. Validator and watchdog
    # completions are intentionally excluded to prevent recursive skipped-run
    # storms and needless scheduler churn.
    workflows:
      - Active-Scope Target v4.5.15 Production
      - PIT History Expansion
      - Rugby Coverage Production
      - Boxing PIT Source Guard
    types: [completed]

permissions:
  actions: write
  contents: write

concurrency:
  # Global single-writer lock for the append-only failure memory. Recovery
  # decisions remain isolated by run id, but ledger writes must serialize.
  group: production-failure-memory
  cancel-in-progress: false

jobs:
  retry-transient-failure:
    if: >-
      (
        github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'timed_out' ||
        github.event.workflow_run.conclusion == 'startup_failure'
      ) &&
      github.event.workflow_run.run_attempt < 2 &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main for failure-memory write
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Record failed run in append-only failure ledger
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          ORIGINAL_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          jobs_json="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")"
          failed_jobs_json="$(printf '%s' "$jobs_json" | python -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps([j["name"] for j in d.get("jobs",[]) if j.get("conclusion") not in (None,"success","skipped")], ensure_ascii=False))')"
          readarray -t failed_jobs < <(printf '%s' "$failed_jobs_json" | python -c 'import json,sys; [print(x) for x in json.load(sys.stdin)]')
          ledger_args=()
          for job in "${failed_jobs[@]}"; do
            ledger_args+=(--failed-job "$job")
          done
          python -m src.production_failure_ledger \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --workflow "$WORKFLOW_NAME" \
            --head-sha "$ORIGINAL_SHA" \
            --conclusion "$CONCLUSION" \
            --event "$EVENT_NAME" \
            "${ledger_args[@]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/failure_ledger.jsonl
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'FAILURE_LEDGER_COMMIT=NOOP'
          else
            git fetch origin main
            git rebase origin/main
            git add results/failure_ledger.jsonl
            git diff --cached --check
            git commit -m "chore: record production failure ${RUN_ID} attempt ${RUN_ATTEMPT}"
            git push origin HEAD:main
            echo 'FAILURE_LEDGER_COMMIT=SUCCESS'
          fi

      - name: Recover once without replaying a stale SHA
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ORIGINAL_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          echo "Recovery target: ${REPOSITORY} run ${RUN_ID} original_sha=${ORIGINAL_SHA} current_main=${current_sha}"
          if [ "${current_sha}" != "${ORIGINAL_SHA}" ]; then
            echo "STALE_FAILED_RUN=TRUE; starting one fresh bounded run on current main."
            gh workflow run "${WORKFLOW_ID}" --ref main --repo "${REPOSITORY}"
            echo "Requested fresh run for the current main SHA."
          else
            echo "STALE_FAILED_RUN=FALSE; retrying failed jobs once."
            gh run rerun "${RUN_ID}" --failed --repo "${REPOSITORY}"
            echo "Requested one bounded retry of failed jobs."
          fi
