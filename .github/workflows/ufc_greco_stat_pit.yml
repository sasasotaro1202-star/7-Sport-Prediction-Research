name: UFC Greco Stats PIT Research

on:
  push:
    branches:
      - research/ufc-greco-stat-pit-20260925
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ufc-greco-stat-pit
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Restore safe UFC research database
        uses: actions/cache/restore@v4
        with:
          path: data/db
          key: ufc-greco-stat-pit-research-${{ github.run_id }}
          restore-keys: |
            nine-sport-target-db-v4-ufc-pit-
            nine-sport-target-db-v4-ufc-
            pit-history-seed-ufc-
      - name: Validate database
        run: python -m src.cache_health --db data/db/sports_v45.sqlite --sport ufc
      - name: Compile source
        run: python -m compileall -q src
      - name: Unit regression
        run: PYTHONPATH=. python scripts/test_ufc_greco_stat_pit.py
      - name: Count strict replay rows before
        run: |
          set -euo pipefail
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          c=sqlite3.connect('data/db/sports_v45.sqlite')
          n=c.execute("""SELECT COUNT(*) FROM pit_replay
                         WHERE replay_status='REPLAYABLE'
                           AND leakage_status='CLEAN'
                           AND event_id IN (SELECT event_id FROM event WHERE sport='ufc')""").fetchone()[0]
          c.close()
          print(f"STRICT_BEFORE={int(n)}")
          Path('results/greco_before.txt').write_text(str(int(n)),encoding='utf-8')
          PY
      - name: Clone Greco source history
        run: |
          set -euo pipefail
          rm -rf /tmp/greco
          git clone --filter=blob:none --no-checkout https://github.com/Greco1899/scrape_ufc_stats.git /tmp/greco
          test -d /tmp/greco/.git
          git -C /tmp/greco rev-parse HEAD
      - name: Reset experiment holdout registry to current research database
        run: |
          set -euo pipefail
          rm -f results/research/ufc_frozen_holdout.json
          rm -f results/ufc_before_greco.json results/ufc_greco_feature_comparison.json
      - name: Baseline UFC research before Greco PIT enrichment
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 1800s python -m src.research_cycle_strict --sport ufc
          test -s results/research/ufc.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/research/ufc.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          if obj.get('status') != 'TRAINED':
              raise SystemExit(f"BASELINE_NOT_TRAINED:{obj.get('status')}")
          Path('results/ufc_before_greco.json').write_text(json.dumps(obj,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'baseline_status':obj.get('status'),'baseline_training_rows':obj.get('training_rows'),'baseline_holdout_rows':obj.get('frozen_holdout_rows'),'baseline_holdout':obj.get('holdout_metrics')},ensure_ascii=False,indent=2))
          PY
      - name: Backfill exact Git-history PIT stats
        run: PYTHONPATH=. python -m src.ufc_greco_stat_pit --db data/db/sports_v45.sqlite --upstream-dir /tmp/greco --output results/ufc_greco_stat_pit.json
      - name: Force strict PIT replay
        run: PYTHONPATH=. python -m src.pit_replay_builder --sport ufc --force
      - name: Independent leakage audit
        run: PYTHONPATH=. python -m src.independent_leakage_audit
      - name: Measure verified gain
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sqlite3
          from pathlib import Path
          c=sqlite3.connect('data/db/sports_v45.sqlite')
          n=c.execute("""SELECT COUNT(*) FROM pit_replay
                         WHERE replay_status='REPLAYABLE'
                           AND leakage_status='CLEAN'
                           AND event_id IN (SELECT event_id FROM event WHERE sport='ufc')""").fetchone()[0]
          s=c.execute("""SELECT COUNT(*) FROM match_stats
                         WHERE sport='ufc' AND source='Greco1899/scrape_ufc_stats'
                           AND quality_status='EXACT'""").fetchone()[0]
          c.close()
          before=int(Path('results/greco_before.txt').read_text())
          p=Path('results/ufc_greco_stat_pit.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          r['strict_replayable_rows_before']=before
          r['strict_replayable_rows_after']=int(n)
          r['strict_replayable_row_gain']=int(n)-before
          r['greco_exact_match_stats_rows_current']=int(s)
          p.write_text(json.dumps(r,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(r,ensure_ascii=False,indent=2))
          PY
      - name: Re-run UFC research with Greco PIT stats (research-only)
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 1800s python -m src.research_cycle_strict --sport ufc
      - name: Compare Greco PIT candidate against identical frozen holdout baseline
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path('results/ufc_before_greco.json').read_text(encoding='utf-8'))
          after=json.loads(Path('results/research/ufc.json').read_text(encoding='utf-8'))
          if before.get('status') != 'TRAINED' or after.get('status') != 'TRAINED':
              raise SystemExit(f"RESEARCH_COMPARISON_REQUIRES_TRAINED:before={before.get('status')}:after={after.get('status')}")
          bm=before.get('holdout_metrics') or {}
          am=after.get('holdout_metrics') or {}
          def selected_oos(obj):
              models=obj.get('models') or []
              ensemble=obj.get('ensemble_selection') or {}
              if models:
                  key='+'.join(models)
                  if key in ensemble:
                      return ensemble[key]
                  singles=[(ensemble.get(m) or {}) for m in models if m in ensemble]
                  if singles:
                      return {
                          'logloss': sum(float(x['logloss']) for x in singles)/len(singles),
                          'brier': sum(float(x['brier']) for x in singles)/len(singles),
                          'ece': sum(float(x['ece']) for x in singles)/len(singles),
                          'n': sum(int(x.get('n',0)) for x in singles),
                      }
              return {}
          bo=selected_oos(before)
          ao=selected_oos(after)
          out={
              'research_only': True,
              'production_model_changed': False,
              'before_status': before.get('status'),
              'after_status': after.get('status'),
              'before_model': bm.get('models') or bm.get('model'),
              'after_model': am.get('models') or am.get('model'),
              'before_training_rows': before.get('training_rows'),
              'after_training_rows': after.get('training_rows'),
              'before_holdout_rows': before.get('frozen_holdout_rows'),
              'after_holdout_rows': after.get('frozen_holdout_rows'),
              'before_oos_logloss': bo.get('logloss'),
              'after_oos_logloss': ao.get('logloss'),
              'oos_logloss_improvement': (float(bo['logloss'])-float(ao['logloss'])) if bo.get('logloss') is not None and ao.get('logloss') is not None else None,
              'before_oos_brier': bo.get('brier'),
              'after_oos_brier': ao.get('brier'),
              'oos_brier_improvement': (float(bo['brier'])-float(ao['brier'])) if bo.get('brier') is not None and ao.get('brier') is not None else None,
              'before_oos_ece': bo.get('ece'),
              'after_oos_ece': ao.get('ece'),
              'before_holdout_logloss': bm.get('logloss'),
              'after_holdout_logloss': am.get('logloss'),
              'holdout_logloss_improvement': (float(bm['logloss'])-float(am['logloss'])) if bm.get('logloss') is not None and am.get('logloss') is not None else None,
              'before_holdout_brier': bm.get('brier'),
              'after_holdout_brier': am.get('brier'),
              'holdout_brier_improvement': (float(bm['brier'])-float(am['brier'])) if bm.get('brier') is not None and am.get('brier') is not None else None,
              'before_holdout_accuracy': bm.get('accuracy'),
              'after_holdout_accuracy': am.get('accuracy'),
              'before_holdout_ece': bm.get('ece'),
              'after_holdout_ece': am.get('ece'),
              'after_case_risk_status': after.get('case_risk_status'),
              'after_dynamic_router_status': after.get('dynamic_router_status'),
              'same_frozen_holdout_registry_hash': before.get('frozen_holdout_registry_hash') == after.get('frozen_holdout_registry_hash'),
              'before_frozen_holdout_registry_hash': before.get('frozen_holdout_registry_hash'),
              'after_frozen_holdout_registry_hash': after.get('frozen_holdout_registry_hash'),
          }
          if not out['same_frozen_holdout_registry_hash']:
              raise SystemExit('FROZEN_HOLDOUT_REGISTRY_CHANGED')
          Path('results/ufc_greco_feature_comparison.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Save research database
        uses: actions/cache/save@v4
        with:
          path: data/db
          key: ufc-greco-stat-pit-research-${{ github.run_id }}
      - name: Upload PIT report
        uses: actions/upload-artifact@v4
        with:
          name: ufc-greco-stat-pit-${{ github.run_id }}
          path: results/ufc_greco_stat_pit.json
          retention-days: 14
          if-no-files-found: error
