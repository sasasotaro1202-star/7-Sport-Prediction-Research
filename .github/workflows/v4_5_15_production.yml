# Canonical production workflow. Source outages degrade coverage; unsafe models are never published.
name: Eight Sport v4.5.15 Production
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - 'src/**'
      - '.github/workflows/v4_5_15_production.yml'
      - 'requirements.txt'
permissions:
  contents: write
concurrency:
  group: eight-sport-canonical-production
  cancel-in-progress: true
env:
  PYTHONUNBUFFERED: '1'
jobs:
  collect:
    name: Collect ${{ matrix.sport }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        sport: [valorant, basketball, volleyball, ufc, rizin]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies with transient-network retry
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - run: mkdir -p data/raw/http_cache data/db results models
      - name: Restore latest safe database cache
        uses: actions/cache/restore@v4
        with:
          path: data/db
          key: eight-sport-db-v4-${{ matrix.sport }}-${{ github.sha }}
          restore-keys: |
            eight-sport-db-v4-${{ matrix.sport }}-
      - name: Validate/repair restored database before collection
        run: python -m src.cache_health --db data/db/sports_v45.sqlite --sport ${{ matrix.sport }} --repair
      - name: Initialize schema
        run: python -c "from src.storage.db_v45 import connect; c=connect(); c.close()"
      - name: Incremental collector (source failures degrade explicitly)
        run: |
          set -uo pipefail
          collector_rc=0
          if python -m src.seven_sport_production --sport ${{ matrix.sport }} --days-back 3; then echo 'collector_status=OK'; else collector_rc=$?; echo "collector_status=DEGRADED collector_exit=$collector_rc"; fi
          backfill_rc=0
          case '${{ matrix.sport }}' in
            basketball) if timeout --signal=TERM 300s python -m src.basketball_cdn_backfill --both; then echo 'basketball_backfill_status=OK'; else backfill_rc=$?; echo "basketball_backfill_status=DEGRADED exit=$backfill_rc"; fi ;;
            volleyball) if timeout --signal=TERM 300s python -m src.volleyball_fivb_vis_backfill; then echo 'volleyball_backfill_status=OK'; else backfill_rc=$?; echo "volleyball_backfill_status=DEGRADED exit=$backfill_rc"; fi ;;
            valorant|rizin) if timeout --signal=TERM 300s python -m src.public_history_backfill --sports '${{ matrix.sport }}'; then echo '${{ matrix.sport }}_backfill_status=OK'; else backfill_rc=$?; echo "${{ matrix.sport }}_backfill_status=DEGRADED exit=$backfill_rc"; fi ;;
            ufc) if timeout --signal=TERM 120s python -m src.ufc_api_backfill --limit 200; then echo 'ufc_backfill_status=OK'; else backfill_rc=$?; echo "ufc_backfill_status=DEGRADED exit=$backfill_rc"; fi ;;
          esac
          guard_rc=0
          if python -m src.collection_guard --sport ${{ matrix.sport }}; then echo 'collection_guard_status=OK'; else guard_rc=$?; echo "collection_guard_status=FAILED exit=$guard_rc"; fi
          if [ "$guard_rc" -ne 0 ]; then echo 'ERROR: collection guard failed; refusing to mark partition healthy.' >&2; exit "$guard_rc"; fi
          if [ "$collector_rc" -ne 0 ] && [ "$backfill_rc" -ne 0 ]; then echo 'WARNING: all collection paths degraded; release gate will decide whether coverage is safe.' >&2; fi
          exit 0
      - name: Save database
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/db
          key: eight-sport-db-v4-${{ matrix.sport }}-${{ github.run_id }}
  merge:
    name: Merge, research, and release gate
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies with transient-network retry
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - run: mkdir -p hourly-artifacts/{valorant,basketball,volleyball,ufc,rizin} data/db results models
      - name: Clear merge working database
        run: rm -f data/db/sports_v45.sqlite
      - name: Restore VALORANT
        uses: actions/cache/restore@v4
        with:
          path: data/db
          key: eight-sport-db-v4-valorant-${{ github.run_id }}
      - name: Materialize VALORANT partition
        run: test -s data/db/sports_v45.sqlite && cp data/db/sports_v45.sqlite hourly-artifacts/valorant/sports_v45.sqlite
      - name: Clear merge working database
        run: rm -f data/db/sports_v45.sqlite
      - name: Restore Basketball
        uses: actions/cache/restore@v4
        with:
          path: data/db
          key: eight-sport-db-v4-basketball-${{ github.run_id }}
      - name: Materialize Basketball partition
        run: test -s data/db/sports_v45.sqlite && cp data/db/sports_v45.sqlite hourly-artifacts/basketball/sports_v45.sqlite
      - name: Clear merge working database
        run: rm -f data/db/sports_v45.sqlite
      - name: Restore Volleyball
        uses: actions/cache/restore@v4
        with:
          path: data/db
          key: eight-sport-db-v4-volleyball-${{ github.run_id }}
      - name: Materialize Volleyball partition
        run: test -s data/db/sports_v45.sqlite && cp data/db/sports_v45.sqlite hourly-artifacts/volleyball/sports_v45.sqlite
      - name: Clear merge working database
        run: rm -f data/db/sports_v45.sqlite
      - name: Restore UFC
        uses: actions/cache/restore@v4
        with:
          path: data/db
          key: eight-sport-db-v4-ufc-${{ github.run_id }}
      - name: Materialize UFC partition
        run: test -s data/db/sports_v45.sqlite && cp data/db/sports_v45.sqlite hourly-artifacts/ufc/sports_v45.sqlite
      - name: Clear merge working database
        run: rm -f data/db/sports_v45.sqlite
      - name: Restore RIZIN
        uses: actions/cache/restore@v4
        with:
          path: data/db
          key: eight-sport-db-v4-rizin-${{ github.run_id }}
      - name: Materialize RIZIN partition only when coverage is actually present
        run: |
          set -euo pipefail
          if [ ! -s data/db/sports_v45.sqlite ]; then
            echo 'RIZIN_PARTITION=DEFERRED_NO_DB'
            exit 0
          fi
          events=$(python -c "import sqlite3; c=sqlite3.connect('data/db/sports_v45.sqlite'); print(c.execute(\"SELECT COUNT(*) FROM event WHERE sport='rizin'\").fetchone()[0]); c.close()")
          if [ "$events" -gt 0 ]; then
            cp data/db/sports_v45.sqlite hourly-artifacts/rizin/sports_v45.sqlite
            echo "RIZIN_PARTITION=PASS events=$events"
          else
            echo "RIZIN_PARTITION=DEFERRED events=$events"
          fi
      - name: Clear merge working database
        run: rm -f data/db/sports_v45.sqlite
      - name: Deferred scope note
        run: echo 'F1 and Rugby are intentionally deferred by project scope; no collection partition is required.'
      - name: Verify restored partitions are valid and non-empty
        run: |
          set -euo pipefail
          for sport in valorant basketball volleyball ufc; do
            test -s "hourly-artifacts/$sport/sports_v45.sqlite"
            python -m src.partition_cache_guard --db "hourly-artifacts/$sport/sports_v45.sqlite" --sport "$sport"
          done
          if [ -s hourly-artifacts/rizin/sports_v45.sqlite ]; then
            python -m src.partition_cache_guard --db hourly-artifacts/rizin/sports_v45.sqlite --sport rizin
          else
            echo 'RIZIN_PARTITION=DEFERRED'
          fi
      - name: Merge partitions
        run: python -m src.merge_partition_dbs --input-dir hourly-artifacts
      - name: Robust adapters
        run: python -m src.robust_sport_adapters_v4
      - name: Outcomes
        run: python -m src.outcome_backfill
      - name: Strict PIT replay
        run: python -m src.pit_replay_builder
      - name: Independent leakage audit
        run: python -m src.independent_leakage_audit
      - name: Research with frozen holdout
        run: python -m src.research_cycle_strict
      - name: Quality report (non-failing coverage mode)
        run: python -m src.quality_gate
      - name: Reproducibility manifest
        run: python -m src.reproducibility_manifest
      - name: Release gate
        run: python -m src.production_release_gate
      - name: Production invariants
        run: python -m src.production_invariants
      - name: Compile check
        run: python -m compileall -q src
      - name: Persist safe outputs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if python -c "import json; from pathlib import Path; p=Path('results/release_gate.json'); raise SystemExit(0 if p.exists() and json.loads(p.read_text()).get('publish') is True else 1)"; then
            git add results models
            echo 'release_gate=READY: models may be published'
          else
            git add results
            echo 'release_gate!=READY: model artifacts remain uncommitted and are not published'
          fi
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: update eight-sport research results'
          git fetch origin main
          if ! git rebase --autostash origin/main; then
            git rebase --abort || true
            echo 'ERROR: main advanced with a non-replayable generated-output conflict.' >&2
            exit 1
          fi
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin main
            if ! git rebase --autostash origin/main; then
              git rebase --abort || true
              echo 'ERROR: generated-output commit conflicted while synchronizing main.' >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
