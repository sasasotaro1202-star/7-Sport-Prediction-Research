# Canonical production workflow. Source outages degrade coverage; unsafe models are never published.
name: Seven Sport v4.5.15 Production
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - 'src/**'
      - '.github/workflows/v4_5_15_production.yml'
      - 'requirements.txt'
permissions:
  contents: write
concurrency:
  group: seven-sport-canonical-production
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: '1'
jobs:
  collect:
    name: Collect ${{ matrix.sport }}
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        sport: [valorant, basketball, volleyball, tennis, ufc, rizin, f1]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies with transient-network retry
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - run: mkdir -p data/raw/http_cache data/db results models
      - name: Restore persistent database
        uses: actions/cache/restore@v4
        with:
          path: data/db/sports_v45.sqlite
          key: seven-sport-db-v3-${{ matrix.sport }}-${{ github.run_id }}
          restore-keys: seven-sport-db-v3-${{ matrix.sport }}-
      - name: Initialize schema
        run: python -c "from src.storage.db_v45 import connect; c=connect(); c.close()"
      - name: Incremental collector (source failures degrade explicitly)
        run: |
          set -uo pipefail
          collector_rc=0
          if python -m src.seven_sport_production --sport ${{ matrix.sport }} --days-back 3; then echo 'collector_status=OK'; else collector_rc=$?; echo "collector_status=DEGRADED collector_exit=$collector_rc"; fi
          backfill_rc=0
          case '${{ matrix.sport }}' in
            basketball) if timeout --signal=TERM 300s python -m src.basketball_cdn_backfill --both; then echo 'basketball_backfill_status=OK'; else backfill_rc=$?; echo "basketball_backfill_status=DEGRADED exit=$backfill_rc"; fi ;;
            tennis) if timeout --signal=TERM 300s python -m src.tennis_public_backfill; then echo 'tennis_backfill_status=OK'; else backfill_rc=$?; echo "tennis_backfill_status=DEGRADED exit=$backfill_rc"; fi ;;
            volleyball) if timeout --signal=TERM 300s python -m src.volleyball_fivb_vis_backfill; then echo 'volleyball_backfill_status=OK'; else backfill_rc=$?; echo "volleyball_backfill_status=DEGRADED exit=$backfill_rc"; fi ;;
            valorant|rizin) if timeout --signal=TERM 300s python -m src.public_history_backfill --sports '${{ matrix.sport }}'; then echo '${{ matrix.sport }}_backfill_status=OK'; else backfill_rc=$?; echo "${{ matrix.sport }}_backfill_status=DEGRADED exit=$backfill_rc"; fi ;;
            f1) if timeout --signal=TERM 45s python -m src.f1_openf1_backfill --start-year 2023 --end-year 2026 --timeout 15; then echo 'f1_backfill_status=OK'; else backfill_rc=$?; echo "f1_backfill_status=DEGRADED exit=$backfill_rc"; fi ;;
            ufc) echo 'ufc_backfill_status=NOT_REQUIRED' ;;
          esac
          guard_rc=0
          if python -m src.collection_guard --sport ${{ matrix.sport }}; then echo 'collection_guard_status=OK'; else guard_rc=$?; echo "collection_guard_status=FAILED exit=$guard_rc"; fi
          if [ "$guard_rc" -ne 0 ]; then echo 'ERROR: collection guard failed; refusing to mark partition healthy.' >&2; exit "$guard_rc"; fi
          if [ "$collector_rc" -ne 0 ] && [ "$backfill_rc" -ne 0 ]; then echo 'WARNING: all collection paths degraded; release gate will decide whether coverage is safe.' >&2; fi
          exit 0
      - name: Save database
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/db/sports_v45.sqlite
          key: seven-sport-db-v3-${{ matrix.sport }}-${{ github.run_id }}
  merge:
    name: Merge, research, and release gate
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies with transient-network retry
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - run: mkdir -p hourly-artifacts/{valorant,basketball,volleyball,tennis,ufc,rizin,f1} data/db results models
      - name: Clear merge working database
        run: rm -f data/db/sports_v45.sqlite
      - name: Restore VALORANT
        uses: actions/cache/restore@v4
        with:
          path: data/db/sports_v45.sqlite
          key: seven-sport-db-v3-valorant-${{ github.run_id }}
          restore-keys: seven-sport-db-v3-valorant-
      - name: Materialize VALORANT partition
        run: test -s data/db/sports_v45.sqlite && cp data/db/sports_v45.sqlite hourly-artifacts/valorant/sports_v45.sqlite
      - name: Clear merge working database
        run: rm -f data/db/sports_v45.sqlite
      - name: Restore Basketball
        uses: actions/cache/restore@v4
        with:
          path: data/db/sports_v45.sqlite
          key: seven-sport-db-v3-basketball-${{ github.run_id }}
          restore-keys: seven-sport-db-v3-basketball-
      - name: Materialize Basketball partition
        run: test -s data/db/sports_v45.sqlite && cp data/db/sports_v45.sqlite hourly-artifacts/basketball/sports_v45.sqlite
      - name: Clear merge working database
        run: rm -f data/db/sports_v45.sqlite
      - name: Restore Volleyball
        uses: actions/cache/restore@v4
        with:
          path: data/db/sports_v45.sqlite
          key: seven-sport-db-v3-volleyball-${{ github.run_id }}
          restore-keys: seven-sport-db-v3-volleyball-
      - name: Materialize Volleyball partition
        run: test -s data/db/sports_v45.sqlite && cp data/db/sports_v45.sqlite hourly-artifacts/volleyball/sports_v45.sqlite
      - name: Clear merge working database
        run: rm -f data/db/sports_v45.sqlite
      - name: Restore Tennis
        uses: actions/cache/restore@v4
        with:
          path: data/db/sports_v45.sqlite
          key: seven-sport-db-v3-tennis-${{ github.run_id }}
          restore-keys: seven-sport-db-v3-tennis-
      - name: Materialize Tennis partition
        run: test -s data/db/sports_v45.sqlite && cp data/db/sports_v45.sqlite hourly-artifacts/tennis/sports_v45.sqlite
      - name: Clear merge working database
        run: rm -f data/db/sports_v45.sqlite
      - name: Restore UFC
        uses: actions/cache/restore@v4
        with:
          path: data/db/sports_v45.sqlite
          key: seven-sport-db-v3-ufc-${{ github.run_id }}
          restore-keys: seven-sport-db-v3-ufc-
      - name: Materialize UFC partition
        run: test -s data/db/sports_v45.sqlite && cp data/db/sports_v45.sqlite hourly-artifacts/ufc/sports_v45.sqlite
      - name: Clear merge working database
        run: rm -f data/db/sports_v45.sqlite
      - name: Restore RIZIN
        uses: actions/cache/restore@v4
        with:
          path: data/db/sports_v45.sqlite
          key: seven-sport-db-v3-rizin-${{ github.run_id }}
          restore-keys: seven-sport-db-v3-rizin-
      - name: Materialize RIZIN partition
        run: test -s data/db/sports_v45.sqlite && cp data/db/sports_v45.sqlite hourly-artifacts/rizin/sports_v45.sqlite
      - name: Clear merge working database
        run: rm -f data/db/sports_v45.sqlite
      - name: Restore F1
        uses: actions/cache/restore@v4
        with:
          path: data/db/sports_v45.sqlite
          key: seven-sport-db-v3-f1-${{ github.run_id }}
          restore-keys: seven-sport-db-v3-f1-
      - name: Materialize F1 partition
        run: test -s data/db/sports_v45.sqlite && cp data/db/sports_v45.sqlite hourly-artifacts/f1/sports_v45.sqlite
      - name: Verify partition files
        run: |
          set -euo pipefail
          for sport in valorant basketball volleyball tennis ufc rizin f1; do test -s hourly-artifacts/$sport/sports_v45.sqlite; done
      - name: Merge partitions
        run: python -m src.merge_partition_dbs --input-dir hourly-artifacts
      - name: Robust adapters
        run: python -m src.robust_sport_adapters_v4
      - name: F1 integrity
        run: python -m src.f1_integrity_cleanup --vacuum
      - name: Outcomes
        run: python -m src.outcome_backfill
      - name: Strict PIT replay
        run: python -m src.pit_replay_builder
      - name: Independent leakage audit
        run: python -m src.independent_leakage_audit
      - name: Research with frozen holdout
        run: python -m src.research_cycle_strict
      - name: Quality report (non-failing coverage mode)
        run: python -m src.quality_gate
      - name: Release gate
        run: python -m src.production_release_gate
      - name: Production invariants
        run: python -m src.production_invariants
      - name: Compile check
        run: python -m compileall -q src
      - name: Persist safe outputs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/release_gate.json')
          if not p.exists() or json.loads(p.read_text()).get('publish') is not True:
              raise SystemExit(1)
          PY
          then
            git add results models
            echo 'release_gate=READY: models may be published'
          else
            git add results
            echo 'release_gate!=READY: model artifacts remain uncommitted and are not published'
          fi
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: update seven-sport research results'
          git fetch origin main
          if ! git rebase --autostash origin/main; then
            git rebase --abort || true
            echo 'ERROR: main advanced with a non-replayable generated-output conflict.' >&2
            exit 1
          fi
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin main
            if ! git rebase --autostash origin/main; then
              git rebase --abort || true
              echo 'ERROR: generated-output commit conflicted while synchronizing main.' >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
