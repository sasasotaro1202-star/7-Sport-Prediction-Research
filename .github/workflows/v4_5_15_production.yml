
      - name: Future prediction inference
        id: future_prediction
        run: |
          set -euo pipefail
          # Canonical hourly production is centered on T-60. Adaptive routing
          # may move within the bounded 45-75 minute window when a validated
          # timing route is available.
          python -m src.future_predictor --adaptive-timing --lead-minutes 60 --min-lead-minutes 45 --max-lead-minutes 75 --target-scope-only
      - name: Production route observability
        id: route_observability
        run: |
          set -euo pipefail
          python -m src.prediction_route_observability
      - name: Upload production route observability
        if: always()