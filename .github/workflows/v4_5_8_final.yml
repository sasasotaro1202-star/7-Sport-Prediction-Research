name: Seven Sport v4.5.8 Final

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: seven-sport-hourly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  hourly:
    strategy:
      fail-fast: false
      matrix:
        sport: [valorant, basketball, volleyball, tennis, ufc, rizin, f1]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Collect one sport incrementally
        run: python -m src.seven_sport_production --sport ${{ matrix.sport }} --days-back 14
      - name: Run quality gate
        run: python -m src.quality_gate --strict
      - name: Persist outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data results
          git diff --cached --quiet || git commit -m "chore: update ${{ matrix.sport }} research data"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-5-8-${{ matrix.sport }}
          path: |
            results/**
            data/**
          if-no-files-found: warn
