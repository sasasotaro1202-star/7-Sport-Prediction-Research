name: Seven Sport v4.5.8 Final

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  full-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m src.v458_final_cycle --days-back 3650 --lead-minutes 60
      - name: Persist research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data results models || true
          git diff --cached --quiet || git commit -m "chore: update seven-sport research data"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: v4-5-8-results
          path: |
            results/**
            data/**
            models/**
          if-no-files-found: warn
