name: Seven Sport v4.5.8 Final

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: seven-sport-hourly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    name: Incremental ${{ matrix.sport }}
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        sport: [valorant, basketball, volleyball, tennis, ufc, rizin, f1]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Collect one sport incrementally
        env:
          V45_HTTP_TIMEOUT: '10'
          V45_HTTP_RETRIES: '1'
          V45_REQUEST_DELAY: '0.05'
          V45_VLR_PAGES: '20'
        run: python -m src.seven_sport_production --sport ${{ matrix.sport }} --days-back 3
      - name: Upload sport partition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-${{ matrix.sport }}-${{ github.run_id }}
          path: |
            data/db/sports_v45.sqlite
            results/**
          if-no-files-found: warn

  merge:
    name: Merge hourly partitions
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Download sport partitions
        uses: actions/download-artifact@v4
        with:
          pattern: hourly-*
          path: hourly-artifacts
          merge-multiple: false
      - name: Merge incremental databases
        run: python -m src.merge_partition_dbs --input-dir hourly-artifacts
      - name: Structural quality gate
        run: python -m src.quality_gate
      - name: Persist merged outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data results
          git diff --cached --quiet || git commit -m "chore: update seven-sport research data"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-5-8-merged-${{ github.run_id }}
          path: |
            results/**
            data/**
          if-no-files-found: warn
