name: Seven Sport v4.5.9 Production Hourly

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: seven-sport-hourly
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  collect:
    name: Incremental ${{ matrix.sport }}
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        sport: [valorant, basketball, volleyball, tennis, ufc, rizin, f1]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore source cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/http_cache
          key: seven-sport-http-${{ matrix.sport }}-${{ hashFiles('src/seven_sport_production.py') }}
          restore-keys: |
            seven-sport-http-${{ matrix.sport }}-
      - run: python -m pip install -r requirements.txt
      - name: Collect one sport incrementally
        env:
          V45_HTTP_TIMEOUT: '10'
          V45_HTTP_RETRIES: '1'
          V45_REQUEST_DELAY: '0.03'
          V45_HTTP_WORKERS: '8'
          V45_VLR_PAGES: '20'
        run: python -m src.seven_sport_production --sport ${{ matrix.sport }} --days-back 3
      - name: Save source cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/http_cache
          key: seven-sport-http-${{ matrix.sport }}-${{ hashFiles('src/seven_sport_production.py') }}-${{ github.run_id }}
      - name: Upload sport partition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-${{ matrix.sport }}-${{ github.run_id }}
          path: |
            data/db/sports_v45.sqlite
            results/**
          if-no-files-found: warn

  merge:
    name: Merge hourly partitions
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Download sport partitions
        uses: actions/download-artifact@v4
        with:
          pattern: hourly-*
          path: hourly-artifacts
          merge-multiple: false
      - name: Merge incremental databases
        run: python -m src.merge_partition_dbs --input-dir hourly-artifacts
      - name: Structural quality gate
        continue-on-error: true
        run: python -m src.quality_gate
      - name: Persist merged outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data results
          git diff --cached --quiet || git commit -m "chore: update seven-sport research data"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-5-9-merged-${{ github.run_id }}
          path: |
            results/**
            data/**
          if-no-files-found: warn
