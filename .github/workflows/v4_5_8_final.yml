name: Seven Sport v4.5.9 Production Hourly

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    paths:
      - 'src/**'
      - '.github/workflows/v4_5_8_final.yml'
      - '.gitignore'
      - 'requirements.txt'

concurrency:
  group: seven-sport-main-writer
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  collect:
    name: Incremental ${{ matrix.sport }}
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        sport: [valorant, basketball, volleyball, tennis, ufc, rizin, f1]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore source cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/http_cache
          key: seven-sport-http-${{ matrix.sport }}-${{ hashFiles('src/collectors/production_v45.py', 'src/seven_sport_production.py', 'src/robust_sport_adapters_v2.py') }}
          restore-keys: seven-sport-http-${{ matrix.sport }}-
      - run: python -m pip install -r requirements.txt
      - name: Prepare runtime directories
        run: mkdir -p data/raw/http_cache data/db results models
      - name: Compile-check production code
        run: python -m compileall -q src
      - name: Collect one sport incrementally
        env:
          V45_HTTP_TIMEOUT: '10'
          V45_HTTP_RETRIES: '2'
          V45_REQUEST_DELAY: '0.02'
          V45_HTTP_WORKERS: '10'
          V45_VLR_PAGES: '20'
        run: |
          set -e
          for attempt in 1 2 3; do
            if python -m src.seven_sport_production --sport ${{ matrix.sport }} --days-back 3; then
              exit 0
            fi
            echo "collector attempt ${attempt} failed; retrying"
            sleep $((attempt * 3))
          done
          exit 1
      - name: Historical basketball backfill
        if: matrix.sport == 'basketball'
        env:
          V45_HTTP_TIMEOUT: '15'
          V45_HTTP_RETRIES: '2'
          V45_REQUEST_DELAY: '0.03'
          V45_HTTP_WORKERS: '8'
        run: python -m src.espn_backfill --sport basketball --leagues nba,wnba --start-year 2016 --end-year 2026
      - name: Historical tennis backfill
        if: matrix.sport == 'tennis'
        env:
          V45_HTTP_TIMEOUT: '15'
          V45_HTTP_RETRIES: '2'
          V45_REQUEST_DELAY: '0.03'
          V45_HTTP_WORKERS: '8'
        run: python -m src.espn_backfill --sport tennis --leagues atp,wta --start-year 2016 --end-year 2026
      - name: Validate collected partition
        run: python -m src.collection_guard --sport ${{ matrix.sport }}
      - name: Enrich F1 with incremental OpenF1 data
        if: matrix.sport == 'f1'
        continue-on-error: true
        run: python -m src.f1_openf1_backfill --start-year 2023 --end-year 2026 --timeout 30
      - name: Save source cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/http_cache
          key: seven-sport-http-${{ matrix.sport }}-${{ hashFiles('src/collectors/production_v45.py', 'src/seven_sport_production.py', 'src/robust_sport_adapters_v2.py') }}-${{ github.run_id }}
      - name: Upload sport partition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-${{ matrix.sport }}-${{ github.run_id }}
          path: data/db/sports_v45.sqlite
          if-no-files-found: warn
          retention-days: 1

  merge:
    name: Merge hourly partitions
    needs: [collect]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt && python -m pip install requests beautifulsoup4 lxml
      - name: Download sport partitions
        uses: actions/download-artifact@v4
        with:
          pattern: hourly-*
          path: hourly-artifacts
          merge-multiple: false
      - name: Merge incremental databases safely
        run: python -m src.merge_partition_dbs --input-dir hourly-artifacts
      - name: Run robust adapters into merged database
        env:
          V45_HTTP_TIMEOUT: '20'
          V45_HTTP_RETRIES: '3'
          V45_REQUEST_DELAY: '0.08'
          V45_HTTP_WORKERS: '12'
        run: python -m src.robust_sport_adapters_v4
      - name: Repair malformed F1 participant relations
        run: python -m src.f1_integrity_cleanup --vacuum
      - name: Reconstruct verified outcomes once on merged database
        run: python -m src.outcome_backfill
      - name: Build strict PIT replay snapshots
        run: python -m src.pit_replay_builder
      - name: Run final merged strict PIT research cycle
        run: python -m src.research_cycle
      - name: Remove stale model artifacts before publish
        run: |
          set -euo pipefail
          find models/research -type f -name '*.joblib' ! -name '*_current.joblib' -delete 2>/dev/null || true
      - name: Global structural quality gate
        run: python -m src.quality_gate
      - name: Prediction eligibility inventory
        continue-on-error: true
        run: python -m src.prediction_policy
      - name: Final repository validation
        run: python -m compileall -q src
      - name: Persist lightweight outputs safely
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          persist_dir="$RUNNER_TEMP/seven-sport-persist"
          rm -rf "$persist_dir" && mkdir -p "$persist_dir"
          if [ -d results ]; then cp -a results "$persist_dir/results"; fi
          if [ -d models ]; then cp -a models "$persist_dir/models"; fi
          git fetch origin main
          git reset --hard origin/main
          git clean -ffdx || true
          rm -rf results models
          mkdir -p results models
          if [ -d "$persist_dir/results" ]; then cp -a "$persist_dir/results/." results/; fi
          if [ -d "$persist_dir/models" ]; then cp -a "$persist_dir/models/." models/; fi
          unexpected="$(git status --porcelain --untracked-files=all | awk '$2 !~ /^(results\/|models\/)/ {print}')"
          if [ -n "$unexpected" ]; then
            echo '::error::Unexpected working-tree changes before publish:'
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git add results models
          if git diff --cached --name-only | grep -E '^(data/db/|data/raw/http_cache/)'; then
            echo '::error::Generated DB/cache entered the staged set; refusing to push'
            exit 1
          fi
          if git diff --cached --quiet; then echo 'No lightweight output changes to publish.'; exit 0; fi
          git diff --cached --check
          git commit -m "chore: update seven-sport research results"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git merge-base --is-ancestor origin/main HEAD && git push origin HEAD:main; then echo 'push succeeded'; exit 0; fi
            echo "remote advanced or push rejected on attempt ${attempt}; rebuilding output commit"
            git reset --hard origin/main
            git clean -ffdx || true
            rm -rf results models && mkdir -p results models
            if [ -d "$persist_dir/results" ]; then cp -a "$persist_dir/results/." results/; fi
            if [ -d "$persist_dir/models" ]; then cp -a "$persist_dir/models/." models/; fi
            git add results models
            if git diff --cached --quiet; then echo 'Remote already contains equivalent lightweight outputs.'; exit 0; fi
            git diff --cached --check
            git commit -m "chore: update seven-sport research results"
            sleep $((attempt * 2))
          done
          echo '::error::final push failed after 5 deterministic retries'
          exit 1
      - name: Upload merged outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-5-9-merged-${{ github.run_id }}
          path: |
            data/db/sports_v45.sqlite
            results/**
            models/**
          if-no-files-found: warn
          retention-days: 1
