name: Maximum Future-Generalization v6 E2E

on:
  push:
    branches:
      - research/innovative-prediction-v2-20260926
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maximum-future-generalization-v6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Verify v6 sources exist
        run: |
          set -euo pipefail
          test -s src/maximum_future_generalization_v6.py
          test -s src/innovative_prediction_v2.py
          test -s scripts/test_maximum_future_generalization_v6.py
          test -s scripts/e2e_maximum_future_generalization_v6.py
          python -m compileall -q src scripts
          echo "PREFLIGHT=PASS"

  tests:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Innovative v2 regression
        run: PYTHONPATH=. python scripts/test_innovative_prediction_v2.py
      - name: Maximum v6 regression
        run: PYTHONPATH=. python scripts/test_maximum_future_generalization_v6.py

  reduced_e2e:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Run reduced synthetic chronological E2E
        run: PYTHONPATH=. python scripts/e2e_maximum_future_generalization_v6.py
      - name: Validate artifact
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/research/maximum_future_generalization_v6/e2e/e2e_report.json")
          assert p.is_file() and p.stat().st_size > 0
          x=json.loads(p.read_text())
          assert x["status"] == "REDUCED_SYNTHETIC_E2E_VERIFIED"
          assert x["pit_audit"]["available_at_lt_prediction_time"] is True
          assert x["pit_audit"]["future_label_as_feature"] is False
          print("E2E_ARTIFACT=PASS")
          print("ACCURACY", x["report"]["new"]["accuracy"])
          print("DELTA_ACCURACY", x["report"]["delta"]["accuracy"])
          print("LOGLOSS", x["report"]["new"]["logloss"])
          print("DELTA_LOGLOSS", x["report"]["delta"]["logloss"])
          print("BRIER", x["report"]["new"]["brier"])
          print("DELTA_BRIER", x["report"]["delta"]["brier"])
          print("ECE", x["report"]["new"]["ece"])
          print("DELTA_ECE", x["report"]["delta"]["ece"])
          print("COVERAGE", x["report"]["selective_prediction"])
          print("HIGH_CONFIDENCE_ACCURACY", x["report"]["high_confidence_accuracy"])
          PY
      - name: Upload v6 reduced E2E artifact
        uses: actions/upload-artifact@v4
        with:
          name: maximum-future-generalization-v6-reduced-e2e
          retention-days: 7
          path: results/research/maximum_future_generalization_v6/e2e/e2e_report.json

  contract_audit:
    needs: reduced_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: PIT and meta-leakage contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path("src/maximum_future_generalization_v6.py").read_text()
          strict=Path("src/research_cycle_strict.py").read_text()
          assert '"future_labels_as_features": False' in src
          assert '"frozen_holdout_used_for_fitting": False' in src
          assert '"retrieval_uses_current_or_future_rows": False' in src
          assert 'future_label_embargo' in src.lower()
          assert 'maximum_future_generalization_v6 as innovative_v6' in strict
          assert '"promotion": "HOLD"' in src
          assert 'def _failure_detection_metrics' in src
          assert 'def _regime_transition_metrics' in src
          assert 'previous_weights' in src
          assert 'minimum model floor' in src
          print("PIT_META_LEAKAGE_CONTRACT=PASS")
          PY
      - name: Independent leakage audit regression
        run: PYTHONPATH=. python scripts/test_independent_leakage_audit.py
      - name: Feature temporal invariance regression
        run: PYTHONPATH=. python scripts/test_feature_temporal_invariance.py
      - name: Frozen holdout regression
        run: PYTHONPATH=. python scripts/test_research_cycle_strict_holdout.py
      - name: Production invariants
        run: PYTHONPATH=. python src/production_invariants.py
      - name: Source artifact schema audit
        run: |
          set -euo pipefail
          python -m compileall -q src scripts
          echo "ARTIFACT_SCHEMA_SOURCE_AUDIT=PASS"

  promotion_gate:
    needs: contract_audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Explicit safety gate
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path("src/maximum_future_generalization_v6.py").read_text()
          assert '"promotion": "HOLD"' in src
          assert '"production_changed": False' in src
          assert '"auto_promotion": False' in src
          print("PROMOTION=HOLD")
          PY
