name: Bounded OOS Fold Budget Smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/research_cycle_strict.py"
      - "scripts/test_research_oos_fold_budget.py"
      - ".github/workflows/research_oos_fold_budget_smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal dependencies
        run: python -m pip install --retries 5 --timeout 60 numpy
      - name: Compile
        run: python -m py_compile src/research_cycle_strict.py scripts/test_research_oos_fold_budget.py
        env:
          PYTHONPATH: .
      - name: Run fold budget smoke
        run: python scripts/test_research_oos_fold_budget.py
        env:
          PYTHONPATH: .
