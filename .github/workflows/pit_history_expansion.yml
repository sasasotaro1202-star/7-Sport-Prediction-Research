name: PIT History Expansion
on:
  workflow_dispatch:
  schedule:
    # Exact 9-hour epoch cadence anchored at 00:47 UTC; watchdog remains the bounded recovery path.
    - cron: '47 0,9,18 * * *'
  # Heavy PIT expansion runs only on the true 9-hour schedule or manually.
  # Repository changes are validated by the lightweight/invariant workflows.
permissions:
  contents: read
concurrency:
  group: pit-history-expansion
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: '1'
jobs:
  expand:
    name: Expand PIT history (${{ matrix.sport }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sport: [basketball, valorant]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Determine PIT expansion execution mode
        id: cadence
        run: |
          set -euo pipefail
          echo 'run=true' >> "$GITHUB_OUTPUT"
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            echo 'PIT_9H_MODE=MANUAL'
          else
            echo 'PIT_9H_MODE=SCHEDULED_00_47_09_47_18_47_UTC'
          fi
      - uses: actions/checkout@v6
        if: steps.cadence.outputs.run == 'true'
        with:
          fetch-depth: 0
      - name: Verify workflow SHA is current main before any mutable work
        if: steps.cadence.outputs.run == 'true'
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          main_sha=$(git rev-parse origin/main)
          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "STALE_WORKFLOW_SHA current_run=$GITHUB_SHA current_main=$main_sha"
            exit 1
          fi
      - uses: actions/setup-python@v7
        if: steps.cadence.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        if: steps.cadence.outputs.run == 'true'
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Restore latest sport database
        if: steps.cadence.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/db
          key: pit-history-seed-${{ matrix.sport }}-${{ github.run_id }}
          restore-keys: |
            scope-autofill-db-v1-${{ matrix.sport }}-
            active-scope-target-db-v4-${{ matrix.sport }}-pit-
            active-scope-target-db-v4-${{ matrix.sport }}-
            nine-sport-target-db-v4-${{ matrix.sport }}-pit-
            nine-sport-target-db-v4-${{ matrix.sport }}-
      - name: Require non-empty PIT seed cache
        if: steps.cadence.outputs.run == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          sport='${{ matrix.sport }}'
          db=Path('data/db/sports_v45.sqlite')
          if not db.is_file() or db.stat().st_size <= 0:
              raise SystemExit(f'PIT_SEED_CACHE_MISSING:{sport}')
          con=sqlite3.connect(db)
          try:
              events=int(con.execute('SELECT COUNT(*) FROM event WHERE sport=?',(sport,)).fetchone()[0])
          finally:
              con.close()
          if events <= 0:
              raise SystemExit(f'PIT_SEED_CACHE_EMPTY:{sport}')
          print(f'PIT_SEED_CACHE=PASS sport={sport} events={events}')
          PY
      - name: Validate restored database
        if: steps.cadence.outputs.run == 'true'
        run: |
          python -m src.cache_health --db data/db/sports_v45.sqlite --sport ${{ matrix.sport }} --repair
          python -c "from src.storage.db_v45 import connect; c=connect(); c.close()"
      - name: Materialize immutable historical corpus
        if: steps.cadence.outputs.run == 'true' && matrix.sport == 'basketball'
        run: python -m src.basketball_cdn_backfill --historical
      - name: Record historical version provenance (strict PIT uses explicit publication evidence)
        if: steps.cadence.outputs.run == 'true'
        run: |
          set -euo pipefail
          if [ '${{ matrix.sport }}' = 'basketball' ]; then
            python -m src.bleaguer_git_provenance --db data/db/sports_v45.sqlite --workers 6
          else
            python -m src.valorant_git_provenance
          fi
      - name: Materialize exact B.LEAGUE publication-bound PIT rows
        if: steps.cadence.outputs.run == 'true' && matrix.sport == 'basketball'
        run: python -m src.bleague_exact_pit_bridge --db data/db/sports_v45.sqlite

      - name: Require applied B.LEAGUE publication-bound PIT bridge
        if: steps.cadence.outputs.run == 'true' && matrix.sport == 'basketball'
        run: python -m src.pit_history_expansion_guard --db data/db/sports_v45.sqlite --sport basketball
      - name: Build strict PIT replay history
        if: steps.cadence.outputs.run == 'true'
        run: python -m src.pit_replay_builder --force --sport ${{ matrix.sport }}
      - name: Measure PIT expansion
        if: steps.cadence.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          sport='${{ matrix.sport }}'
          con=sqlite3.connect('data/db/sports_v45.sqlite')
          rows=con.execute("SELECT COUNT(*) FROM pit_replay WHERE replay_status='REPLAYABLE' AND event_id IN (SELECT event_id FROM event WHERE sport=?)",(sport,)).fetchone()[0]
          features=con.execute("SELECT COUNT(*) FROM pit_feature_snapshot WHERE sport=? AND leakage_status='CLEAN'",(sport,)).fetchone()[0]
          exact=con.execute("SELECT COUNT(*) FROM source_snapshot WHERE availability_status='EXACT' AND sport=?",(sport,)).fetchone()[0]
          publication_bound_exact=con.execute("SELECT COUNT(*) FROM source_snapshot WHERE availability_status='EXACT' AND sport=? AND provenance_json LIKE '%PROVEN_BY_SECONDARY_DATE_BOUND%'",(sport,)).fetchone()[0]
          version=con.execute("SELECT COUNT(*) FROM source_snapshot WHERE availability_status='VERSION_EXACT_PUBLICATION_UNPROVEN' AND sport=?",(sport,)).fetchone()[0]
          events=con.execute("SELECT COUNT(*) FROM event WHERE sport=?",(sport,)).fetchone()[0]
          con.close()
          report={'status':'OK','sport':sport,'events':events,'replayable_rows':rows,'clean_pit_features':features,'exact_provenance_snapshots':exact,'secondary_publication_bound_exact_snapshots':publication_bound_exact,'version_provenance_snapshots':version}
          Path('results').mkdir(exist_ok=True)
          Path(f'results/pit_history_expansion_{sport}.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Save PIT-enriched database
        if: steps.cadence.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/db
          key: active-scope-target-db-v4-${{ matrix.sport }}-pit-${{ github.run_id }}
      - name: Upload PIT expansion report
        if: steps.cadence.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pit-history-expansion-${{ matrix.sport }}-${{ github.run_id }}
          path: results/pit_history_expansion_${{ matrix.sport }}.json
          retention-days: 14
