name: PIT History Expansion
on:
  workflow_dispatch:
  schedule:
    # GitHub cron cannot express a true rolling 9-hour cadence across UTC day boundaries.
    # Wake every 3 hours and run the expensive expansion only on 9-hour epoch boundaries.
    - cron: '47 */3 * * *'
  # Heavy PIT expansion runs on the true 9-hour schedule or manually. Pushes are
  # validated by the lightweight safety/invariant workflows instead of queuing
  # another expensive historical replay.
permissions:
  contents: read
concurrency:
  group: pit-history-expansion
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: '1'
jobs:
  expand:
    name: Expand PIT history (${{ matrix.sport }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sport: [basketball, valorant]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enforce true 9-hour cadence
        id: cadence
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' != 'schedule' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'manual/push trigger: RUN'
            exit 0
          fi
          anchor=$(date -u -d '2026-09-22 00:47:00' +%s)
          # GitHub scheduled jobs can start a little after the nominal cron time.
          # Compare at minute precision and accept a bounded boundary window so
          # normal scheduler jitter does not silently skip a real 9-hour boundary.
          now=$(date -u +%s)
          delta=$((now-anchor))
          minute_delta=$((delta / 60))
          remainder_minutes=$((minute_delta % 540))
          if [ "$delta" -lt 0 ] || { [ "$remainder_minutes" -gt 5 ] && [ "$remainder_minutes" -lt 535 ]; }; then
            echo "9-hour cadence guard: skip this 3-hour wake-up (delta=${delta}s remainder_minutes=${remainder_minutes})"
            echo 'run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'run=true' >> "$GITHUB_OUTPUT"
          echo '9-hour cadence guard: RUN'
      - uses: actions/checkout@v6
        if: steps.cadence.outputs.run == 'true'
        with:
          fetch-depth: 0
      - name: Verify workflow SHA is current main before any mutable work
        if: steps.cadence.outputs.run == 'true'
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          main_sha=$(git rev-parse origin/main)
          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "STALE_WORKFLOW_SHA current_run=$GITHUB_SHA current_main=$main_sha"
            exit 1
          fi
      - uses: actions/setup-python@v7
        if: steps.cadence.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        if: steps.cadence.outputs.run == 'true'
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Restore latest sport database
        if: steps.cadence.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/db
          key: pit-history-seed-${{ matrix.sport }}-${{ github.run_id }}
          restore-keys: |
            nine-sport-target-db-v4-${{ matrix.sport }}-pit-
            nine-sport-target-db-v4-${{ matrix.sport }}-
      - name: Validate restored database
        if: steps.cadence.outputs.run == 'true'
        run: |
          python -m src.cache_health --db data/db/sports_v45.sqlite --sport ${{ matrix.sport }} --repair
          python -c "from src.storage.db_v45 import connect; c=connect(); c.close()"
      - name: Materialize immutable historical corpus
        if: steps.cadence.outputs.run == 'true' && matrix.sport == 'basketball'
        run: python -m src.basketball_cdn_backfill --historical
      - name: Prove historical source availability
        if: steps.cadence.outputs.run == 'true'
        run: |
          set -uo pipefail
          if [ '${{ matrix.sport }}' = 'basketball' ]; then
            python -m src.bleaguer_git_provenance --db data/db/sports_v45.sqlite --workers 6
          else
            python -m src.valorant_git_provenance
          fi
      - name: Build strict PIT replay history
        if: steps.cadence.outputs.run == 'true'
        run: python -m src.pit_replay_builder --force --sport ${{ matrix.sport }}
      - name: Measure PIT expansion
        if: steps.cadence.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          sport='${{ matrix.sport }}'
          con=sqlite3.connect('data/db/sports_v45.sqlite')
          rows=con.execute("SELECT COUNT(*) FROM pit_replay WHERE replay_status='REPLAYABLE' AND event_id IN (SELECT event_id FROM event WHERE sport=?)",(sport,)).fetchone()[0]
          features=con.execute("SELECT COUNT(*) FROM pit_feature_snapshot WHERE sport=? AND leakage_status='CLEAN'",(sport,)).fetchone()[0]
          exact=con.execute("SELECT COUNT(*) FROM source_snapshot WHERE availability_status='EXACT' AND provenance_json LIKE '%github_commit_identical_blob%' ").fetchone()[0]
          events=con.execute("SELECT COUNT(*) FROM event WHERE sport=?",(sport,)).fetchone()[0]
          con.close()
          report={'status':'OK','sport':sport,'events':events,'replayable_rows':rows,'clean_pit_features':features,'exact_provenance_snapshots':exact}
          Path('results').mkdir(exist_ok=True)
          Path(f'results/pit_history_expansion_{sport}.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Save PIT-enriched database
        if: steps.cadence.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/db
          key: nine-sport-target-db-v4-${{ matrix.sport }}-pit-${{ github.run_id }}
      - name: Upload PIT expansion report
        if: steps.cadence.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pit-history-expansion-${{ matrix.sport }}-${{ github.run_id }}
          path: results/pit_history_expansion_${{ matrix.sport }}.json
          retention-days: 14
