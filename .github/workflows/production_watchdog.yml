name: Production Run Watchdog

on:
  workflow_dispatch:
  schedule:
    # Lightweight 5-minute recovery polling; the pre-event lane itself runs every 15 minutes.
    # Heavy work remains hourly/9-hourly.
    - cron: '*/5 * * * *'
  workflow_run:
    workflows:
      - Active-Scope Target v4.5.15 Production
    types: [completed]
  # Completion-trigger recovery is limited to the canonical production run.
  # Production Safety Audit and Lightweight Regression are already polled by
  # the 5-minute heartbeat below; triggering a watchdog for every validator
  # completion can create a pending-run replacement storm without improving
  # recovery latency materially.

permissions:
  actions: write
  contents: read

concurrency:
  # Never cancel a watchdog while it is actively inspecting/recovering heavy
  # runs. The workflow has its own deterministic newest-run guard; queued
  # duplicates are coalesced by GitHub concurrency semantics.
  group: production-run-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Exit cleanly when superseded by a newer watchdog run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_run_id='${{ github.run_id }}'
          watchdog_state=$(gh run list --workflow "production_watchdog.yml" --limit 50 \
            --json databaseId,status)
          latest_active=$(printf '%s' "$watchdog_state" | jq --argjson current "$current_run_id" \
            '[.[] | select(.databaseId > $current and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending"))] | length')
          if [ "$latest_active" -gt 0 ]; then
            echo "WATCHDOG_SUPERSEDED_BY_NEWER_ACTIVE_RUN current=$current_run_id newer_active=$latest_active"
            exit 0
          fi
          echo "WATCHDOG_AUTHORITATIVE_RUN current=$current_run_id"
      - name: Guard workflow-run rescue against generated-output commit loops
        id: rescue_guard
        run: |
          set -euo pipefail
          trigger='${{ github.event_name }}'
          subject=$(git log -1 --format='%s')
          eligible=true
          if [ "$trigger" = "workflow_run" ] && [ "$subject" = "chore: update active-scope research results" ]; then
            eligible=false
            echo 'SKIP_WORKFLOW_RUN_RESCUE_GENERATED_OUTPUT_COMMIT'
          fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
      - name: Retry failed validators once, then fail closed
        if: >-
          github.event_name == 'workflow_run' &&
          (
            github.event.workflow_run.name == 'Production Invariants' ||
            github.event.workflow_run.name == 'Production Safety Audit' ||
            github.event.workflow_run.name == 'Lightweight Regression and Safety Checks' ||
            github.event.workflow_run.name == 'Autonomous Research Sweep' ||
            github.event.workflow_run.name == 'Matchday Horizon Research'
          ) &&
          (
            github.event.workflow_run.conclusion == 'failure' ||
            github.event.workflow_run.conclusion == 'timed_out' ||
            github.event.workflow_run.conclusion == 'startup_failure'
          )
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          if [ "$RUN_ATTEMPT" -ge 2 ]; then
            echo "VALIDATOR_RECOVERY_EXHAUSTED workflow=$WORKFLOW_NAME run=$RUN_ID attempt=$RUN_ATTEMPT"
            exit 0
          fi
          echo "RETRY_VALIDATOR_ONCE workflow=$WORKFLOW_NAME run=$RUN_ID attempt=$RUN_ATTEMPT"
          gh run rerun "$RUN_ID" --failed --repo "${GITHUB_REPOSITORY}"
          echo "VALIDATOR_RETRY_REQUESTED workflow=$WORKFLOW_NAME run=$RUN_ID"
      
      - name: Cancel legacy push-triggered heavy runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cancel_run() {
            local id="$1"
            for attempt in 1 2 3; do
              if gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" >/dev/null 2>&1; then
                echo "CANCEL_REQUEST_ACCEPTED run_id=${id} attempt=${attempt}"
                return 0
              fi
              sleep "${attempt}"
            done
            local state
            state=$(gh run view "$id" --json status --jq '.status' 2>/dev/null || printf 'unknown')
            case "$state" in
              completed|cancelled|failure|success|neutral|skipped|timed_out)
                echo "CANCEL_RACE_ALREADY_TERMINAL run_id=$id status=$state"
                return 0
                ;;
              in_progress|queued|waiting|requested|pending)
                echo "CANCEL_FAILED_ACTIVE run_id=$id status=$state"
                return 1
                ;;
              *)
                echo "CANCEL_STATE_UNKNOWN run_id=$id status=$state"
                return 1
                ;;
            esac
          }

          workflows=(
            "v4_5_15_production.yml"
            "pit_history_expansion.yml"
          )
          for workflow in "${workflows[@]}"; do
            gh run list --workflow "$workflow" --limit 50 --json databaseId,status,event,createdAt,headSha               --jq '.[] | select(.event=="push" and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending")) | [.databaseId,.status,.createdAt,.headSha] | @tsv' |
            while IFS=$'\t' read -r run_id status created_at head_sha; do
              [ -n "$run_id" ] || continue
              echo "LEGACY_PUSH_RUN run_id=$run_id status=$status created_at=$created_at sha=$head_sha workflow=$workflow"
              cancel_run "$run_id"
            done
          done

      - name: Cancel stale unfinished heavy runs from old commits only when unsafe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cancel_run() {
            local id="$1"
            for attempt in 1 2 3; do
              if gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" >/dev/null 2>&1; then
                echo "CANCEL_REQUEST_ACCEPTED run_id=${id} attempt=${attempt}"
                return 0
              fi
              sleep "${attempt}"
            done
            local state
            state=$(gh run view "$id" --json status --jq '.status' 2>/dev/null || printf 'unknown')
            case "$state" in
              completed|cancelled|failure|success|neutral|skipped|timed_out)
                echo "CANCEL_RACE_ALREADY_TERMINAL run_id=${id} status=$state"
                return 0
                ;;
              in_progress|queued|waiting|requested|pending)
                echo "CANCEL_FAILED_ACTIVE run_id=${id} status=$state"
                return 1
                ;;
              *)
                echo "CANCEL_STATE_UNKNOWN run_id=${id} status=$state"
                return 1
                ;;
            esac
          }

          # Durable-only main advances are explicitly compatible with long-running
          # production/PIT runs. Do not cancel those runs merely because the
          # control-plane/failure-memory state committed a new SHA.
          classify_main_advance_remote() {
            local run_sha="$1" main_sha="$2"
            local compare_json status
            if ! compare_json="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${run_sha}...${main_sha}" 2>/dev/null)"; then
              echo "UNVERIFIABLE"
              return 0
            fi
            status="$(printf '%s' "$compare_json" | jq -r '.status // ""')"
            if [ "$status" != "ahead" ]; then
              echo "NON_DURABLE_CHANGE"
              return 0
            fi

            printf '%s' "$compare_json" | jq -r '
              [.files[]?.filename] as $files |
              if ($files | length) == 0 then
                "UNVERIFIABLE"
              elif all($files[];
                . == "results/research/autonomous_control_plane.json" or
                . == "results/research/automation_health.json" or
                . == "results/research/research_queue.jsonl" or
                . == "results/research/autonomous_action_log.jsonl" or
                startswith("results/automation_state/") or
                . == "results/failure_memory.jsonl"
              ) then
                "DURABLE_ONLY"
              else
                "NON_DURABLE_CHANGE"
              end
            '
          }

          git fetch origin main --depth=1
          main_sha=$(git rev-parse origin/main)

          for workflow in "v4_5_15_production.yml" "pit_history_expansion.yml"; do
            # Emit one whitespace-safe TSV row per active heavy run. Every emitted
            # field is free of spaces, so default shell IFS is sufficient.
            while read -r run_id status _event _created_at head_sha; do
              [ -n "$run_id" ] || continue

              if [ "$head_sha" = "$main_sha" ]; then
                echo "CURRENT_MAIN_HEAVY_RUN_PRESERVED run_id=$run_id workflow=$workflow status=$status sha=$head_sha"
                continue
              fi

              advance_status="$(classify_main_advance_remote "$head_sha" "$main_sha")"
              case "$advance_status" in
                DURABLE_ONLY)
                  echo "DURABLE_ONLY_HEAVY_RUN_PRESERVED run_id=$run_id workflow=$workflow status=$status sha=$head_sha main=$main_sha"
                  continue
                  ;;
                NON_DURABLE_CHANGE|UNVERIFIABLE)
                  echo "STALE_UNSAFE_HEAVY_RUN run_id=$run_id workflow=$workflow status=$status sha=$head_sha main=$main_sha classification=$advance_status"
                  cancel_run "$run_id"
                  ;;
                *)
                  echo "UNKNOWN_MAIN_ADVANCE_CLASSIFICATION run_id=$run_id workflow=$workflow status=$status sha=$head_sha main=$main_sha class=$advance_status" >&2
                  cancel_run "$run_id"
                  ;;
              esac
            done
          done

      - name: Ensure validated latest-main production is continuously scheduled
        if: steps.rescue_guard.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          main_sha=$(git rev-parse origin/main)
          state=$(gh run list --workflow "v4_5_15_production.yml" --limit 100 --json databaseId,status,event,createdAt,headSha)
          active_latest=$(printf '%s' "$state" | jq --arg sha "$main_sha" '[.[] | select(.headSha==$sha and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending"))] | length')
          # Old-SHA runs are being cancelled in the preceding step. They may
          # remain briefly visible as active while GitHub processes cancellation;
          # they must not delay a validated current-SHA production dispatch.
          active_any=$(printf '%s' "$state" | jq --arg sha "$main_sha" '[.[] | select(.headSha==$sha and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending"))] | length')
          seen_latest=$(printf '%s' "$state" | jq --arg sha "$main_sha" '[.[] | select(.headSha==$sha)] | length')
          latest_created=$(printf '%s' "$state" | jq -r --arg sha "$main_sha" '[.[] | select(.headSha==$sha) | .createdAt] | sort | last // ""')

          # Validation evidence follows the same main-advance semantics as long-running jobs.
          # When main consists only of durable control/failure-memory state commits, walk back
          # through those commits to the nearest non-durable semantic revision and inherit
          # successful validator evidence from that revision. This prevents durable-state
          # commits from deadlocking production scheduling while still requiring fresh
          # validation after any code/config/workflow/model change.
          validation_base_sha="$main_sha"
          validation_walk=0
          validation_walk_failed=false
          while [ "$validation_walk" -lt 20 ]; do
            if ! commit_meta="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${validation_base_sha}" 2>/dev/null)"; then
              validation_walk_failed=true
              break
            fi
            parent_count="$(printf '%s' "$commit_meta" | jq '.parents | length')"
            if [ "$parent_count" -ne 1 ]; then
              break
            fi
            parent_sha="$(printf '%s' "$commit_meta" | jq -r '.parents[0].sha // ""')"
            changed_count="$(printf '%s' "$commit_meta" | jq '[.files[]?.filename] | length')"
            durable_only="$(printf '%s' "$commit_meta" | jq -r '
              [.files[]?.filename] as $files |
              if ($files | length) == 0 then "false"
              elif all($files[];
                . == "results/research/autonomous_control_plane.json" or
                . == "results/research/automation_health.json" or
                . == "results/research/research_queue.jsonl" or
                . == "results/research/autonomous_action_log.jsonl" or
                startswith("results/automation_state/") or
                . == "results/failure_memory.jsonl"
              ) then "true"
              else "false"
              end
            ')"
            if [ "$changed_count" -gt 0 ] && [ "$durable_only" = "true" ] && [ -n "$parent_sha" ]; then
              validation_base_sha="$parent_sha"
              validation_walk=$((validation_walk + 1))
              continue
            fi
            break
          done
          if [ "$validation_walk_failed" = "true" ]; then
            echo "VALIDATION_BASE_UNVERIFIABLE main=$main_sha" >&2
            validation_base_sha="$main_sha"
          fi
          echo "VALIDATION_BASE_SHA=$validation_base_sha main=$main_sha durable_walk=$validation_walk"

          inv=$(gh run list --workflow "production_invariants.yml" --limit 50 --json databaseId,status,conclusion,headSha)
          safety=$(gh run list --workflow "production_safety_audit.yml" --limit 50 --json databaseId,status,conclusion,headSha)
          lightweight=$(gh run list --workflow "lightweight_regression.yml" --limit 50 --json databaseId,status,conclusion,headSha)
          sweep=$(gh run list --workflow "autonomous_research_sweep.yml" --limit 50 --json databaseId,status,conclusion,headSha)
          inv_ok=$(printf '%s' "$inv" | jq --arg sha "$validation_base_sha" '[.[] | select(.headSha==$sha and .conclusion=="success")] | length')
          safety_ok=$(printf '%s' "$safety" | jq --arg sha "$validation_base_sha" '[.[] | select(.headSha==$sha and .conclusion=="success")] | length')
          lightweight_ok=$(printf '%s' "$lightweight" | jq --arg sha "$validation_base_sha" '[.[] | select(.headSha==$sha and .conclusion=="success")] | length')
          sweep_ok=$(printf '%s' "$sweep" | jq --arg sha "$validation_base_sha" '[.[] | select(.headSha==$sha and .conclusion=="success")] | length')

          inherited_validation=false
          if [ "$validation_base_sha" != "$main_sha" ] && [ "$inv_ok" -ge 1 ] && [ "$safety_ok" -ge 1 ] && [ "$lightweight_ok" -ge 1 ]; then
            inherited_validation=true
            echo "INHERITED_VALIDATION_FROM_DURABLE_ONLY_BASE base=$validation_base_sha main=$main_sha"
          fi

          # A successful production run writes generated outputs (results/models) to main.
          # Such commits are not durable-only under the canonical main-advance policy.
          # Preserve the existing narrow production-generator inheritance path.
          if [ "$inherited_validation" != "true" ] && { [ "$inv_ok" -lt 1 ] || [ "$safety_ok" -lt 1 ]; }; then
            commit_meta="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${main_sha}")"
            subject="$(printf '%s' "$commit_meta" | jq -r '.commit.message // ""')"
            parent_sha="$(printf '%s' "$commit_meta" | jq -r '.parents[0].sha // ""')"
            generated_only="$(printf '%s' "$commit_meta" | jq -r '[.files[]?.filename] | if length > 0 and all(startswith("results/") or startswith("models/")) then "true" else "false" end')"
            parent_production="$(gh run list --workflow "v4_5_15_production.yml" --limit 50 --json databaseId,status,conclusion,headSha | jq --arg sha "$parent_sha" '[.[] | select(.headSha==$sha and .conclusion=="success")] | length')"
            if [ "$generated_only" = "true" ] && [ "$subject" = "chore: update active-scope research results" ] && [ -n "$parent_sha" ] && [ "$parent_production" -ge 1 ]; then
              inherited_validation=true
              echo "INHERITED_VALIDATION_FROM_SUCCESSFUL_GENERATOR parent=$parent_sha production_runs=$parent_production"
            fi
          fi
          # Dispatch only after same-SHA validators pass, or after the strict
          # generated-output inheritance rule above. The first run for a SHA is
          # immediate; later retries remain bounded to one per hourly window.
          dispatch=false
          if [ "$active_any" -eq 0 ] && {               [ "$inv_ok" -ge 1 ] && [ "$safety_ok" -ge 1 ] && [ "$lightweight_ok" -ge 1 ] ||               [ "$inherited_validation" = "true" ];              }; then
            if [ "$seen_latest" -eq 0 ]; then
              dispatch=true
            elif [ -n "$latest_created" ]; then
              created_ts=$(date -u -d "$latest_created" +%s)
              now=$(date -u +%s)
              age=$((now-created_ts))
              if [ "$age" -ge 3300 ]; then dispatch=true; fi
            fi
          fi
          if [ "$dispatch" = true ]; then
            echo "DISPATCH_VALIDATED_LATEST_MAIN_PRODUCTION main=$main_sha inv_ok=$inv_ok safety_ok=$safety_ok lightweight_ok=$lightweight_ok sweep_ok=$sweep_ok"
            gh workflow run v4_5_15_production.yml --ref main
          else
            echo "LATEST_MAIN_PRODUCTION_GUARD active=$active_latest active_any=$active_any seen=$seen_latest inv_ok=$inv_ok safety_ok=$safety_ok lightweight_ok=$lightweight_ok main=$main_sha"
          fi
      - name: Backfill a missed 9-hour PIT boundary once per boundary window
        if: steps.rescue_guard.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          main_sha=$(git rev-parse origin/main)
          state=$(gh run list --workflow "pit_history_expansion.yml" --limit 100 --json databaseId,status,event,createdAt,headSha,conclusion)
          active_pit=$(printf '%s' "$state" | jq --arg sha "$main_sha" '[.[] | select(.headSha==$sha and (.event=="schedule" or .event=="workflow_dispatch") and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending"))] | length')

          anchor=$(date -u -d '2026-09-22 00:47:00' +%s)
          now=$(date -u +%s)
          delta=$((now-anchor))
          if [ "$delta" -lt 0 ]; then
            echo "PIT_9H_BOUNDARY_NOT_STARTED now=$now anchor=$anchor"
            exit 0
          fi
          minute_delta=$((delta / 60))
          boundary_index=$((minute_delta / 540))
          boundary_epoch=$((anchor + boundary_index * 540 * 60))
          next_boundary_epoch=$((boundary_epoch + 540 * 60))
          boundary_age=$((now-boundary_epoch))

          # Give the canonical scheduled wake-up a small jitter window before
          # treating the boundary as missed. After that, at most one PIT run
          # (scheduled or recovery) may exist in this 9-hour boundary window.
          if [ "$boundary_age" -lt 300 ]; then
            echo "PIT_9H_BOUNDARY_GRACE age=$boundary_age boundary_epoch=$boundary_epoch"
            exit 0
          fi

          # Only an attempt pinned to the current main SHA counts against this
          # boundary. A stale-SHA attempt may be cancelled above but must never
          # block a freshly validated current-main recovery run.
          attempt_in_boundary=$(printf '%s' "$state" | jq --arg sha "$main_sha" --argjson start "$boundary_epoch" --argjson end "$next_boundary_epoch" '[.[] | select(.headSha==$sha and (.event=="schedule" or .event=="workflow_dispatch") and ( .createdAt | fromdateiso8601) >= $start and (.createdAt | fromdateiso8601) < $end)] | length')
          dispatch=false
          if [ "$active_pit" -eq 0 ] && [ "$attempt_in_boundary" -eq 0 ]; then
            dispatch=true
          fi

          if [ "$dispatch" = true ]; then
            echo "DISPATCH_PIT_9H_RECOVERY main=$main_sha boundary_index=$boundary_index boundary_epoch=$boundary_epoch reason=missed_boundary"
            gh workflow run pit_history_expansion.yml --ref main
          else
            echo "PIT_9H_BOUNDARY_STATUS main=$main_sha active=$active_pit attempt_in_boundary=$attempt_in_boundary boundary_index=$boundary_index boundary_epoch=$boundary_epoch"
          fi
      - name: Ensure pre-event T-60 prediction heartbeat
        if: steps.rescue_guard.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          main_sha=$(git rev-parse origin/main)
          state=$(gh run list --workflow "pre_event_prediction.yml" --limit 100 --json databaseId,status,event,createdAt,headSha,conclusion)

          # Remove active runs pinned to obsolete SHAs before heartbeat evaluation.
          stale_run_ids=$(printf '%s' "$state" | jq -r --arg sha "$main_sha" '
            .[]
            | select(
                .event=="schedule"
                and .headSha != $sha
                and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending")
              )
            | .databaseId
          ')
          while read -r stale_run_id; do
            [ -n "$stale_run_id" ] || continue
            stale_state=$(gh run view "$stale_run_id" --json status,event,createdAt,headSha)
            stale_status=$(printf '%s' "$stale_state" | jq -r '.status')
            stale_event=$(printf '%s' "$stale_state" | jq -r '.event')
            stale_created=$(printf '%s' "$stale_state" | jq -r '.createdAt')
            stale_sha=$(printf '%s' "$stale_state" | jq -r '.headSha')
            echo "STALE_SHA_PRE_EVENT_RUN run_id=$stale_run_id status=$stale_status event=$stale_event created_at=$stale_created sha=$stale_sha main=$main_sha"
            cancelled=false
            for attempt in 1 2 3; do
              if gh api --method POST "repos/sasasotaro1202-star/7-Sport-Prediction-Research/actions/runs/$stale_run_id/cancel" >/dev/null 2>&1; then
                echo "STALE_SHA_PRE_EVENT_CANCEL_REQUESTED run_id=$stale_run_id attempt=$attempt"
                cancelled=true
                break
              fi
              sleep "$attempt"
            done
            if [ "$cancelled" = false ]; then
              observed_status=$(gh run view "$stale_run_id" --json status --jq '.status' 2>/dev/null || printf 'unknown')
              case "$observed_status" in
                completed|cancelled|failure|success|neutral|skipped|timed_out)
                  echo "STALE_SHA_PRE_EVENT_CANCEL_RACE_TERMINAL run_id=$stale_run_id status=$observed_status"
                  ;;
                *)
                  echo "STALE_SHA_PRE_EVENT_CANCEL_FAILED run_id=$stale_run_id status=$observed_status" >&2
                  exit 1
                  ;;
              esac
            fi
          done <<< "$stale_run_ids"

          # Re-read after cancellation so current-main activity is evaluated from
          # the freshest observable state rather than the pre-cancellation snapshot.
          state=$(gh run list --workflow "pre_event_prediction.yml" --limit 100 --json databaseId,status,event,createdAt,headSha,conclusion)
          active=$(printf '%s' "$state" | jq --arg sha "$main_sha" '[.[] | select(.headSha==$sha and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending"))] | length')
          latest_success_created=$(printf '%s' "$state" | jq -r --arg sha "$main_sha" '[.[] | select(.headSha==$sha and .conclusion=="success") | .createdAt] | sort | last // ""')
          latest_any_created=$(printf '%s' "$state" | jq -r --arg sha "$main_sha" '[.[] | select(.headSha==$sha) | .createdAt] | sort | last // ""')
          dispatch=false
          reason="active=$active latest_success_created=$latest_success_created"
          if [ "$active" -eq 0 ]; then
            # A successful run is the only healthy heartbeat. If no success exists,
            # the latest attempt is used only as a bounded retry cooldown so a
            # persistently failing lane does not create a 5-minute dispatch storm.
            reference_created="$latest_success_created"
            reference_type="successful_heartbeat"
            if [ -z "$reference_created" ]; then
              reference_created="$latest_any_created"
              reference_type="attempt_cooldown"
            fi
            if [ -z "$reference_created" ]; then
              dispatch=true
              reason="no_pre_event_run_observed"
            else
              created_ts=$(date -u -d "$reference_created" +%s)
              now=$(date -u +%s)
              age=$((now-created_ts))
              if [ "$age" -ge 1200 ]; then
                dispatch=true
                if [ "$reference_type" = "successful_heartbeat" ]; then
                  reason="last_successful_pre_event_run_age=${age}s"
                else
                  reason="no_successful_pre_event_heartbeat_retry_age=${age}s"
                fi
              fi
            fi
          fi
          if [ "$dispatch" = true ]; then
            echo "DISPATCH_PRE_EVENT_T60 main=$main_sha reason=$reason"
            gh workflow run pre_event_prediction.yml --ref main
          else
            echo "PRE_EVENT_HEARTBEAT_OK main=$main_sha $reason"
          fi
      - name: Cancel over-time production and PIT runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cancel_run() {
            local id="$1"
            for attempt in 1 2 3; do
              if gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" >/dev/null 2>&1; then
                echo "CANCEL_REQUEST_ACCEPTED run_id=${id} attempt=${attempt}"
                return 0
              fi
              sleep "${attempt}"
            done
            local state
            state=$(gh run view "$id" --json status --jq '.status' 2>/dev/null || printf 'unknown')
            case "$state" in
              completed|cancelled|failure|success|neutral|skipped|timed_out)
                echo "CANCEL_RACE_ALREADY_TERMINAL run_id=$id status=$state"
                return 0
                ;;
              in_progress|queued|waiting|requested|pending)
                echo "CANCEL_FAILED_ACTIVE run_id=$id status=$state"
                return 1
                ;;
              *)
                echo "CANCEL_STATE_UNKNOWN run_id=$id status=$state"
                return 1
                ;;
            esac
          }
          git fetch origin main --depth=1
          main_sha=$(git rev-parse origin/main)
          for workflow in "v4_5_15_production.yml" "pit_history_expansion.yml"; do
            gh run list --workflow "$workflow" --limit 50 --json databaseId,status,event,createdAt,headSha --jq '.[] | [.databaseId,.status,.event,.createdAt,.headSha] | @tsv' |
            while IFS=$'\t' read -r run_id status event created_at head_sha; do
              [ -n "$run_id" ] || continue
              [ "$status" = "in_progress" ] || continue
              if [ "$head_sha" != "$main_sha" ]; then
                echo "STALE_SHA_HEAVY_RUN run_id=$run_id workflow=$workflow event=$event sha=$head_sha main=$main_sha"
                cancel_run "$run_id"
                continue
              fi
              created_ts=$(date -u -d "$created_at" +%s)
              now=$(date -u +%s)
              age=$((now-created_ts))
              limit=19800
              if [ "$workflow" = "pit_history_expansion.yml" ]; then limit=2700; fi
              if [ "$age" -ge "$limit" ]; then
                echo "OVERTIME_HEAVY_RUN run_id=$run_id age=${age}s workflow=$workflow event=$event sha=$head_sha"
                cancel_run "$run_id"
              fi
            done
