name: Production Run Watchdog

on:
  workflow_dispatch:
  schedule:
    # Lightweight 5-minute recovery polling; heavy work remains hourly/9-hourly.
    - cron: '*/5 * * * *'
  workflow_run:
    workflows:
      - Production Invariants
    types: [completed]


permissions:
  actions: write
  contents: read

concurrency:
  group: production-run-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Cancel legacy push-triggered heavy runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflows=(
            "v4_5_15_production.yml"
            "pit_history_expansion.yml"
          )
          for workflow in "${workflows[@]}"; do
            gh run list --workflow "$workflow" --limit 50 --json databaseId,status,event,createdAt,headSha               --jq '.[] | select(.event=="push" and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending")) | [.databaseId,.status,.createdAt,.headSha] | @tsv' |
            while IFS=$'\t' read -r run_id status created_at head_sha; do
              [ -n "$run_id" ] || continue
              echo "LEGACY_PUSH_RUN run_id=$run_id status=$status created_at=$created_at sha=$head_sha workflow=$workflow"
              gh run cancel "$run_id"
            done
          done

      - name: Cancel stale unfinished heavy runs from old commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha=$(git rev-parse HEAD)
          for workflow in "v4_5_15_production.yml" "pit_history_expansion.yml"; do
            gh run list --workflow "$workflow" --limit 50 --json databaseId,status,event,createdAt,headSha --jq '.[] | select(.headSha != "'"$main_sha"'" and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending")) | [.databaseId,.status,.event,.createdAt,.headSha] | @tsv' |
            while IFS=$'	' read -r run_id status event created_at head_sha; do
              [ -n "$run_id" ] || continue
              echo "STALE_UNFINISHED_HEAVY_RUN run_id=$run_id status=$status event=$event sha=$head_sha main=$main_sha workflow=$workflow"
              gh run cancel "$run_id"
            done
          done

      - name: Ensure validated latest-main production is continuously scheduled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha=$(git rev-parse HEAD)
          state=$(gh run list --workflow "v4_5_15_production.yml" --limit 100 --json databaseId,status,event,createdAt,headSha)
          active_latest=$(printf '%s' "$state" | jq --arg sha "$main_sha" '[.[] | select(.headSha==$sha and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending"))] | length')
          seen_latest=$(printf '%s' "$state" | jq --arg sha "$main_sha" '[.[] | select(.headSha==$sha)] | length')
          latest_created=$(printf '%s' "$state" | jq -r --arg sha "$main_sha" '[.[] | select(.headSha==$sha) | .createdAt] | sort | last // ""')

          inv=$(gh run list --workflow "production_invariants.yml" --limit 50 --json databaseId,status,conclusion,headSha)
          safety=$(gh run list --workflow "production_safety_audit.yml" --limit 50 --json databaseId,status,conclusion,headSha)
          inv_ok=$(printf '%s' "$inv" | jq --arg sha "$main_sha" '[.[] | select(.headSha==$sha and .conclusion=="success")] | length')
          safety_ok=$(printf '%s' "$safety" | jq --arg sha "$main_sha" '[.[] | select(.headSha==$sha and .conclusion=="success")] | length')

          # Dispatch only after both same-SHA validators pass. The first run for a
          # SHA is immediate; later retries are bounded to one per hourly window.
          dispatch=false
          if [ "$active_latest" -eq 0 ] && [ "$inv_ok" -ge 1 ] && [ "$safety_ok" -ge 1 ]; then
            if [ "$seen_latest" -eq 0 ]; then
              dispatch=true
            elif [ -n "$latest_created" ]; then
              created_ts=$(date -u -d "$latest_created" +%s)
              now=$(date -u +%s)
              age=$((now-created_ts))
              if [ "$age" -ge 3300 ]; then dispatch=true; fi
            fi
          fi
          if [ "$dispatch" = true ]; then
            echo "DISPATCH_VALIDATED_LATEST_MAIN_PRODUCTION main=$main_sha inv_ok=$inv_ok safety_ok=$safety_ok"
            gh workflow run v4_5_15_production.yml --ref main
          else
            echo "LATEST_MAIN_PRODUCTION_GUARD active=$active_latest seen=$seen_latest inv_ok=$inv_ok safety_ok=$safety_ok main=$main_sha"
          fi
      - name: Cancel over-time production and PIT runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha=$(git rev-parse HEAD)
          for workflow in "v4_5_15_production.yml" "pit_history_expansion.yml"; do
            gh run list --workflow "$workflow" --limit 50 --json databaseId,status,event,createdAt,headSha --jq '.[] | [.databaseId,.status,.event,.createdAt,.headSha] | @tsv' |
            while IFS=$'\t' read -r run_id status event created_at head_sha; do
              [ -n "$run_id" ] || continue
              [ "$status" = "in_progress" ] || continue
              if [ "$head_sha" != "$main_sha" ]; then
                echo "STALE_SHA_HEAVY_RUN run_id=$run_id workflow=$workflow event=$event sha=$head_sha main=$main_sha"
                gh run cancel "$run_id"
                continue
              fi
              created_ts=$(date -u -d "$created_at" +%s)
              now=$(date -u +%s)
              age=$((now-created_ts))
              limit=8100
              if [ "$workflow" = "pit_history_expansion.yml" ]; then limit=2700; fi
              if [ "$age" -ge "$limit" ]; then
                echo "OVERTIME_HEAVY_RUN run_id=$run_id age=${age}s workflow=$workflow event=$event sha=$head_sha"
                gh run cancel "$run_id"
              fi
            done
          done
