name: Production Run Watchdog

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: production-run-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Cancel legacy push-triggered heavy runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflows=(
            "v4_5_15_production.yml"
            "pit_history_expansion.yml"
          )
          for workflow in "${workflows[@]}"; do
            gh run list --workflow "$workflow" --limit 50 --json databaseId,status,event,createdAt,headSha               --jq '.[] | select(.event=="push" and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending")) | [.databaseId,.status,.createdAt,.headSha] | @tsv' |
            while IFS=$'\t' read -r run_id status created_at head_sha; do
              [ -n "$run_id" ] || continue
              echo "LEGACY_PUSH_RUN run_id=$run_id status=$status created_at=$created_at sha=$head_sha workflow=$workflow"
              gh run cancel "$run_id"
            done
          done

      - name: Cancel stale queued production runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha=$(git rev-parse HEAD)
          now=$(date -u +%s)
          gh run list --workflow "v4_5_15_production.yml" --limit 50 --json databaseId,status,event,createdAt,headSha             --jq '.[] | [.databaseId,.status,.event,.createdAt,.headSha] | @tsv' |
          while IFS=$'\t' read -r run_id status event created_at head_sha; do
            [ -n "$run_id" ] || continue
            created_ts=$(date -u -d "$created_at" +%s)
            age=$((now-created_ts))
            if [ "$status" = "queued" ] && [ "$age" -ge 1800 ] && [ "$head_sha" != "$main_sha" ]; then
              echo "STALE_QUEUED_PRODUCTION run_id=$run_id age=${age}s sha=$head_sha main=$main_sha"
              gh run cancel "$run_id"
            fi
          done

      - name: Ensure latest-main production is continuously scheduled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha=$(git rev-parse HEAD)
          now=$(date -u +%s)
          state=$(gh run list --workflow "v4_5_15_production.yml" --limit 50 --json databaseId,status,event,createdAt,headSha)
          active_latest=$(printf '%s' "$state" | jq --arg main_sha "$main_sha" '[.[] | select(.headSha==$main_sha and (.status=="queued" or .status=="in_progress"))] | length')
          latest_created=$(printf '%s' "$state" | jq --arg main_sha "$main_sha" -r '[.[] | select(.headSha==$main_sha)] | map(.createdAt) | sort | last // empty')
          age=999999
          if [ -n "$latest_created" ]; then
            latest_ts=$(date -u -d "$latest_created" +%s)
            age=$((now-latest_ts))
          fi
          if [ "$GITHUB_EVENT_NAME" != "push" ] && [ "$active_latest" -eq 0 ] && [ "$age" -ge 3300 ]; then
            echo "DISPATCH_LATEST_MAIN_PRODUCTION age=${age}s main=$main_sha"
            gh workflow run v4_5_15_production.yml --ref main
          else
            echo "LATEST_MAIN_PRODUCTION_ACTIVE_OR_RECENT active=$active_latest age=${age}s main=$main_sha"
          fi
      - name: Cancel over-time production and PIT runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha=$(git rev-parse HEAD)
          for workflow in "v4_5_15_production.yml" "pit_history_expansion.yml"; do
            gh run list --workflow "$workflow" --limit 50 --json databaseId,status,event,createdAt,headSha --jq '.[] | [.databaseId,.status,.event,.createdAt,.headSha] | @tsv' |
            while IFS=$'\t' read -r run_id status event created_at head_sha; do
              [ -n "$run_id" ] || continue
              [ "$status" = "in_progress" ] || continue
              if [ "$head_sha" != "$main_sha" ]; then
                echo "STALE_SHA_HEAVY_RUN run_id=$run_id workflow=$workflow event=$event sha=$head_sha main=$main_sha"
                gh run cancel "$run_id"
                continue
              fi
              created_ts=$(date -u -d "$created_at" +%s)
              now=$(date -u +%s)
              age=$((now-created_ts))
              limit=8100
              if [ "$workflow" = "pit_history_expansion.yml" ]; then limit=2700; fi
              if [ "$age" -ge "$limit" ]; then
                echo "OVERTIME_HEAVY_RUN run_id=$run_id age=${age}s workflow=$workflow event=$event sha=$head_sha"
                gh run cancel "$run_id"
              fi
            done
          done
