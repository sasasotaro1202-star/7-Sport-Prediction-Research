name: Production Run Watchdog

on:
  workflow_dispatch:
  schedule:
    # Lightweight 5-minute recovery polling; heavy work remains hourly/9-hourly.
    - cron: '*/5 * * * *'
  workflow_run:
    workflows:
      - Nine-Sport Target v4.5.15 Production
      - Cache and PIT Health
      - Production Invariants
      - Production Safety Audit
    types: [completed]
  # The 5-minute schedule remains the primary heartbeat; low-frequency completion
  # events provide a second recovery path without listening to validator churn.

permissions:
  actions: write
  contents: read

concurrency:
  group: production-run-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Guard workflow-run rescue against generated-output commit loops
        id: rescue_guard
        run: |
          set -euo pipefail
          trigger='${{ github.event_name }}'
          subject=$(git log -1 --format='%s')
          eligible=true
          if [ "$trigger" = "workflow_run" ] && [ "$subject" = "chore: update nine-sport target research results" ]; then
            eligible=false
            echo 'SKIP_WORKFLOW_RUN_RESCUE_GENERATED_OUTPUT_COMMIT'
          fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
      - name: Cancel legacy push-triggered heavy runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflows=(
            "v4_5_15_production.yml"
            "pit_history_expansion.yml"
          )
          for workflow in "${workflows[@]}"; do
            gh run list --workflow "$workflow" --limit 50 --json databaseId,status,event,createdAt,headSha               --jq '.[] | select(.event=="push" and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending")) | [.databaseId,.status,.createdAt,.headSha] | @tsv' |
            while IFS=$'\t' read -r run_id status created_at head_sha; do
              [ -n "$run_id" ] || continue
              echo "LEGACY_PUSH_RUN run_id=$run_id status=$status created_at=$created_at sha=$head_sha workflow=$workflow"
              gh run cancel "$run_id"
            done
          done

      - name: Cancel stale unfinished heavy runs from old commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha=$(git rev-parse HEAD)
          for workflow in "v4_5_15_production.yml" "pit_history_expansion.yml"; do
            gh run list --workflow "$workflow" --limit 50 --json databaseId,status,event,createdAt,headSha --jq '.[] | select(.headSha != "'"$main_sha"'" and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending")) | [.databaseId,.status,.event,.createdAt,.headSha] | @tsv' |
            while IFS=$'	' read -r run_id status event created_at head_sha; do
              [ -n "$run_id" ] || continue
              echo "STALE_UNFINISHED_HEAVY_RUN run_id=$run_id status=$status event=$event sha=$head_sha main=$main_sha workflow=$workflow"
              gh run cancel "$run_id"
            done
          done

      - name: Ensure validated latest-main production is continuously scheduled
        if: steps.rescue_guard.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha=$(git rev-parse HEAD)
          state=$(gh run list --workflow "v4_5_15_production.yml" --limit 100 --json databaseId,status,event,createdAt,headSha)
          active_latest=$(printf '%s' "$state" | jq --arg sha "$main_sha" '[.[] | select(.headSha==$sha and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending"))] | length')
          # Old-SHA runs are being cancelled in the preceding step. They may
          # remain briefly visible as active while GitHub processes cancellation;
          # they must not delay a validated current-SHA production dispatch.
          active_any=$(printf '%s' "$state" | jq --arg sha "$main_sha" '[.[] | select(.headSha==$sha and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending"))] | length')
          seen_latest=$(printf '%s' "$state" | jq --arg sha "$main_sha" '[.[] | select(.headSha==$sha)] | length')
          latest_created=$(printf '%s' "$state" | jq -r --arg sha "$main_sha" '[.[] | select(.headSha==$sha) | .createdAt] | sort | last // ""')

          inv=$(gh run list --workflow "production_invariants.yml" --limit 50 --json databaseId,status,conclusion,headSha)
          safety=$(gh run list --workflow "production_safety_audit.yml" --limit 50 --json databaseId,status,conclusion,headSha)
          inv_ok=$(printf '%s' "$inv" | jq --arg sha "$main_sha" '[.[] | select(.headSha==$sha and .conclusion=="success")] | length')
          safety_ok=$(printf '%s' "$safety" | jq --arg sha "$main_sha" '[.[] | select(.headSha==$sha and .conclusion=="success")] | length')

          # A successful production run writes only generated outputs (results/models)
          # to main. Those commits are execution products, not code changes, so
          # requiring fresh same-SHA validators would create a deadlock. Inherit the
          # predecessor's validation only when the commit is provably generated-only,
          # carries the canonical production-results message, and its parent already
          # has a successful canonical production run.
          inherited_validation=false
          if [ "$inv_ok" -lt 1 ] || [ "$safety_ok" -lt 1 ]; then
            commit_meta=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${main_sha}")
            subject=$(printf '%s' "$commit_meta" | jq -r '.commit.message // ""')
            parent_sha=$(printf '%s' "$commit_meta" | jq -r '.parents[0].sha // ""')
            generated_only=$(printf '%s' "$commit_meta" | jq -r '[.files[]?.filename] | if length > 0 and all(startswith("results/") or startswith("models/")) then "true" else "false" end')
            parent_production=$(gh run list --workflow "v4_5_15_production.yml" --limit 50 --json databaseId,status,conclusion,headSha               | jq --arg sha "$parent_sha" '[.[] | select(.headSha==$sha and .conclusion=="success")] | length')
            if [ "$generated_only" = "true" ] &&                [ "$subject" = "chore: update nine-sport target research results" ] &&                [ -n "$parent_sha" ] && [ "$parent_production" -ge 1 ]; then
              inherited_validation=true
              echo "INHERITED_VALIDATION_FROM_SUCCESSFUL_GENERATOR parent=$parent_sha production_runs=$parent_production"
            fi
          fi

          # Dispatch only after same-SHA validators pass, or after the strict
          # generated-output inheritance rule above. The first run for a SHA is
          # immediate; later retries remain bounded to one per hourly window.
          dispatch=false
          if [ "$active_any" -eq 0 ] && {               [ "$inv_ok" -ge 1 ] && [ "$safety_ok" -ge 1 ] ||               [ "$inherited_validation" = "true" ];              }; then
            if [ "$seen_latest" -eq 0 ]; then
              dispatch=true
            elif [ -n "$latest_created" ]; then
              created_ts=$(date -u -d "$latest_created" +%s)
              now=$(date -u +%s)
              age=$((now-created_ts))
              if [ "$age" -ge 3300 ]; then dispatch=true; fi
            fi
          fi
          if [ "$dispatch" = true ]; then
            echo "DISPATCH_VALIDATED_LATEST_MAIN_PRODUCTION main=$main_sha inv_ok=$inv_ok safety_ok=$safety_ok"
            gh workflow run v4_5_15_production.yml --ref main
          else
            echo "LATEST_MAIN_PRODUCTION_GUARD active=$active_latest active_any=$active_any seen=$seen_latest inv_ok=$inv_ok safety_ok=$safety_ok main=$main_sha"
          fi
      - name: Backfill a missed 9-hour PIT boundary once per boundary window
        if: steps.rescue_guard.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha=$(git rev-parse HEAD)
          anchor=$(date -u -d '2026-09-22 00:47:00' +%s)
          now=$(date -u +%s)
          delta=$((now-anchor))
          if [ "$delta" -lt 0 ]; then
            echo "PIT_BOUNDARY_NOT_STARTED"
            exit 0
          fi
          phase=$((delta % 32400))
          boundary_start=$((now-phase))
          pit=$(gh run list --workflow "pit_history_expansion.yml" --limit 100 --json databaseId,status,event,conclusion,createdAt,headSha)
          active=$(printf '%s' "$pit" | jq --arg sha "$main_sha" '[.[] | select(.headSha==$sha and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending"))] | length')
          attempt_in_boundary=$(printf '%s' "$pit" | jq --arg sha "$main_sha" --argjson start "$boundary_start" '[.[] | select(.headSha==$sha) | (.createdAt | fromdateiso8601) | select(. >= $start)] | length')
          # Accept the boundary within the first 30 minutes to tolerate scheduler jitter.
          if [ "$phase" -le 1800 ] && [ "$active" -eq 0 ] && [ "$attempt_in_boundary" -eq 0 ]; then
            echo "DISPATCH_PIT_BOUNDARY main=$main_sha phase=${phase}s boundary_start=$boundary_start"
            gh workflow run pit_history_expansion.yml --ref main
          else
            echo "PIT_BOUNDARY_GUARD phase=${phase}s active=$active attempts=$attempt_in_boundary"
          fi
      - name: Cancel over-time production and PIT runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha=$(git rev-parse HEAD)
          for workflow in "v4_5_15_production.yml" "pit_history_expansion.yml"; do
            gh run list --workflow "$workflow" --limit 50 --json databaseId,status,event,createdAt,headSha --jq '.[] | [.databaseId,.status,.event,.createdAt,.headSha] | @tsv' |
            while IFS=$'\t' read -r run_id status event created_at head_sha; do
              [ -n "$run_id" ] || continue
              [ "$status" = "in_progress" ] || continue
              if [ "$head_sha" != "$main_sha" ]; then
                echo "STALE_SHA_HEAVY_RUN run_id=$run_id workflow=$workflow event=$event sha=$head_sha main=$main_sha"
                gh run cancel "$run_id"
                continue
              fi
              created_ts=$(date -u -d "$created_at" +%s)
              now=$(date -u +%s)
              age=$((now-created_ts))
              limit=14400
              if [ "$workflow" = "pit_history_expansion.yml" ]; then limit=2700; fi
              if [ "$age" -ge "$limit" ]; then
                echo "OVERTIME_HEAVY_RUN run_id=$run_id age=${age}s workflow=$workflow event=$event sha=$head_sha"
                gh run cancel "$run_id"
              fi
            done
          done
