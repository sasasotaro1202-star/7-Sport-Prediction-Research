name: Boxing PIT Source Guard

on:
  workflow_dispatch:
  schedule:
    - cron: '47 */6 * * *'

permissions:
  contents: read

concurrency:
  group: boxing-pit-source-guard
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python runtime
        run: python --version
      - name: Restore Boxing history cache
        uses: actions/cache/restore@v4
        with:
          path: data/db/boxing_v45.sqlite
          key: boxing-v45-db-${{ github.run_id }}
          restore-keys: |
            boxing-v45-db-
      - name: Run Boxing PIT source guard
        run: python -m src.boxing_production --ingest-history
      - name: Compile Boxing module
        run: python -m compileall -q src/boxing_production.py
      - name: Validate isolated Boxing database
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          p=Path("data/db/boxing_v45.sqlite")
          assert p.is_file() and p.stat().st_size>0
          c=sqlite3.connect(p)
          for t in ("source_snapshot","event","participant","event_participant","event_outcome"):
              assert c.execute(f"select 1 from sqlite_master where type='table' and name='{t}'").fetchone()
          print("BOXING_DEDICATED_DB=PASS")
          PY
      - name: Save Boxing history cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/db/boxing_v45.sqlite
          key: boxing-v45-db-${{ github.run_id }}
      - name: Verify fail-closed status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/v45/boxing_coverage.json')
          r=json.loads(p.read_text())
          assert r['sport']=='boxing'
          assert r['status']=='DEFERRED_PIT'
          assert r['production_model_enabled'] is False
          assert r['prediction_cutoff_rule']=='event_time_minus_60m'
          print('BOXING_PIT_GUARD=PASS')
          PY
      - name: Upload Boxing guard report
        uses: actions/upload-artifact@v4
        with:
          name: boxing-pit-guard-${{ github.run_id }}
          path: results/v45/boxing_coverage.json
          retention-days: 7
