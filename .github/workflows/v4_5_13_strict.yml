name: Seven Sport v4.5.13 Strict Production
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
concurrency:
  group: seven-sport-main-writer
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    name: Collect ${{ matrix.sport }}
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        sport: [valorant, basketball, volleyball, tennis, ufc, rizin, f1]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: mkdir -p data/raw/http_cache data/db results models
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data/db/sports_v45.sqlite
          key: seven-sport-db-v3-${{ matrix.sport }}-${{ github.run_id }}
          restore-keys: seven-sport-db-v3-${{ matrix.sport }}-
      - name: Initialize schema
        run: python -c "from src.storage.db_v45 import connect; c=connect(); c.close()"
      - name: Collect with retries
        env:
          V45_HTTP_TIMEOUT: '20'
          V45_HTTP_RETRIES: '3'
          V45_REQUEST_DELAY: '0.05'
          V45_HTTP_WORKERS: '10'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m src.seven_sport_production --sport ${{ matrix.sport }} --days-back 3; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Historical fallback
        run: |
          set -euo pipefail
          case '${{ matrix.sport }}' in
            basketball) python -m src.basketball_cdn_backfill --both ;;
            tennis) python -m src.tennis_public_backfill ;;
            valorant|volleyball|rizin) python -m src.public_history_backfill --sports '${{ matrix.sport }}' ;;
            f1) python -m src.f1_openf1_backfill --start-year 2023 --end-year 2026 --timeout 30 ;;
            ufc) : ;;
          esac
      - name: Validate partition
        run: python -m src.collection_guard --sport ${{ matrix.sport }}
      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/db/sports_v45.sqlite
          key: seven-sport-db-v3-${{ matrix.sport }}-${{ github.run_id }}

  merge:
    name: Merge, research, and gate
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: mkdir -p hourly-artifacts data/db results models
      - name: Restore all seven databases
        uses: actions/cache/restore@v4
        with:
          path: hourly-artifacts/valorant/sports_v45.sqlite
          key: seven-sport-db-v3-valorant-${{ github.run_id }}
      - name: Restore basketball
        uses: actions/cache/restore@v4
        with:
          path: hourly-artifacts/basketball/sports_v45.sqlite
          key: seven-sport-db-v3-basketball-${{ github.run_id }}
      - name: Restore volleyball
        uses: actions/cache/restore@v4
        with:
          path: hourly-artifacts/volleyball/sports_v45.sqlite
          key: seven-sport-db-v3-volleyball-${{ github.run_id }}
      - name: Restore tennis
        uses: actions/cache/restore@v4
        with:
          path: hourly-artifacts/tennis/sports_v45.sqlite
          key: seven-sport-db-v3-tennis-${{ github.run_id }}
      - name: Restore ufc
        uses: actions/cache/restore@v4
        with:
          path: hourly-artifacts/ufc/sports_v45.sqlite
          key: seven-sport-db-v3-ufc-${{ github.run_id }}
      - name: Restore rizin
        uses: actions/cache/restore@v4
        with:
          path: hourly-artifacts/rizin/sports_v45.sqlite
          key: seven-sport-db-v3-rizin-${{ github.run_id }}
      - name: Restore f1
        uses: actions/cache/restore@v4
        with:
          path: hourly-artifacts/f1/sports_v45.sqlite
          key: seven-sport-db-v3-f1-${{ github.run_id }}
      - name: Verify partitions
        run: |
          set -euo pipefail
          for sport in valorant basketball volleyball tennis ufc rizin f1; do test -s hourly-artifacts/$sport/sports_v45.sqlite; done
      - name: Merge partitions
        run: python -m src.merge_partition_dbs --input-dir hourly-artifacts
      - name: Robust adapters
        run: python -m src.robust_sport_adapters_v4
      - name: F1 integrity
        run: python -m src.f1_integrity_cleanup --vacuum
      - name: Outcomes
        run: python -m src.outcome_backfill
      - name: Strict PIT replay
        run: python -m src.pit_replay_builder
      - name: Research
        run: python -m src.research_cycle
      - name: Strict quality gate
        run: python -m src.quality_gate --strict
      - name: Production invariants
        run: python -m src.production_invariants
      - name: Compile check
        run: python -m compileall -q src
      - name: Persist results
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results models
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: update seven-sport research results'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
