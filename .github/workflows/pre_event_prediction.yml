name: Pre-Event Adaptive Timing Prediction

on:
  workflow_dispatch:
    inputs:
      lead_minutes:
        description: "Prediction lead before event (minutes). Scheduled default is 60."
        required: false
        default: "60"
        type: string
      tolerance_minutes:
        description: "Allowed timing tolerance around the requested lead."
        required: false
        default: "15"
        type: string
  schedule:
    - cron: '3-58/5 * * * *'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  pre_event:
    name: Adaptive Prediction / ${{ matrix.sport }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        sport: [valorant, basketball, volleyball, ufc, rizin]
    concurrency:
      # Scheduled runs serialize/cancel only within the scheduled lane.
      # Explicit manual requests use a separate lane and are never cancelled by
      # the five-minute scheduler.
      group: pre-event-prediction-${{ github.event_name }}-${{ matrix.sport }}
      cancel-in-progress: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt

      - name: Verify pre-event policy
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('config/PRE_EVENT_PREDICTION_POLICY.json',encoding='utf-8'))
          assert p['scheduler']['target_lead_minutes'] == 60
          assert p['scheduler']['cron_utc'] == '3-58/5 * * * *'
          assert p['scheduler']['generation_window']['min_lead_minutes'] == 5
          assert p['scheduler']['generation_window']['max_lead_minutes'] == 180
          assert p['scheduler']['generation_window']['scheduled_min_lead_minutes'] == 45
          assert p['scheduler']['generation_window']['scheduled_max_lead_minutes'] == 75
          assert p['scheduler']['guideline_target_minutes'] == 60
          assert p['scheduler']['guideline_tolerance_minutes'] == 15
          assert p['scope']['active_prediction_scope_only'] is True
          assert p['scope']['competition_profile_required'] is True
          assert p['pit']['prediction_cutoff'] == 'event_time_minus_selected_lead'
          print('PRE_EVENT_POLICY=PASS')
          PY

      - name: Resolve requested prediction timing
        id: timing
        run: |
          set -euo pipefail
          lead="${{ inputs.lead_minutes }}"
          tolerance="${{ inputs.tolerance_minutes }}"
          if [ -z "$lead" ]; then lead=60; fi
          if [ -z "$tolerance" ]; then tolerance=15; fi
          case "$lead" in ''|*[!0-9]*) echo "invalid lead_minutes=$lead" >&2; exit 2;; esac
          case "$tolerance" in ''|*[!0-9]*) echo "invalid tolerance_minutes=$tolerance" >&2; exit 2;; esac
          if [ "$lead" -lt 5 ] || [ "$lead" -gt 180 ]; then
            echo "lead_minutes must be between 5 and 180" >&2
            exit 2
          fi
          if [ "$tolerance" -lt 0 ] || [ "$tolerance" -gt 60 ]; then
            echo "tolerance_minutes must be between 0 and 60" >&2
            exit 2
          fi
          min_lead=$((lead - tolerance))
          max_lead=$((lead + tolerance))
          if [ "$min_lead" -lt 5 ]; then min_lead=5; fi
          if [ "$max_lead" -gt 180 ]; then max_lead=180; fi
          echo "lead=$lead" >> "$GITHUB_OUTPUT"
          echo "min_lead=$min_lead" >> "$GITHUB_OUTPUT"
          echo "max_lead=$max_lead" >> "$GITHUB_OUTPUT"
          echo "PREDICTION_TARGET lead=$lead tolerance=$tolerance window=${min_lead}-${max_lead}"

      - run: mkdir -p data/raw/http_cache data/db results

      - name: Restore newest pre-event database
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: data/db
          key: pre-event-target-db-v1-${{ matrix.sport }}-${{ github.sha }}
          restore-keys: |
            pre-event-target-db-v1-${{ matrix.sport }}-
            scope-autofill-db-v1-${{ matrix.sport }}-
            active-scope-target-db-v4-${{ matrix.sport }}-

      - name: Validate/repair restored database
        run: |
          set -euo pipefail
          python -m src.cache_health --db data/db/sports_v45.sqlite --sport ${{ matrix.sport }} --repair
          python -c "from src.storage.db_v45 import connect; c=connect(); c.close()"

      - name: Refresh upcoming schedule
        id: collect
        run: |
          set -uo pipefail
          rc=0
          if timeout --signal=TERM --kill-after=30s 270s python -m src.seven_sport_production --sport ${{ matrix.sport }} --days-back 0 --days-forward 7; then
            echo 'schedule_refresh=OK'
          else
            rc=$?
            echo "schedule_refresh=DEGRADED exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Generate scheduled / explicit prediction lane
        id: predict
        run: |
          set -uo pipefail
          rc=0
          if timeout --signal=TERM --kill-after=30s 300s python -m src.future_predictor \
              --sport ${{ matrix.sport }} \
              --lead-minutes "${{ steps.timing.outputs.lead }}" \
              --min-lead-minutes "${{ steps.timing.outputs.min_lead }}" \
              --max-lead-minutes "${{ steps.timing.outputs.max_lead }}" \
              --target-scope-only; then
            echo 'future_prediction=OK'
          else
            rc=$?
            echo "future_prediction=FAILED exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Generate adaptive timing research lane
        id: adaptive_research
        run: |
          set -uo pipefail
          rc=0
          if timeout --signal=TERM 240s python -m src.future_predictor \
              --sport ${{ matrix.sport }} \
              --lead-minutes 60 \
              --min-lead-minutes 5 \
              --max-lead-minutes 180 \
              --target-scope-only \
              --adaptive-timing; then
            echo 'adaptive_timing_research=OK'
          else
            rc=$?
            echo "adaptive_timing_research=FAILED exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Generate one rotating timing-shadow lane
        id: timing_shadow
        run: |
          set -uo pipefail
          rc=0
          slot=$(( ($(date -u +%s) / 900) % 5 ))
          case "$slot" in
            0) lead=60 ;;
            1) lead=45 ;;
            2) lead=20 ;;
            3) lead=15 ;;
            4) lead=90 ;;
          esac
          min_lead=$((lead - 3))
          max_lead=$((lead + 3))
          if [ "$min_lead" -lt 5 ]; then min_lead=5; fi
          echo "TIMING_SHADOW_TARGET lead=$lead window=${min_lead}-${max_lead}"
          if timeout --signal=TERM 240s python -m src.future_predictor \
              --sport ${{ matrix.sport }} \
              --lead-minutes "$lead" \
              --min-lead-minutes "$min_lead" \
              --max-lead-minutes "$max_lead" \
              --target-scope-only \
              --timing-shadow; then
            echo 'timing_shadow=OK'
          else
            rc=$?
            echo "timing_shadow=FAILED exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Score accumulated prediction experience
        id: experience
        run: |
          set -uo pipefail
          rc=0
          if python -m src.prediction_experience --score-only; then
            echo 'prediction_experience=OK'
          else
            rc=$?
            echo "prediction_experience=FAILED exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Audit every target event in the active pre-event timing window
        id: audit
        run: |
          set -uo pipefail
          rc=0
          if python -m src.pre_event_prediction_audit \
              --sport ${{ matrix.sport }} \
              --db data/db/sports_v45.sqlite \
              --target-lead-minutes "${{ steps.timing.outputs.lead }}" \
              --min-lead-minutes "${{ steps.timing.outputs.min_lead }}" \
              --max-lead-minutes "${{ steps.timing.outputs.max_lead }}"; then
            echo 'pre_event_audit=OK'
          else
            rc=$?
            echo "pre_event_audit=GAP exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Validate resulting database
        id: dbguard
        run: |
          set -uo pipefail
          rc=0
          if python -m src.cache_health --db data/db/sports_v45.sqlite --sport ${{ matrix.sport }}; then
            echo 'database=OK'
          else
            rc=$?
            echo "database=FAILED exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Save newest pre-event database
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: data/db
          key: pre-event-target-db-v1-${{ matrix.sport }}-${{ github.run_id }}

      - name: Publish pre-event audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-event-${{ matrix.sport }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            results/pre_event_prediction_audit_${{ matrix.sport }}.json
            results/future_predictions.json
            results/prediction_eligibility.json
            results/experience_summary.json

      - name: Preserve explicit lane status
        if: always()
        run: |
          set -euo pipefail
          collect_rc='${{ steps.collect.outputs.rc }}'
          predict_rc='${{ steps.predict.outputs.rc }}'
          experience_rc='${{ steps.experience.outputs.rc }}'
          shadow_rc='${{ steps.timing_shadow.outputs.rc }}'
          adaptive_rc='${{ steps.adaptive_research.outputs.rc }}'
          audit_rc='${{ steps.audit.outputs.rc }}'
          db_rc='${{ steps.dbguard.outputs.rc }}'
          echo "PRE_EVENT_STATUS sport=${{ matrix.sport }} lead=${{ steps.timing.outputs.lead }} window=${{ steps.timing.outputs.min_lead }}-${{ steps.timing.outputs.max_lead }} schedule_rc=$collect_rc predict_rc=$predict_rc adaptive_rc=$adaptive_rc timing_shadow_rc=$shadow_rc experience_rc=$experience_rc audit_rc=$audit_rc db_rc=$db_rc"
          if [ "$shadow_rc" -ne 0 ]; then
            echo "TIMING_SHADOW_STATUS=DEGRADED exit=$shadow_rc"
          else
            echo "TIMING_SHADOW_STATUS=OK"
          fi
          rc=0
          for x in "$collect_rc" "$predict_rc" "$experience_rc" "$audit_rc" "$db_rc"; do
            if [ "$x" -ne 0 ] && [ "$rc" -eq 0 ]; then rc="$x"; fi
          done
          exit "$rc"
