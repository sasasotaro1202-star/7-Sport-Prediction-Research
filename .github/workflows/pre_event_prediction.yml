name: Pre-Event Adaptive Timing Prediction

on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  pre_event:
    name: Adaptive Prediction / ${{ matrix.sport }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        sport: [valorant, basketball, volleyball, ufc, rizin]
    concurrency:
      group: pre-event-prediction-${{ matrix.sport }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt

      - name: Verify pre-event policy
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('config/PRE_EVENT_PREDICTION_POLICY.json',encoding='utf-8'))
          assert p['scheduler']['target_lead_minutes'] == 60
          assert p['scheduler']['cron_utc'] == '3-58/5 * * * *'
          assert p['scheduler']['generation_window']['min_lead_minutes'] == 5
          assert p['scheduler']['generation_window']['max_lead_minutes'] == 180
          assert p['scheduler']['guideline_target_minutes'] == 60
          assert p['scheduler']['guideline_tolerance_minutes'] == 15
          assert p['scope']['active_prediction_scope_only'] is True
          assert p['scope']['competition_profile_required'] is True
          assert p['pit']['prediction_cutoff'] == 'event_time_minus_selected_lead'
          print('PRE_EVENT_POLICY=PASS')
          PY

      - run: mkdir -p data/raw/http_cache data/db results

      - name: Restore newest pre-event database
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: data/db
          key: pre-event-target-db-v1-${{ matrix.sport }}-${{ github.sha }}
          restore-keys: |
            pre-event-target-db-v1-${{ matrix.sport }}-
            scope-autofill-db-v1-${{ matrix.sport }}-
            active-scope-target-db-v4-${{ matrix.sport }}-

      - name: Validate/repair restored database
        run: |
          set -euo pipefail
          python -m src.cache_health --db data/db/sports_v45.sqlite --sport ${{ matrix.sport }} --repair
          python -c "from src.storage.db_v45 import connect; c=connect(); c.close()"

      - name: Refresh upcoming schedule
        id: collect
        run: |
          set -uo pipefail
          rc=0
          if timeout --signal=TERM --kill-after=30s 270s python -m src.seven_sport_production --sport ${{ matrix.sport }} --days-back 0 --days-forward 7; then
            echo 'schedule_refresh=OK'
          else
            rc=$?
            echo "schedule_refresh=DEGRADED exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Generate adaptive prediction lane
        id: predict
        run: |
          set -uo pipefail
          rc=0
          if timeout --signal=TERM --kill-after=30s 300s python -m src.future_predictor \
              --sport ${{ matrix.sport }} \
              --lead-minutes 60 \
              --min-lead-minutes 45 \
              --max-lead-minutes 75 \
              --target-scope-only \
              --prediction-origin AUTOMATED_SCHEDULE; then
            echo 'future_prediction=OK'
          else
            rc=$?
            echo "future_prediction=FAILED exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Generate one rotating timing-shadow lane
        id: timing_shadow
        run: |
          set -uo pipefail
          rc=0
          slot=$(( ($(date -u +%s) / 900) % 5 ))
          case "$slot" in
            0) lead=45 ;;
            1) lead=30 ;;
            2) lead=20 ;;
            3) lead=15 ;;
            4) lead=90 ;;
          esac
          min_lead=$((lead - 3))
          max_lead=$((lead + 3))
          if [ "$min_lead" -lt 5 ]; then min_lead=5; fi
          echo "TIMING_SHADOW_TARGET lead=$lead window=${min_lead}-${max_lead}"
          if timeout --signal=TERM 240s python -m src.future_predictor \
              --sport ${{ matrix.sport }} \
              --lead-minutes "$lead" \
              --min-lead-minutes "$min_lead" \
              --max-lead-minutes "$max_lead" \
              --target-scope-only \
              --timing-shadow \
              --prediction-origin TIMING_SHADOW; then
            echo 'timing_shadow=OK'
          else
            rc=$?
            echo "timing_shadow=FAILED exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Score accumulated prediction experience
        id: experience
        run: |
          set -uo pipefail
          rc=0
          if python -m src.prediction_experience --score-only; then
            echo 'prediction_experience=OK'
          else
            rc=$?
            echo "prediction_experience=FAILED exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Audit every target event in the active pre-event timing window
        id: audit
        run: |
          set -uo pipefail
          rc=0
          if python -m src.pre_event_prediction_audit \
              --sport ${{ matrix.sport }} \
              --db data/db/sports_v45.sqlite \
              --target-lead-minutes 60 \
              --min-lead-minutes 45 \
              --max-lead-minutes 75; then
            echo 'pre_event_audit=OK'
          else
            rc=$?
            echo "pre_event_audit=GAP exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Validate resulting database
        id: dbguard
        run: |
          set -uo pipefail
          rc=0
          if python -m src.cache_health --db data/db/sports_v45.sqlite --sport ${{ matrix.sport }}; then
            echo 'database=OK'
          else
            rc=$?
            echo "database=FAILED exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Save newest pre-event database
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: data/db
          key: pre-event-target-db-v1-${{ matrix.sport }}-${{ github.run_id }}

      - name: Publish pre-event audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-event-${{ matrix.sport }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            results/pre_event_prediction_audit_${{ matrix.sport }}.json
            results/future_predictions.json
            results/prediction_eligibility.json
            results/experience_summary.json
            results/experience/**

      - name: Preserve explicit lane status
        if: always()
        run: |
          set -euo pipefail
          collect_rc='${{ steps.collect.outputs.rc }}'
          predict_rc='${{ steps.predict.outputs.rc }}'
          experience_rc='${{ steps.experience.outputs.rc }}'
          shadow_rc='${{ steps.timing_shadow.outputs.rc }}'
          audit_rc='${{ steps.audit.outputs.rc }}'
          db_rc='${{ steps.dbguard.outputs.rc }}'
          echo "PRE_EVENT_STATUS sport=${{ matrix.sport }} schedule_rc=$collect_rc predict_rc=$predict_rc timing_shadow_rc=$shadow_rc experience_rc=$experience_rc audit_rc=$audit_rc db_rc=$db_rc"
          if [ "$shadow_rc" -ne 0 ]; then
            echo "TIMING_SHADOW_STATUS=DEGRADED exit=$shadow_rc"
          else
            echo "TIMING_SHADOW_STATUS=OK"
          fi
          rc=0
          for x in "$collect_rc" "$predict_rc" "$experience_rc" "$audit_rc" "$db_rc"; do
            if [ "$x" -ne 0 ] && [ "$rc" -eq 0 ]; then rc="$x"; fi
          done
          exit "$rc"

  persist_experience:
    name: Persist pre-event experience / hourly single writer
    needs: pre_event
    if: github.event_name == 'schedule' && needs.pre_event.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: prediction-experience-single-writer
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt

      - name: Download current hourly prediction artifacts
        uses: actions/download-artifact@v4
        with:
          path: hourly-artifacts

      - name: Reset to latest main before single-writer mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git reset --hard origin/main

      - name: Persist one logical UTC-hour of experience
        shell: bash
        run: |
          set -euo pipefail
          hour_key="$(date -u +%Y%m%d%H)"
          marker="results/experience/.last_persisted_hour_utc"
          last=""
          if [ -s "$marker" ]; then
            last="$(cat "$marker")"
          fi
          if [ "$last" = "$hour_key" ]; then
            echo "EXPERIENCE_PERSIST_SKIPPED_ALREADY_COMMITTED hour=$hour_key"
            exit 0
          fi

          python -m src.merge_experience_artifacts             --input-root hourly-artifacts             --output-root results/experience

          python -m src.prediction_experience --score-only

          printf '%s\n' "$hour_key" > "$marker"
          mkdir -p results/experience
          git add results/experience

          if git diff --cached --quiet; then
            echo "EXPERIENCE_PERSIST_NO_CHANGE hour=$hour_key"
            exit 0
          fi

          git diff --cached --check
          git commit -m 'chore: persist pre-event experience'
          git fetch origin main --depth=1
          main_sha="$(git rev-parse origin/main)"
          current_parent="$(git rev-parse HEAD~1)"
          if [ "$current_parent" != "$main_sha" ]; then
            git reset --soft "$main_sha"
            git add results/experience
            git diff --cached --check
            if git diff --cached --quiet; then
              echo "EXPERIENCE_PERSIST_REBASE_NO_CHANGE hour=$hour_key"
              exit 0
            fi
            git commit -m 'chore: persist pre-event experience'
          fi
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "EXPERIENCE_PERSIST_PUSH=PASS hour=$hour_key attempt=$attempt"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "EXPERIENCE_PERSIST_PUSH=FAILED hour=$hour_key" >&2
              exit 1
            fi
            git fetch origin main --depth=1
            git reset --soft origin/main
            git add results/experience
            git diff --cached --check
            git commit -m 'chore: persist pre-event experience'
          done
