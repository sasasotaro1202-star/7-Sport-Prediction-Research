name: Pre-Event Adaptive Timing Prediction

on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  pre_event:
    name: 30m Prediction / ${{ matrix.sport }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        sport: [valorant, basketball, volleyball, ufc, rizin]
    concurrency:
      group: pre-event-prediction-${{ matrix.sport }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt

      - name: Verify pre-event policy
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('config/PRE_EVENT_PREDICTION_POLICY.json',encoding='utf-8'))
          assert p['scheduler']['target_lead_minutes'] == 30
          assert p['scheduler']['cron_utc'] == '3-58/5 * * * *'
          assert p['scheduler']['generation_window']['min_lead_minutes'] == 5
          assert p['scheduler']['generation_window']['max_lead_minutes'] == 40
          assert p['scope']['active_prediction_scope_only'] is True
          assert p['scope']['competition_profile_required'] is True
          assert p['pit']['prediction_cutoff'] == 'event_time_minus_target_lead'
          print('PRE_EVENT_POLICY=PASS')
          PY

      - run: mkdir -p data/raw/http_cache data/db results

      - name: Restore newest pre-event database
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: data/db
          key: pre-event-target-db-v1-${{ matrix.sport }}-${{ github.sha }}
          restore-keys: |
            pre-event-target-db-v1-${{ matrix.sport }}-
            scope-autofill-db-v1-${{ matrix.sport }}-
            active-scope-target-db-v4-${{ matrix.sport }}-

      - name: Validate/repair restored database
        run: |
          set -euo pipefail
          python -m src.cache_health --db data/db/sports_v45.sqlite --sport ${{ matrix.sport }} --repair
          python -c "from src.storage.db_v45 import connect; c=connect(); c.close()"

      - name: Refresh upcoming schedule
        id: collect
        run: |
          set -uo pipefail
          rc=0
          if timeout --signal=TERM 150s python -m src.seven_sport_production --sport ${{ matrix.sport }} --days-back 0 --days-forward 7; then
            echo 'schedule_refresh=OK'
          else
            rc=$?
            echo "schedule_refresh=DEGRADED exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Generate around-30-minute prediction lane
        id: predict
        run: |
          set -uo pipefail
          rc=0
          if timeout --signal=TERM 240s python -m src.future_predictor \
              --sport ${{ matrix.sport }} \
              --lead-minutes 30 \
              --min-lead-minutes 5 \
              --max-lead-minutes 40 \
              --target-scope-only; then
            echo 'future_prediction=OK'
          else
            rc=$?
            echo "future_prediction=FAILED exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Score accumulated prediction experience
        id: experience
        run: |
          set -uo pipefail
          rc=0
          if python -m src.prediction_experience --score-only; then
            echo 'prediction_experience=OK'
          else
            rc=$?
            echo "prediction_experience=FAILED exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Audit every target event in the active pre-event timing window
        id: audit
        run: |
          set -uo pipefail
          rc=0
          if python -m src.pre_event_prediction_audit \
              --sport ${{ matrix.sport }} \
              --db data/db/sports_v45.sqlite \
              --target-lead-minutes 30 \
              --min-lead-minutes 5 \
              --max-lead-minutes 40; then
            echo 'pre_event_audit=OK'
          else
            rc=$?
            echo "pre_event_audit=GAP exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Validate resulting database
        id: dbguard
        run: |
          set -uo pipefail
          rc=0
          if python -m src.cache_health --db data/db/sports_v45.sqlite --sport ${{ matrix.sport }}; then
            echo 'database=OK'
          else
            rc=$?
            echo "database=FAILED exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Save newest pre-event database
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: data/db
          key: pre-event-target-db-v1-${{ matrix.sport }}-${{ github.run_id }}

      - name: Publish pre-event audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-event-${{ matrix.sport }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            results/pre_event_prediction_audit_${{ matrix.sport }}.json
            results/future_predictions.json
            results/prediction_eligibility.json
            results/experience_summary.json

      - name: Preserve explicit lane status
        if: always()
        run: |
          set -euo pipefail
          collect_rc='${{ steps.collect.outputs.rc }}'
          predict_rc='${{ steps.predict.outputs.rc }}'
          experience_rc='${{ steps.experience.outputs.rc }}'
          audit_rc='${{ steps.audit.outputs.rc }}'
          db_rc='${{ steps.dbguard.outputs.rc }}'
          echo "PRE_EVENT_STATUS sport=${{ matrix.sport }} schedule_rc=$collect_rc predict_rc=$predict_rc experience_rc=$experience_rc audit_rc=$audit_rc db_rc=$db_rc"
          rc=0
          for x in "$collect_rc" "$predict_rc" "$experience_rc" "$audit_rc" "$db_rc"; do
            if [ "$x" -ne 0 ] && [ "$rc" -eq 0 ]; then rc="$x"; fi
          done
          exit "$rc"
