name: Pre-Event Adaptive Timing Prediction

on:
  workflow_dispatch:
    inputs:
      lead_minutes:
        description: "Manual prediction horizon in minutes before the event. Positive integer; no upper limit."
        required: false
        default: "60"
        type: string
  schedule:
    # A 15-minute cadence guarantees coverage of the 45-75 minute T-60 guideline window
    # without allowing the five-minute scheduler to repeatedly cancel long runs.
    - cron: '3-58/15 * * * *'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  pre_event:
    name: Adaptive Prediction / ${{ matrix.sport }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        sport: [valorant, basketball, volleyball, ufc, rizin]
    concurrency:
      # Scheduled runs may cancel an older scheduled run for the same sport.
      # Manual requests use a separate concurrency group and are not cancelled
      # by the scheduled production cadence.
      group: pre-event-prediction-${{ github.event_name }}-${{ matrix.sport }}
      cancel-in-progress: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt

      - name: Verify pre-event policy
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('config/PRE_EVENT_PREDICTION_POLICY.json',encoding='utf-8'))
          assert p['scheduler']['target_lead_minutes'] == 60
          assert p['scheduler']['cron_utc'] == '3-58/15 * * * *'
          assert p['scheduler']['generation_window']['min_lead_minutes'] == 5
          assert p['scheduler']['generation_window']['max_lead_minutes'] == 180
          assert p['scheduler']['guideline_target_minutes'] == 60
          assert p['scheduler']['guideline_tolerance_minutes'] == 15
          assert p['scheduler']['selection_mode'] == 'scheduled-60m-default;manual-lead-configurable'
          assert p['scope']['active_prediction_scope_only'] is True
          assert p['scope']['competition_profile_required'] is True
          assert p['pit']['prediction_cutoff'] == 'event_time_minus_selected_lead'
          print('PRE_EVENT_POLICY=PASS')
          PY

      - run: mkdir -p data/raw/http_cache data/db results

      - name: Restore newest pre-event database
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: data/db
          key: pre-event-target-db-v1-${{ matrix.sport }}-${{ github.sha }}
          restore-keys: |
            pre-event-target-db-v1-${{ matrix.sport }}-
            scope-autofill-db-v1-${{ matrix.sport }}-
            active-scope-target-db-v4-${{ matrix.sport }}-

      - name: Validate/repair restored database
        run: |
          set -euo pipefail
          python -m src.cache_health --db data/db/sports_v45.sqlite --sport ${{ matrix.sport }} --repair
          python -c "from src.storage.db_v45 import connect; c=connect(); c.close()"

      - name: Rebuild persistent prediction experience archive from DB
        id: experience_sync
        run: |
          set -uo pipefail
          rc=0
          if python -m src.prediction_experience --archive-db-sport "${{ matrix.sport }}"; then
            echo 'experience_db_sync=OK'
          else
            rc=$?
            echo "experience_db_sync=DEGRADED exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Refresh upcoming schedule
        id: collect
        run: |
          set -uo pipefail
          rc=0
          requested_lead='60'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            requested_lead="${{ inputs.lead_minutes }}"
          fi
          case "$requested_lead" in
            ""|*[!0-9]*) echo "invalid lead_minutes=$requested_lead" >&2; exit 2 ;;
          esac
          if [ "$requested_lead" -le 0 ]; then
            echo "invalid lead_minutes=$requested_lead (must be a positive integer)" >&2
            exit 2
          fi
          days_forward="$(python -c 'import sys; lead=int(sys.argv[1]); print(max(7, (lead + 15 + 1439) // 1440))' "$requested_lead")"
          echo "schedule collection days_forward=$days_forward for lead=$requested_lead"
          if timeout --signal=TERM --kill-after=30s 270s python -m src.seven_sport_production --sport ${{ matrix.sport }} --days-back 0 --days-forward "$days_forward"; then
            echo 'schedule_refresh=OK'
          else
            rc=$?
            echo "schedule_refresh=DEGRADED exit=$rc"
          fi

          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Enrich upcoming match details
        id: match_data
        run: |
          set -uo pipefail
          rc=0
          lead='60'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            lead="${{ inputs.lead_minutes }}"
          fi
          if timeout --signal=TERM --kill-after=30s 240s python -m src.match_data_expansion \
              --sport "${{ matrix.sport }}" \
              --horizon-days 14 \
              --max-events 40 \
              --lead-minutes "$lead"; then
            echo 'match_data_expansion=OK'
          else
            rc=$?
            echo "match_data_expansion=DEGRADED exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Generate requested prediction lane
        id: predict
        run: |
          set -uo pipefail
          rc=0
          requested_lead='60'
          # Scheduled production is deliberately centered on T-60.
          # Adaptive timing research is isolated to the timing-shadow lane below;
          # an explicit manual horizon is always authoritative.
          adaptive='0'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            requested_lead="${{ inputs.lead_minutes }}"
          fi
          case "$requested_lead" in
            ""|*[!0-9]*) echo "invalid lead_minutes=$requested_lead" >&2; exit 2 ;;
          esac
          # Manual requests are intentionally unbounded above: 180, 300, 720, 1440, etc.
          # Automatic scheduled prediction remains centered on T-60 and bounded to 45-75.
          if [ "$requested_lead" -le 0 ]; then
            echo "invalid lead_minutes=$requested_lead (must be a positive integer)" >&2
            exit 2
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            tolerance=15
            min_lead=$((requested_lead - tolerance))
            max_lead=$((requested_lead + tolerance))
            if [ "$min_lead" -lt 5 ]; then min_lead=5; fi
            if [ "$max_lead" -gt 180 ]; then max_lead=180; fi
          else
            # Manual horizon is exact and has no artificial upper bound.
            min_lead="$requested_lead"
            max_lead="$requested_lead"
          fi
          days_forward="$(python -c 'import sys; lead=int(sys.argv[1]); print(max(7, (lead + 15 + 1439) // 1440))' "$requested_lead")"
          echo "requested lead=$requested_lead window=${min_lead}-${max_lead} days_forward=$days_forward adaptive=$adaptive"
          echo "lead=$requested_lead" >> "$GITHUB_OUTPUT"
          echo "min_lead=$min_lead" >> "$GITHUB_OUTPUT"
          echo "max_lead=$max_lead" >> "$GITHUB_OUTPUT"
          echo "adaptive=$adaptive" >> "$GITHUB_OUTPUT"
          echo "days_forward=$days_forward" >> "$GITHUB_OUTPUT"
          args=(
            --sport "${{ matrix.sport }}"
            --lead-minutes "$requested_lead"
            --min-lead-minutes "$min_lead"
            --max-lead-minutes "$max_lead"
            --target-scope-only
          )
          if timeout --signal=TERM --kill-after=30s 300s python -m src.future_predictor "${args[@]}"; then
            echo 'future_prediction=OK'
          else
            rc=$?
            echo "future_prediction=FAILED exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Generate adaptive timing research lane
        if: github.event_name == 'workflow_dispatch'
        id: adaptive_timing
        run: |
          set -uo pipefail
          rc=0
          # Adaptive routing is a separate manual research lane. Scheduled production
          # runs skip this heavier lane so the T-60 prediction path remains timely.
          if timeout --signal=TERM --kill-after=30s 240s python -m src.future_predictor \
              --sport ${{ matrix.sport }} \
              --min-lead-minutes 5 \
              --max-lead-minutes 180 \
              --target-scope-only \
              --adaptive-timing; then
            echo 'adaptive_timing=OK'
          else
            rc=$?
            echo "adaptive_timing=DEGRADED exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Generate one rotating timing-shadow lane
        if: github.event_name == 'workflow_dispatch'
        id: timing_shadow
        run: |
          set -uo pipefail
          rc=0
          slot=$(( ($(date -u +%s) / 900) % 5 ))
          case "$slot" in
            0) lead=60 ;;
            1) lead=45 ;;
            2) lead=20 ;;
            3) lead=15 ;;
            4) lead=90 ;;
          esac
          min_lead=$((lead - 3))
          max_lead=$((lead + 3))
          if [ "$min_lead" -lt 5 ]; then min_lead=5; fi
          echo "TIMING_SHADOW_TARGET lead=$lead window=${min_lead}-${max_lead}"
          if timeout --signal=TERM 240s python -m src.future_predictor \
              --sport ${{ matrix.sport }} \
              --lead-minutes "$lead" \
              --min-lead-minutes "$min_lead" \
              --max-lead-minutes "$max_lead" \
              --target-scope-only \
              --timing-shadow; then
            echo 'timing_shadow=OK'
          else
            rc=$?
            echo "timing_shadow=FAILED exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Score accumulated prediction experience
        id: experience
        run: |
          set -uo pipefail
          rc=0
          if python -m src.prediction_experience --score-only; then
            echo 'prediction_experience=OK'
          else
            rc=$?
            echo "prediction_experience=FAILED exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Audit every target event in the active pre-event timing window
        id: audit
        run: |
          set -uo pipefail
          rc=0
          if python -m src.pre_event_prediction_audit \
              --sport ${{ matrix.sport }} \
              --db data/db/sports_v45.sqlite \
              --target-lead-minutes "${{ steps.predict.outputs.lead }}" \
              --min-lead-minutes "${{ steps.predict.outputs.min_lead }}" \
              --max-lead-minutes "${{ steps.predict.outputs.max_lead }}"; then
            echo 'pre_event_audit=OK'
          else
            rc=$?
            echo "pre_event_audit=GAP exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Validate resulting database
        id: dbguard
        run: |
          set -uo pipefail
          rc=0
          if python -m src.cache_health --db data/db/sports_v45.sqlite --sport ${{ matrix.sport }}; then
            echo 'database=OK'
          else
            rc=$?
            echo "database=FAILED exit=$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Save validated pre-event database
        # Never promote a partially repaired/corrupt DB into the next cache generation.
        if: always() && steps.dbguard.outputs.rc == '0'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: data/db
          key: pre-event-target-db-v1-${{ matrix.sport }}-${{ github.run_id }}

      - name: Publish pre-event audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-event-${{ matrix.sport }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            results/pre_event_prediction_audit_${{ matrix.sport }}.json
            results/future_predictions.json
            results/prediction_eligibility.json
            results/experience_summary.json
            results/match_data_expansion/${{ matrix.sport }}.json

      - name: Preserve explicit lane status
        if: always()
        run: |
          set -euo pipefail
          experience_sync_rc='${{ steps.experience_sync.outputs.rc }}'
          collect_rc='${{ steps.collect.outputs.rc }}'
          predict_rc='${{ steps.predict.outputs.rc }}'
          experience_rc='${{ steps.experience.outputs.rc }}'
          match_data_rc='${{ steps.match_data.outputs.rc }}'
          shadow_rc="${{ steps.timing_shadow.outputs.rc || '0' }}"
          adaptive_rc="${{ steps.adaptive_timing.outputs.rc || '0' }}"
          audit_rc='${{ steps.audit.outputs.rc }}'
          db_rc='${{ steps.dbguard.outputs.rc }}'
          lead='${{ steps.predict.outputs.lead }}'
          min_lead='${{ steps.predict.outputs.min_lead }}'
          max_lead='${{ steps.predict.outputs.max_lead }}'
          adaptive='${{ steps.predict.outputs.adaptive }}'
          days_forward='${{ steps.predict.outputs.days_forward }}'
          echo "PRE_EVENT_STATUS sport=${{ matrix.sport }} lead=$lead window=${min_lead}-${max_lead} days_forward=$days_forward adaptive=$adaptive adaptive_research_rc=$adaptive_rc experience_sync_rc=$experience_sync_rc schedule_rc=$collect_rc match_data_rc=$match_data_rc predict_rc=$predict_rc timing_shadow_rc=$shadow_rc experience_rc=$experience_rc audit_rc=$audit_rc db_rc=$db_rc"
          if [ "$shadow_rc" -ne 0 ]; then
            echo "TIMING_SHADOW_STATUS=DEGRADED exit=$shadow_rc"
          else
            echo "TIMING_SHADOW_STATUS=OK"
          fi
          rc=0
          for x in "$experience_sync_rc" "$collect_rc" "$predict_rc" "$match_data_rc" "$experience_rc" "$audit_rc" "$db_rc"; do
            if [ "$x" -ne 0 ] && [ "$rc" -eq 0 ]; then rc="$x"; fi
          done
          exit "$rc"
