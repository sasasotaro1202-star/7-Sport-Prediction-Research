name: All-Sport Research Matrix

on:
  push:
    paths:
      - ".github/workflows/all_sport_research.yml"
      - "src/ultimate_predictive_control_v13.py"
      - "src/research_cycle_strict.py"
      - "scripts/test_ultimate_predictive_control_v13.py"
      - "scripts/test_ultimate_v13_oos_bridge.py"
  workflow_dispatch:
  schedule:
    - cron: "11 */12 * * *"

permissions:
  contents: read

concurrency:
  group: all-sport-research-matrix
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  ULTIMATE_CONTROL_VERSION: "v13"

jobs:
  research:
    name: Research ${{ matrix.sport }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        sport:
          - valorant
          - basketball
          - volleyball
          - tennis
          - ufc
          - rizin
          - f1
          - rugby
          - boxing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt

      - name: Initialize research directories
        run: |
          set -euo pipefail
          mkdir -p data/db data/raw/http_cache results/research results/v45 models/research

      - name: Restore latest safe database cache
        uses: actions/cache/restore@v4
        with:
          path: data/db
          key: nine-sport-target-db-v4-${{ matrix.sport }}-${{ github.sha }}
          restore-keys: |
            nine-sport-target-db-v4-${{ matrix.sport }}-pit-
            nine-sport-target-db-v4-${{ matrix.sport }}-

      - name: Validate/repair restored database
        shell: bash
        run: |
          set -euo pipefail
          if [ -s data/db/sports_v45.sqlite ]; then
            python -m src.cache_health --db data/db/sports_v45.sqlite --sport "${{ matrix.sport }}" --repair
          else
            echo "RESEARCH_CACHE=EMPTY sport=${{ matrix.sport }}"
          fi

      - name: Initialize database schema
        run: |
          set -euo pipefail
          python -c "from src.storage.db_v45 import connect; c=connect(); c.close()"

      - name: Collect sport-specific history
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.sport }}" in
            valorant)
              python -m src.public_history_backfill --sports valorant
              python -m src.valorant_git_provenance
              ;;
            basketball)
              python -m src.basketball_cdn_backfill --official-only
              ;;
            volleyball)
              python -m src.volleyball_fivb_vis_backfill
              ;;
            tennis)
              python -m src.tennis_public_backfill
              ;;
            ufc)
              python -m src.ufc_api_backfill --limit 200
              ;;
            rizin)
              python -m src.public_history_backfill --sports rizin
              ;;
            f1)
              python -m src.f1_openf1_backfill --start-year 2023 --end-year "$(date -u +%Y)" --timeout 45
              ;;
            rugby)
              python -m src.rugby_production --max-pages 150
              ;;
            boxing)
              python -m src.boxing_production --ingest-history
              ;;
          esac

      - name: Reset isolated frozen holdout registry
        shell: bash
        run: |
          set -euo pipefail
          rm -f "results/research/${{ matrix.sport }}_frozen_holdout.json"
          echo "FROZEN_HOLDOUT_REGISTRY=RESET sport=${{ matrix.sport }}"

      - name: Build common strict PIT replay
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=20s 1800s python -m src.pit_replay_builder

      - name: Run chronological OOS research
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=20s 2400s python -m src.research_cycle_strict --sport "${{ matrix.sport }}"

      - name: Verify research result is explicit JSON
        shell: bash
        run: |
          set -euo pipefail
          test -s "results/research/${{ matrix.sport }}.json"
          python - <<'PY'
          import json
          from pathlib import Path
          sport="${{ matrix.sport }}"
          p=Path(f"results/research/{sport}.json")
          o=json.loads(p.read_text(encoding="utf-8"))
          assert o.get("sport")==sport
          assert isinstance(o.get("status"),str)
          print(f"SPORT={sport} STATUS={o['status']}")
          print(f"PRODUCTION_CHANGED={o.get('production_changed', False)}")
          PY

      - name: Verify v13 bridge artifact contract
        shell: bash
        run: |
          set -euo pipefail
          status="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("results/research/${{ matrix.sport }}.json").read_text(encoding="utf-8")).get("status",""))')"
          if [ "$status" = "TRAINED" ]; then
            test -s "results/research/${{ matrix.sport }}_ultimate_v13.json"
            python -c 'import json; from pathlib import Path; sport="${{ matrix.sport }}"; o=json.loads(Path(f"results/research/{sport}_ultimate_v13.json").read_text(encoding="utf-8")); assert o.get("sport")==sport; assert o.get("status")=="EVALUATED"; assert o.get("mode")=="RESEARCH_ONLY"; assert (o.get("promotion") or {}).get("production")=="HOLD"; assert (o.get("audit") or {}).get("meta_leakage")=="PASS"; print(f"V13_ARTIFACT={sport} STATUS=EVALUATED MODE=RESEARCH_ONLY PROMOTION=HOLD")'
          else
            echo "V13_ARTIFACT_NOT_REQUIRED status=$status"
          fi
      - name: Report actual sport OOS/v13 metrics
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import json; from pathlib import Path; sport="${{ matrix.sport }}"; r=json.loads(Path(f"results/research/{sport}.json").read_text(encoding="utf-8")); print(f"ACTUAL_SPORT={sport} STATUS={r.get(\"status\")}")'
          python -c 'import json; from pathlib import Path; sport="${{ matrix.sport }}"; p=Path(f"results/research/{sport}_ultimate_v13.json"); r=json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}; d=r.get("delta") or {}; cm=(r.get("confidence_metrics") or {}).get("delta") or {}; st=(r.get("stability") or {}).get("delta"); print(f"ACTUAL_V13_METRICS sport={sport} rows={r.get(\"oos_rows\")} accuracy_delta={d.get(\"accuracy\")} logloss_delta={d.get(\"logloss\")} brier_delta={d.get(\"brier\")} ece_delta={d.get(\"ece\")} coverage_delta={cm.get(\"coverage\")} high_confidence_accuracy_delta={cm.get(\"high_confidence_accuracy\")} stability_delta={st}")'
          python -c 'import json; from pathlib import Path; sport="${{ matrix.sport }}"; p=Path(f"results/research/{sport}_ultimate_v13.json"); r=json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}; ai=r.get("active_information") or {}; ev=ai.get("expected_value") or {}; print(f"ACTIVE_INFO_ACTUAL sport={sport} status={ai.get(\"status\")} source={ai.get(\"recommended_next_source\")} mean_logloss_gain={ai.get(\"recommended_source_mean_logloss_gain\")} stable={ev.get(\"stable_positive_gain\")}")'

      - name: Compile and unit regression
        run: |
          set -euo pipefail
          python -m compileall -q src scripts
          python scripts/test_case_risk_oos.py
          python scripts/test_ultimate_predictive_control.py
          python scripts/test_ultimate_predictive_control_v13.py
          python scripts/test_ultimate_v13_oos_bridge.py
          test "${ULTIMATE_CONTROL_VERSION}" = "v13"

      - name: Upload sport research evidence
        uses: actions/upload-artifact@v6
        with:
          name: all-sport-research-${{ matrix.sport }}-${{ github.run_id }}
          path: |
            results/research/${{ matrix.sport }}.json
            results/research/${{ matrix.sport }}_ultimate_intelligence.json
            results/research/${{ matrix.sport }}_ultimate_v13.json
            results/*.json
            results/v45/*.json
          if-no-files-found: warn
          retention-days: 14
