name: Lightweight Regression and Safety Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightweight-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile all source
        run: python -m compileall -q src
      - name: Import canonical modules
        run: |
          python - <<'PY'
          import numpy as np
          import src.dynamic_model_router as router
          import src.future_predictor as future
          import src.research_cycle_strict as strict
          import src.research_cycle_v4 as base
          print("IMPORTS=PASS")
          print("MODEL_POOL", sorted(base.pool().keys()))
          assert "extra_trees_missing" in base.pool()
          assert "hist_gb_missing" in base.pool()
          assert "lightgbm_missing" in base.pool()
          assert "lightgbm_time_decay_300" in base.pool()
          assert "SymmetricAugment" in base.__dict__
          combat_pool = base.pool(["A__x","B__x","D__x","context"], symmetric=True)
          for required in (
              "extra_trees_missing_symmetric",
              "hist_gb_missing_symmetric",
          ):
              assert required in combat_pool
          fsym=["A__x","B__x","D__x","context"]
          sm=base.SymmetricAugment(base.pool()["logistic"].b,fsym)
          Xsym=np.array([[0.,1.,2.,3.],[1.,0.,-2.,3.]])
          ysym=np.array([1,0])
          mirror=sm._mirror(Xsym)
          assert np.allclose(mirror[0],[1.,0.,-2.,3.])
          sm.fit(Xsym,ysym)
          p_sym=sm.predict_proba(Xsym[:1])
          assert p_sym.shape==(1,2) and np.isfinite(p_sym).all()
          print("SYMMETRIC_AUGMENT_SMOKE=PASS")
          td=base.pool()["lightgbm_time_decay_300"]
          X2=np.random.default_rng(7).normal(size=(40,6))
          y2=np.array([0,1]*20)
          td.fit(X2,y2)
          assert td.predict_proba(X2[:4]).shape==(4,2)
          print("MISSINGNESS_AND_RECENCY_CHALLENGERS=PASS")
          print("SPORTS", base.SPORTS)
          PY
      - name: Strict research JSON artifact regression
  run: |
    PYTHONPATH=. python - <<'PY'
    import json
    from pathlib import Path
    files = sorted(Path("results/research").glob("*.json"))
    assert files, "no research result JSON artifacts found"
    for path in files:
        with path.open("r", encoding="utf-8") as fh:
            json.load(fh, parse_constant=lambda value: (_ for _ in ()).throw(ValueError(f"non-standard JSON constant {value} in {path}")))
    print(f"STRICT_RESEARCH_JSON=PASS files={len(files)}")
    PY

- name: Forward prediction registry smoke test
        run: |
          python - <<'PY'
          import sqlite3
          from src.storage.db_v45 import SCHEMA, _migrate
          c=sqlite3.connect(":memory:")
          c.executescript(SCHEMA)
          _migrate(c)
          cols={r[1] for r in c.execute("PRAGMA table_info(forward_prediction)")}
          assert {"prediction_id","event_id","prediction_cutoff_at_utc","feature_snapshot_hash","status"} <= cols
          print("FORWARD_REGISTRY=PASS")
          PY

      - name: Router and calibration smoke tests
        run: |
          python - <<'PY'
          import numpy as np
          from sklearn.metrics import log_loss
          import src.dynamic_model_router as dm
          import src.research_cycle_strict as strict
          rng=np.random.default_rng(42)
          X=rng.normal(size=(240,12))
          X[::17,2]=np.nan
          ref=dm.context_reference(X[:180])
          ctx=dm._context_from_reference(ref,X[180:185])
          assert ctx.shape==(5,10), ctx.shape
          recent=dm._recent_model_loss([[0.7,0.6],[0.5,0.8]],2)
          assert recent.shape==(2,) and np.all(np.isfinite(recent))
          y=(rng.random(180)>.47).astype(int)
          p=np.clip(0.15+0.7*rng.random(180),1e-5,1-1e-5)
          cal=strict._temporal_calibration_candidate(p,y)
          assert isinstance(cal,dict) and 'accepted' in cal
          print("ROUTER_CALIBRATION=PASS")
          PY
      - name: Recent-loss OOS evaluator regression
        run: |
          PYTHONPATH=. python - <<'PY'
          import numpy as np
          import src.research_cycle_strict as strict
          names=["m1","m2"]
          y=np.array([0,1]*60)
          folds=[]
          for i in range(6):
              end=i*20
              te=(i+1)*20
              p1=np.clip(0.45+0.03*np.sin(np.arange(20)),1e-4,1-1e-4)
              p2=np.clip(0.55+0.02*np.cos(np.arange(20)),1e-4,1-1e-4)
              folds.append({
                  "end":end,"te":te,
                  "preds":{"m1":p1,"m2":p2},
              })
          result=strict.evaluate_recent_weighted_router_from_folds(
              np.zeros((120,1)),y,names,folds,{"m1":0.6,"m2":0.4}
          )
          assert result["status"]=="EVALUATED", result
          assert np.isfinite(result["logloss_improvement"])
          print("RECENT_LOSS_OOS_EVALUATOR=PASS")
          PY
      - name: Router incumbent baseline alignment regression
        run: PYTHONPATH=. python scripts/test_router_baseline_alignment.py
      - name: Uncertainty-aware router research-only regression
        run: PYTHONPATH=. python scripts/test_uncertainty_dynamic_router.py
      - name: Selective case-risk research-only regression
        run: PYTHONPATH=. python scripts/test_case_risk_oos.py
      - name: Matchday intelligence PIT regression
        run: PYTHONPATH=. python scripts/test_matchday_intelligence_oos.py
      - name: Matchday horizon research contract regression
        run: PYTHONPATH=. python scripts/test_matchday_horizon_eval.py
      - name: LightGBM smoke test
        run: |
          python - <<'PY'
          import numpy as np
          from lightgbm import LGBMClassifier
          rng=np.random.default_rng(42)
          X=rng.normal(size=(220,14))
          y=(X[:,0]+0.4*X[:,1]+rng.normal(scale=.8,size=220)>0).astype(int)
          m=LGBMClassifier(n_estimators=40,learning_rate=.04,num_leaves=7,min_child_samples=15,
                           verbosity=-1,n_jobs=1,random_state=42,deterministic=True,force_col_wise=True)
          m.fit(X,y)
          p=m.predict_proba(X[:8])[:,1]
          assert p.shape==(8,) and np.all(np.isfinite(p))
          print("LIGHTGBM=PASS")
          PY
      - name: PIT CLI smoke test
        run: python -m src.pit_replay_builder --help
      - name: Independent leakage audit model-contract regression
        run: PYTHONPATH=. python scripts/test_independent_leakage_audit.py
      - name: Temporal feature immutability regression
        run: PYTHONPATH=. python scripts/test_feature_temporal_invariance.py
      - name: Frozen holdout partition regression
        run: PYTHONPATH=. python scripts/test_research_cycle_strict_holdout.py
      - name: Boxing fail-closed guard smoke test
        run: |
          python -m src.boxing_production --probe-only
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/v45/boxing_coverage.json').read_text())
          assert r['sport']=='boxing'
          assert r['status']=='DEFERRED_PIT'
          assert r['production_model_enabled'] is False
          print('BOXING_GUARD=PASS')
          PY
      - name: Boxing history ingest unit test
        run: PYTHONPATH=. python scripts/test_boxing_ingest.py
      - name: Reproducibility manifest schema regression
        run: PYTHONPATH=. python scripts/test_reproducibility_manifest.py
      - name: Research robustness and release safety contract
        run: |
          python - <<'PY'
          from pathlib import Path
          strict=Path('src/research_cycle_strict.py').read_text()
          accelerated=Path('src/research_accelerated.py').read_text()
          gate=Path('src/production_release_gate.py').read_text()
          production=Path('.github/workflows/v4_5_15_production.yml').read_text()
          assert "production_fit_excludes_holdout" in strict
          assert "selection_oos" in strict and "holdout_metrics" in strict
          assert "m.fit(X,y)" in strict
          assert "X_holdout" in strict and "y_holdout" in strict
          assert "_load_or_create_frozen_holdout" in strict
          assert "frozen_holdout_registry_hash" in strict
          assert "final.fit(X,y)" not in accelerated
          assert "final.fit(X, y)" not in accelerated
          assert "size=(1000,len(delta))" in strict
          assert "weighted_pair_pool=list(dict.fromkeys(list(top_rank)+list(names)))" in strict
          assert "triple_pool=rank[:min(6,len(rank))]" in strict
          assert "paired.get('folds',0) >= 6" in strict
          assert "bootstrap_prob_improvement',0.0) >= 0.90" in strict
          assert "Evaluate three non-overlapping chronological OOS blocks" in strict
          assert "Rolling-origin calibration validation" in strict
          router_accept= strict.split("router_accept =",1)[1].split("final_router",1)[0]
          assert "router_eval.get('status') == 'EVALUATED'" in router_accept
          assert "router_eval.get('folds',0) >= 6" in router_accept
          assert "router_eval['logloss_improvement']" in router_accept
          assert "len(router_block_deltas) >= 3" in strict
          assert "router_block_improvements >= 2" in strict
          assert "router_allowed_block_degradation" in strict
          assert "bootstrap_prob_improvement',0.0) >= 0.90" in router_accept
          assert "router_holdout" not in router_accept
          assert "router_holdout" in strict  # score-only frozen-holdout reporting remains present
          assert 'evaluate_frozen_holdout_router_from_folds(X,y,router_names,oof_folds,sel,router_holdout_pred,X_holdout,y_holdout,candidate_weights)' in strict
          assert "frozen holdout is strictly score-only" in strict.lower()
          assert "COALESCE(leakage_status,'UNKNOWN') NOT IN ('PASS','CLEAN')" in gate
          assert "'publishable_artifacts':[]" in gate
          assert "RELEASE_GATED_ARTIFACT=" in production
          assert Path('src/matchday_horizon_eval.py').is_file()
          assert Path('.github/workflows/matchday_horizon_research.yml').is_file()
          future=Path('src/future_predictor.py').read_text()
          assert 'matchday_situation' in future
          assert "'confidence':confidence" in future
          assert "'action_state':action_state" in future
          assert "git add results models" not in production
          print("RESEARCH_ROBUSTNESS_RELEASE_SAFETY=PASS")
          PY
