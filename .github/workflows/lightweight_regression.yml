name: Lightweight Regression and Safety Checks

on:
  push:
    branches: [main]
    # Result/model artifacts are persisted independently. Run the full regression
    # only when source/config/workflow contracts can actually have changed.
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'config/**'
      - 'requirements.txt'
      - 'PROJECT_INSTRUCTIONS.md'
      - 'PROJECT_SOURCE.md'
      - 'README.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightweight-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile all source
        run: python -m compileall -q src
      - name: Validate all GitHub Actions workflows with actionlint
        run: |
          set -euo pipefail
          version='1.7.12'
          url="https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          expected_sha256='8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
          curl --fail --silent --show-error --location "$url" --output /tmp/actionlint.tar.gz
          echo "${expected_sha256}  /tmp/actionlint.tar.gz" | sha256sum --check --status -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -no-color .github/workflows/*.yml
      - name: Undefined-name static analysis for strict research
        run: |
          python -m pip install --retries 5 --timeout 60 "ruff==0.16.10"
          ruff check --output-format=github --select F821 src/research_cycle_strict.py
      - name: Active scope workflow consistency
        run: PYTHONPATH=. python scripts/test_active_scope_workflow.py
      - name: Main-advance compatibility regression
        run: PYTHONPATH=. python scripts/test_main_advance_compatibility.py
      - name: Production watchdog PIT recovery regression
        run: PYTHONPATH=. python scripts/test_production_watchdog_pit_recovery.py
      - name: PIT cache namespace regression
        run: PYTHONPATH=. python scripts/test_pit_cache_namespace.py
      - name: Competition profile regression
        run: PYTHONPATH=. python scripts/test_competition_profiles.py
      - name: Competition OOS failure evidence regression
        run: PYTHONPATH=. python scripts/test_competition_profile_oos_fail_closed.py
      - name: Adaptive timing router regression
        run: PYTHONPATH=. python scripts/test_timing_router.py
      - name: Timing route canonical schema regression
        run: PYTHONPATH=. python scripts/test_timing_route_schema.py
      - name: Canonical Project Source timing alignment regression
