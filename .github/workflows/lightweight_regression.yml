name: Lightweight Regression and Safety Checks

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ops/automation/heartbeat.json'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightweight-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile all source
        run: python -m compileall -q src
      - name: Undefined-name static analysis for strict research
        run: |
          python -m pip install --retries 5 --timeout 60 "ruff==0.16.10"
          ruff check --output-format=github --select F821 src/research_cycle_strict.py
      - name: Active scope workflow consistency
        run: PYTHONPATH=. python scripts/test_active_scope_workflow.py
      - name: Main-advance compatibility regression
        run: PYTHONPATH=. python scripts/test_main_advance_compatibility.py
      - name: PIT cache namespace regression
        run: PYTHONPATH=. python scripts/test_pit_cache_namespace.py
      - name: Competition profile regression
        run: PYTHONPATH=. python scripts/test_competition_profiles.py
      - name: Competition OOS failure evidence regression
        run: PYTHONPATH=. python scripts/test_competition_profile_oos_fail_closed.py
      - name: Adaptive timing router regression
        run: PYTHONPATH=. python scripts/test_timing_router.py
      - name: Timing route canonical schema regression
        run: PYTHONPATH=. python scripts/test_timing_route_schema.py
      - name: Canonical Project Source timing alignment regression
        run: PYTHONPATH=. python scripts/test_project_source_timing_alignment.py
      - name: Production route observability regression
        run: PYTHONPATH=. python scripts/test_prediction_route_observability.py
      - name: Autonomous control-plane dispatch-order regression
        run: PYTHONPATH=. python scripts/test_autonomous_control_plane_workflow.py
      - name: Repository activity keepalive contract regression
        run: PYTHONPATH=. python scripts/test_repository_activity_keepalive.py
      - name: Repository-wide workflow event-storm guard
        run: PYTHONPATH=. python scripts/test_workflow_event_storm_guard.py
      - name: 24H research degraded-evidence continuity regression
        run: PYTHONPATH=. python scripts/test_24h_research_stage_main.py
      - name: Trajectory cache boundary regression
        run: PYTHONPATH=. python scripts/test_trajectory_cache_contract.py
      - name: Production runtime health regression
        run: PYTHONPATH=. python scripts/test_production_runtime_health.py
      - name: Competition-specific routing regression
        run: PYTHONPATH=. python scripts/test_competition_routing.py
      - name: F1 OpenF1 deferred-auth classification regression
        run: PYTHONPATH=. python scripts/test_f1_openf1_deferred.py
      - name: UFC official JSON API parser regression
        run: PYTHONPATH=. python scripts/test_ufc_official_jsonapi.py
      - name: Canonical VLR match URL parser regression
        run: PYTHONPATH=. python scripts/test_vlr_match_url_parser.py
      - name: VLR future schedule and status regression
        run: PYTHONPATH=. python scripts/test_vlr_future_schedule.py
      - name: Match-data event row normalization regression
        run: PYTHONPATH=. python scripts/test_match_data_row_shape.py
      - name: B.LEAGUE official error diagnostics regression
        run: PYTHONPATH=. python scripts/test_basketball_official_error_diagnostics.py
      - name: B.LEAGUE historical error observability regression
