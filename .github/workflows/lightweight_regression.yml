      - name: Matchday intelligence research-only regression
        run: PYTHONPATH=. python scripts/test_matchday_intelligence_oos.py
      - name: Research checkpoint cache persistence
        run: PYTHONPATH=. python scripts/test_research_checkpoint_cache.py
      - name: Release gate fail-closed exit regression
        run: PYTHONPATH=. python scripts/test_release_gate_fail_closed.py
      - name: Strict OOS ranking fail-closed regression
        run: PYTHONPATH=. python scripts/test_strict_oos_ranking_fail_closed.py
      - name: Future predictor prediction-cutoff PIT test
        run: PYTHONPATH=. python scripts/test_future_predictor_pit_cutoff.py
      - name: PIT history 9-hour cadence contract
        run: PYTHONPATH=. python scripts/test_pit_history_cadence.py
      - name: Pre-event prediction timing contract
        run: PYTHONPATH=. python scripts/test_pre_event_prediction.py
      - name: Fresh prediction request contract
        run: PYTHONPATH=. python scripts/test_latest_prediction_contract.py
      - name: Forced fresh HTTP retrieval behavior
        run: PYTHONPATH=. python scripts/test_forced_fresh_http.py
      - name: Active scope runtime regression
        run: PYTHONPATH=. python scripts/test_prediction_scope_runtime.py
      - name: Prediction experience ledger test
        run: PYTHONPATH=. python scripts/test_prediction_experience.py
      - name: Experience learning loop regression
        run: PYTHONPATH=. python scripts/test_experience_learning.py
      - name: Experience research bridge regression
        run: PYTHONPATH=. python scripts/test_experience_research_bridge.py
      - name: Temporal similarity memory router regression
        run: PYTHONPATH=. python scripts/test_temporal_memory_router.py
      - name: Prediction method meta-policy regression
        run: PYTHONPATH=. python scripts/test_prediction_method_policy.py
      - name: Dual learning cycle contract
        run: PYTHONPATH=. python scripts/test_dual_learning_cycle.py
      - name: Import canonical modules
        run: |
          python - <<'PY'
          import numpy as np
          import src.dynamic_model_router as router
          import src.future_predictor as future
          import src.research_cycle_strict as strict
          import src.research_cycle_v4 as base
          print("IMPORTS=PASS")
          print("MODEL_POOL", sorted(base.pool().keys()))
          assert "extra_trees_missing" in base.pool()
          assert "hist_gb_missing" in base.pool()
          assert "lightgbm_missing" in base.pool()
          assert "lightgbm_time_decay_300" in base.pool()
          assert "SymmetricAugment" in base.__dict__
          combat_pool = base.pool(["A__x","B__x","D__x","context"], symmetric=True)
          for required in (
              "extra_trees_missing_symmetric",
              "hist_gb_missing_symmetric",
          ):
              assert required in combat_pool
          fsym=["A__x","B__x","D__x","context"]
          sm=base.SymmetricAugment(base.pool()["logistic"].b,fsym)
          Xsym=np.array([[0.,1.,2.,3.],[1.,0.,-2.,3.]])
          ysym=np.array([1,0])
          mirror=sm._mirror(Xsym)
          assert np.allclose(mirror[0],[1.,0.,-2.,3.])
          sm.fit(Xsym,ysym)
          p_sym=sm.predict_proba(Xsym[:1])
          assert p_sym.shape==(1,2) and np.isfinite(p_sym).all()