name: Source Usage Audit Smoke

on:
  push:
    paths:
      - "src/source_usage_audit.py"
      - "scripts/test_source_usage_audit.py"
      - "config/SPORT_DATA_SOURCES_9.json"
      - "src/research_cycle_v4.py"
      - "src/international_context.py"
      - "scripts/test_international_context_pit.py"
      - ".github/workflows/source_usage_audit_smoke.yml"
  pull_request:
    paths:
      - "src/source_usage_audit.py"
      - "scripts/test_source_usage_audit.py"
      - "config/SPORT_DATA_SOURCES_9.json"
      - "src/research_cycle_v4.py"
      - "src/international_context.py"
      - "scripts/test_international_context_pit.py"
      - ".github/workflows/source_usage_audit_smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

concurrency:
  group: source-usage-audit-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile audit and regression test
        run: |
          set -euo pipefail
          python -m py_compile src/source_usage_audit.py src/international_context.py scripts/test_source_usage_audit.py scripts/test_international_context_pit.py
          python scripts/test_source_usage_audit.py
          python scripts/test_international_context_pit.py
