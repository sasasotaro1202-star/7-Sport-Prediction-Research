name: Future Prior Retrieval PIT Smoke

on:
  push:
    branches:
      - autonomous/future-prior-retrieval-pit-main-20260926
  pull_request:
    branches:
      - main
    paths:
      - "src/future_predictor.py"
      - "scripts/test_future_predictor_pit_cutoff.py"
      - ".github/workflows/future_prior_retrieval_pit_smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Coalesce push/PR validation for the same source branch so stale commits
  # cannot occupy the Actions queue after a newer commit supersedes them.
  group: future-prior-retrieval-pit-smoke-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  future-prior-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile and run PIT fixture
        run: |
          python -m compileall -q src/future_predictor.py scripts/test_future_predictor_pit_cutoff.py
          PYTHONPATH=. python scripts/test_future_predictor_pit_cutoff.py
