name: Seven Sport Bootstrap Full History

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Historical window in days'
        required: true
        default: '3650'
        type: string
      reset_state:
        description: 'Reset collection checkpoints before starting'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: seven-sport-bootstrap-full-history
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  backfill:
    name: Backfill ${{ matrix.sport }}
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        sport: [valorant, basketball, volleyball, tennis, ufc, rizin, f1]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore HTTP/source cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/http_cache
          key: seven-sport-http-${{ matrix.sport }}-${{ hashFiles('src/seven_sport_production.py', 'src/robust_sport_adapters_v2.py', 'src/international_context.py') }}
          restore-keys: seven-sport-http-${{ matrix.sport }}-
      - run: python -m pip install -r requirements.txt
      - name: Prepare runtime directories and inspect capacity
        run: |
          set -euo pipefail
          mkdir -p data/raw/http_cache data/db results models
          df -h .
      - name: Compile-check production code
        run: python -m compileall -q src
      - name: Reset checkpoint state when requested
        if: ${{ inputs.reset_state == true }}
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          p = Path('data/db/sports_v45.sqlite')
          if p.exists():
              with sqlite3.connect(p) as c:
                  c.execute("DELETE FROM collection_state WHERE sport=?", ('${{ matrix.sport }}',))
                  c.commit()
          PY
      - name: Specialized high-yield historical collectors
        env:
          V45_HTTP_TIMEOUT: '20'
          V45_HTTP_RETRIES: '3'
          V45_REQUEST_DELAY: '0.02'
        run: |
          set -euo pipefail
          if [ "${{ matrix.sport }}" = "tennis" ]; then
            python -m src.tennis_bulk_backfill --start-year 1990 --end-year 2026 --timeout 45
          elif [ "${{ matrix.sport }}" = "ufc" ]; then
            python -m src.ufc_api_backfill --limit 10000
          elif [ "${{ matrix.sport }}" = "basketball" ]; then
            python -m src.basketball_cdn_backfill --both
          fi
      - name: Full historical collection with checkpoint resume
        if: matrix.sport != 'basketball' && matrix.sport != 'tennis' && matrix.sport != 'ufc'
        env:
          V45_HTTP_TIMEOUT: '12'
          V45_HTTP_RETRIES: '3'
          V45_REQUEST_DELAY: '0.02'
          V45_HTTP_WORKERS: '10'
          V45_VLR_PAGES: '180'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m src.seven_sport_production --sport ${{ matrix.sport }} --full-history --days-back '${{ inputs.days_back }}'; then
              exit 0
            fi
            echo "historical collector attempt ${attempt} failed; checkpoint will permit resume"
            sleep $((attempt * 5))
          done
          exit 1
      - name: Validate collected partition
        run: python -m src.collection_guard --sport ${{ matrix.sport }}
      - name: Reconstruct verified outcomes
        run: python -m src.outcome_backfill
      - name: Run strict PIT research cycle
        run: python -m src.research_accelerated --sport ${{ matrix.sport }}
      - name: Save HTTP/source cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/http_cache
          key: seven-sport-http-${{ matrix.sport }}-${{ hashFiles('src/seven_sport_production.py', 'src/robust_sport_adapters_v2.py', 'src/international_context.py') }}-${{ github.run_id }}
      - name: Sport-scoped structural validation
        run: python -m src.quality_gate --sport ${{ matrix.sport }}
      - name: Compress sport partition for transfer
        if: always()
        run: |
          set -euo pipefail
          mkdir -p bootstrap-output
          if [ -f data/db/sports_v45.sqlite ]; then
            gzip -9 -c data/db/sports_v45.sqlite > bootstrap-output/sports_v45.sqlite.gz
          fi
          if [ -d results ]; then tar -czf bootstrap-output/results.tar.gz results; fi
          if [ -d models ]; then tar -czf bootstrap-output/models.tar.gz models; fi
      - name: Upload compressed sport partition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.sport }}-${{ github.run_id }}
          path: bootstrap-output/**
          if-no-files-found: warn
          retention-days: 1

  merge:
    name: Merge and validate all seven sports
    needs: backfill
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Download all compressed sport partitions
        uses: actions/download-artifact@v4
        with:
          pattern: bootstrap-*
          path: bootstrap-artifacts
          merge-multiple: false
      - name: Rehydrate partitions
        run: |
          set -euo pipefail
          find bootstrap-artifacts -name sports_v45.sqlite.gz -print0 | while IFS= read -r -d '' f; do
            d="${f%/*}"
            gzip -dc "$f" > "$d/sports_v45.sqlite"
          done
          find bootstrap-artifacts -name results.tar.gz -print0 | while IFS= read -r -d '' f; do
            tar -xzf "$f" -C "${f%/*}"
          done
          find bootstrap-artifacts -name models.tar.gz -print0 | while IFS= read -r -d '' f; do
            tar -xzf "$f" -C "${f%/*}"
          done
      - name: Count available partitions
        run: find bootstrap-artifacts -name sports_v45.sqlite -print | sort
      - name: Merge into canonical v45 database safely
        run: python -m src.merge_partition_dbs --input-dir bootstrap-artifacts
      - name: Restore sport model artifacts
        run: |
          set -euo pipefail
          mkdir -p models results
          find bootstrap-artifacts -type f -path '*/models/*' -exec cp -n {} models/ \; || true
          find bootstrap-artifacts -type f -path '*/results/*' -exec cp -n {} results/ \; || true
      - name: Global structural quality gate
        run: python -m src.quality_gate
      - name: Prediction eligibility inventory
        run: python -m src.prediction_policy
      - name: Final repository validation
        run: python -m compileall -q src
      - name: Persist lightweight outputs only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          persist_dir="$RUNNER_TEMP/seven-sport-persist"
          rm -rf "$persist_dir" && mkdir -p "$persist_dir"
          cp -a results "$persist_dir/results" 2>/dev/null || true
          cp -a models "$persist_dir/models" 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          git clean -ffdx || true
          rm -rf results models
          mkdir -p results models
          cp -a "$persist_dir/results/." results/ 2>/dev/null || true
          cp -a "$persist_dir/models/." models/ 2>/dev/null || true
          unexpected="$(git status --porcelain --untracked-files=all | awk '$2 !~ /^(results\/|models\/)/ {print}')"
          if [ -n "$unexpected" ]; then
            echo '::error::Unexpected working-tree changes before publish:'
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git add results models
          if git diff --cached --name-only | grep -E '^(data\/|data/db/|data/raw/)'; then
            echo '::error::Generated database/cache entered the staged set; refusing to push'
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'No lightweight output changes to publish.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'chore: update seven-sport bootstrap research outputs'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git merge-base --is-ancestor origin/main HEAD && git push origin HEAD:main; then
              echo 'push succeeded'
              exit 0
            fi
            echo "remote advanced or push rejected on attempt ${attempt}; rebuilding output commit"
            git reset --hard origin/main
            git clean -ffdx || true
            rm -rf results models
            mkdir -p results models
            cp -a "$persist_dir/results/." results/ 2>/dev/null || true
            cp -a "$persist_dir/models/." models/ 2>/dev/null || true
            git add results models
            if git diff --cached --quiet; then
              echo 'Remote already contains equivalent lightweight outputs.'
              exit 0
            fi
            git diff --cached --check
            git commit -m 'chore: update seven-sport bootstrap research outputs'
            sleep $((attempt * 2))
          done
          echo '::error::final push failed after 5 deterministic retries'
          exit 1
      - name: Upload merged research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-merged-${{ github.run_id }}
          path: |
            data/db/sports_v45.sqlite
            results/**
            models/**
          if-no-files-found: warn
          retention-days: 1
