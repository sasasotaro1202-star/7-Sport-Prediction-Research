name: Seven Sport Bootstrap Full History

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Historical window in days'
        required: true
        default: '3650'
        type: string
      reset_state:
        description: 'Reset collection checkpoints before starting'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: seven-sport-bootstrap
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  backfill:
    name: Backfill ${{ matrix.sport }}
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        sport: [valorant, basketball, volleyball, tennis, ufc, rizin, f1]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore HTTP/source cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/http_cache
          key: seven-sport-http-${{ matrix.sport }}-${{ hashFiles('src/seven_sport_production.py') }}
          restore-keys: |
            seven-sport-http-${{ matrix.sport }}-
      - run: python -m pip install -r requirements.txt
      - name: Prepare persistent cache directory
        run: mkdir -p data/raw/http_cache data/db results models
      - name: Compile-check production code
        run: python -m compileall -q src
      - name: Reset collection checkpoint when requested
        if: inputs.reset_state == true
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          p=Path('data/db/sports_v45.sqlite')
          if p.exists():
              c=sqlite3.connect(p)
              c.execute("DELETE FROM collection_state WHERE sport=?", ('${{ matrix.sport }}',))
              c.commit(); c.close()
          print('checkpoint reset:', '${{ matrix.sport }}')
          PY
      - name: Full historical collection with checkpoint resume
        continue-on-error: true
        env:
          V45_HTTP_TIMEOUT: '12'
          V45_HTTP_RETRIES: '2'
          V45_REQUEST_DELAY: '0.02'
          V45_HTTP_WORKERS: '10'
          V45_VLR_PAGES: '180'
        run: |
          set +e
          rc=1
          for attempt in 1 2 3; do
            python -m src.seven_sport_production --sport ${{ matrix.sport }} --full-history --days-back ${{ inputs.days_back }} && rc=0 && break
            echo "historical collector attempt ${attempt} failed; checkpoint will permit resume"
            sleep $((attempt * 5))
          done
          exit $rc
      - name: Validate collected partition
        if: always()
        continue-on-error: true
        run: python -m src.collection_guard --sport ${{ matrix.sport }}
      - name: Add deep ATP/WTA historical foundation
        if: matrix.sport == 'tennis'
        continue-on-error: true
        run: python -m src.tennis_bulk_backfill --start-year 1990 --end-year 2026 --timeout 45
      - name: Reconstruct verified outcomes
        continue-on-error: true
        run: python -m src.outcome_backfill
      - name: Run strict PIT research cycle (accelerated)
        continue-on-error: true
        run: python -m src.research_accelerated --sport ${{ matrix.sport }}
      - name: Save HTTP/source cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/http_cache
          key: seven-sport-http-${{ matrix.sport }}-${{ hashFiles('src/seven_sport_production.py') }}-${{ github.run_id }}
      - name: Sport-scoped structural validation
        continue-on-error: true
        run: python -m src.quality_gate --sport ${{ matrix.sport }}
      - name: Upload sport partition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.sport }}-${{ github.run_id }}
          path: |
            data/db/sports_v45.sqlite
            results/**
            models/**
          if-no-files-found: warn

  merge:
    name: Merge and validate all seven sports
    needs: backfill
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Download all sport partitions
        uses: actions/download-artifact@v4
        with:
          pattern: bootstrap-*
          path: bootstrap-artifacts
          merge-multiple: false
      - name: Count available partitions
        run: find bootstrap-artifacts -name sports_v45.sqlite -print | sort
      - name: Merge into canonical v45 database safely
        run: python -m src.merge_partition_dbs_safe --input-dir bootstrap-artifacts
      - name: Restore sport model artifacts
        run: |
          mkdir -p models results
          find bootstrap-artifacts -type f -path '*/models/*' -exec cp -n {} models/ \; || true
          find bootstrap-artifacts -type f -path '*/results/*' -exec cp -n {} results/ \; || true
      - name: Global structural quality gate
        continue-on-error: true
        run: python -m src.quality_gate
      - name: Prediction eligibility inventory
        continue-on-error: true
        run: python -m src.prediction_policy
      - name: Persist merged database and reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data results models
          git diff --cached --quiet || git commit -m 'chore: merge seven-sport bootstrap history'
          git push
      - name: Upload merged database and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-merged-${{ github.run_id }}
          path: |
            data/**
            results/**
            models/**
          if-no-files-found: warn
