name: Seven Sport Bootstrap Full History

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Historical window in days'
        required: true
        default: '3650'
        type: string

permissions:
  contents: write

jobs:
  collect:
    name: Collect ${{ matrix.sport }}
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        sport: [valorant, basketball, volleyball, tennis, ufc, rizin, f1]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Full historical collection
        run: python -m src.seven_sport_production --sport ${{ matrix.sport }} --full-history --days-back ${{ inputs.days_back }}
      - name: Upload sport partition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.sport }}
          path: |
            data/db/sports_v45.sqlite
            results/**
          if-no-files-found: warn

  merge:
    name: Merge seven sport partitions
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Download collected partitions
        uses: actions/download-artifact@v4
        with:
          pattern: bootstrap-*
          path: bootstrap-artifacts
          merge-multiple: false
      - name: Merge partition databases
        run: python -m src.merge_partition_dbs --input-dir bootstrap-artifacts
      - name: Quality gate (fail closed, report preserved)
        run: python -m src.quality_gate --strict || true
      - name: Persist merged database and reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data results
          git diff --cached --quiet || git commit -m 'chore: merge seven-sport historical bootstrap'
          git push
      - name: Upload merged outputs
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-merged
          path: |
            data/**
            results/**
          if-no-files-found: warn
