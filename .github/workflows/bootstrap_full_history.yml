name: Seven Sport Bootstrap Full History

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Historical window in days'
        required: true
        default: '3650'
        type: string
      reset_state:
        description: 'Reset collection checkpoints before starting'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: seven-sport-bootstrap
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  backfill:
    name: Backfill ${{ matrix.sport }}
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        sport: [valorant, basketball, volleyball, tennis, ufc, rizin, f1]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore HTTP/source cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/http_cache
          key: seven-sport-http-${{ matrix.sport }}-${{ hashFiles('src/seven_sport_production.py') }}
          restore-keys: |
            seven-sport-http-${{ matrix.sport }}-
      - run: python -m pip install -r requirements.txt
      - name: Full historical collection with checkpoint resume
        env:
          V45_HTTP_TIMEOUT: '12'
          V45_HTTP_RETRIES: '1'
          V45_REQUEST_DELAY: '0.03'
          V45_HTTP_WORKERS: '10'
          V45_VLR_PAGES: '180'
        run: >-
          python -m src.seven_sport_production
          --sport ${{ matrix.sport }}
          --full-history
          --days-back ${{ inputs.days_back }}
          ${{ inputs.reset_state && '--reset-state' || '' }}
      - name: Save HTTP/source cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/http_cache
          key: seven-sport-http-${{ matrix.sport }}-${{ hashFiles('src/seven_sport_production.py') }}-${{ github.run_id }}
      - name: Sport-scoped structural validation
        continue-on-error: true
        run: python -m src.quality_gate --sport ${{ matrix.sport }}
      - name: Upload sport partition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.sport }}-${{ github.run_id }}
          path: |
            data/db/sports_v45.sqlite
            results/**
          if-no-files-found: warn

  merge:
    name: Merge and validate all seven sports
    needs: backfill
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Download all sport partitions
        uses: actions/download-artifact@v4
        with:
          pattern: bootstrap-*
          path: bootstrap-artifacts
          merge-multiple: false
      - name: Count available partitions
        run: find bootstrap-artifacts -name sports_v45.sqlite -print | sort
      - name: Merge into canonical v45 database
        run: python -m src.merge_partition_dbs --input-dir bootstrap-artifacts
      - name: Global structural quality gate
        continue-on-error: true
        run: python -m src.quality_gate
      - name: Persist merged database and reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data results
          git diff --cached --quiet || git commit -m 'chore: merge seven-sport bootstrap history'
          git push
      - name: Upload merged database and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-merged-${{ github.run_id }}
          path: |
            data/**
            results/**
          if-no-files-found: warn
