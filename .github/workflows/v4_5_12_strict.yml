name: Seven Sport v4.5.12 Strict Production

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: seven-sport-main-writer
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  collect:
    name: Incremental ${{ matrix.sport }}
    strategy:
      fail-fast: false
      max-parallel: 7
    matrix:
      sport: [valorant, basketball, volleyball, tennis, ufc, rizin, f1]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore source cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/http_cache
          key: seven-sport-http-${{ matrix.sport }}-${{ hashFiles('src/collectors/production_v45.py', 'src/seven_sport_production.py', 'src/robust_sport_adapters_v2.py', 'src/international_context.py') }}
          restore-keys: seven-sport-http-${{ matrix.sport }}-
      - name: Restore persistent sport database
        uses: actions/cache/restore@v4
        with:
          path: data/db/sports_v45.sqlite
          key: seven-sport-db-v3-${{ matrix.sport }}-${{ github.run_id }}
          restore-keys: seven-sport-db-v3-${{ matrix.sport }}-
      - run: python -m pip install -r requirements.txt
      - run: mkdir -p data/raw/http_cache data/db results models
      - name: Initialize canonical schema
        run: python -c "from src.storage.db_v45 import connect; c=connect(); c.close(); print('schema-ok')"
      - name: Compile-check production code
        run: python -m compileall -q src
      - name: Collect one sport incrementally
        env:
          V45_HTTP_TIMEOUT: '10'
          V45_HTTP_RETRIES: '3'
          V45_REQUEST_DELAY: '0.02'
          V45_HTTP_WORKERS: '10'
          V45_VLR_PAGES: '20'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m src.seven_sport_production --sport ${{ matrix.sport }} --days-back 3; then exit 0; fi
            echo "collector attempt ${attempt} failed; retrying"
            sleep $((attempt * 3))
          done
          exit 1
      - name: Detect historical backfill need
        id: history_need
        run: |
          python - <<'PY'
          import sqlite3, os
          db='data/db/sports_v45.sqlite'; need='true'
          if os.path.exists(db):
              c=sqlite3.connect(db)
              n=c.execute('SELECT COUNT(*) FROM event WHERE sport=?', ('${{ matrix.sport }}',)).fetchone()[0]
              c.close()
              thresholds={'basketball':5000,'tennis':5000,'valorant':500,'volleyball':500,'ufc':1000,'rizin':200,'f1':100}
              need='true' if n < thresholds.get('${{ matrix.sport }}',300) else 'false'
              print(f"sport=${{ matrix.sport }} events={n} history_need={need}")
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'need={need}\n')
          PY
      - name: Historical basketball backfill
        if: matrix.sport == 'basketball' && steps.history_need.outputs.need == 'true'
        run: python -m src.espn_backfill --sport basketball --leagues nba,wnba --start-year 2016 --end-year 2026
      - name: Basketball public schedule fallback
        if: matrix.sport == 'basketball'
        run: python -m src.basketball_cdn_backfill --both
      - name: Historical tennis backfill
        if: matrix.sport == 'tennis' && steps.history_need.outputs.need == 'true'
        run: python -m src.espn_backfill --sport tennis --leagues atp,wta --start-year 2016 --end-year 2026
      - name: Free public history fallback
        run: |
          case "${{ matrix.sport }}" in
            valorant|basketball|volleyball|rizin) python -m src.public_history_backfill --sports ${{ matrix.sport }} ;;
            tennis) python -m src.tennis_public_backfill ;;
          esac
      - name: Enrich F1 with incremental OpenF1 data
        if: matrix.sport == 'f1'
        run: python -m src.f1_openf1_backfill --start-year 2023 --end-year 2026 --timeout 30
      - name: Validate collected partition
        run: python -m src.collection_guard --sport ${{ matrix.sport }}
      - name: Save persistent sport database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/db/sports_v45.sqlite
          key: seven-sport-db-v3-${{ matrix.sport }}-${{ github.run_id }}
      - name: Save source cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/http_cache
          key: seven-sport-http-${{ matrix.sport }}-${{ hashFiles('src/collectors/production_v45.py', 'src/seven_sport_production.py', 'src/robust_sport_adapters_v2.py', 'src/international_context.py') }}-${{ github.run_id }}

  merge:
    name: Merge and strict quality gate
    needs: [collect]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: mkdir -p hourly-artifacts data/db results models
      - name: Restore and materialize all seven partitions
        run: |
          set -euo pipefail
          for sport in valorant basketball volleyball tennis ufc rizin f1; do
            mkdir -p "hourly-artifacts/$sport"
          done
      - name: Restore VALORANT
        uses: actions/cache/restore@v4
        with:
          path: data/db/sports_v45.sqlite
          key: seven-sport-db-v3-valorant-${{ github.run_id }}
      - run: cp data/db/sports_v45.sqlite hourly-artifacts/valorant/sports_v45.sqlite && rm -f data/db/sports_v45.sqlite
      - name: Restore Basketball
        uses: actions/cache/restore@v4
        with:
          path: data/db/sports_v45.sqlite
          key: seven-sport-db-v3-basketball-${{ github.run_id }}
      - run: cp data/db/sports_v45.sqlite hourly-artifacts/basketball/sports_v45.sqlite && rm -f data/db/sports_v45.sqlite
      - name: Restore Volleyball
        uses: actions/cache/restore@v4
        with:
          path: data/db/sports_v45.sqlite
          key: seven-sport-db-v3-volleyball-${{ github.run_id }}
      - run: cp data/db/sports_v45.sqlite hourly-artifacts/volleyball/sports_v45.sqlite && rm -f data/db/sports_v45.sqlite
      - name: Restore Tennis
        uses: actions/cache/restore@v4
        with:
          path: data/db/sports_v45.sqlite
          key: seven-sport-db-v3-tennis-${{ github.run_id }}
      - run: cp data/db/sports_v45.sqlite hourly-artifacts/tennis/sports_v45.sqlite && rm -f data/db/sports_v45.sqlite
      - name: Restore UFC
        uses: actions/cache/restore@v4
        with:
          path: data/db/sports_v45.sqlite
          key: seven-sport-db-v3-ufc-${{ github.run_id }}
      - run: cp data/db/sports_v45.sqlite hourly-artifacts/ufc/sports_v45.sqlite && rm -f data/db/sports_v45.sqlite
      - name: Restore RIZIN
        uses: actions/cache/restore@v4
        with:
          path: data/db/sports_v45.sqlite
          key: seven-sport-db-v3-rizin-${{ github.run_id }}
      - run: cp data/db/sports_v45.sqlite hourly-artifacts/rizin/sports_v45.sqlite && rm -f data/db/sports_v45.sqlite
      - name: Restore F1
        uses: actions/cache/restore@v4
        with:
          path: data/db/sports_v45.sqlite
          key: seven-sport-db-v3-f1-${{ github.run_id }}
      - run: cp data/db/sports_v45.sqlite hourly-artifacts/f1/sports_v45.sqlite && rm -f data/db/sports_v45.sqlite
      - name: Verify all seven partitions
        run: |
          set -euo pipefail
          for sport in valorant basketball volleyball tennis ufc rizin f1; do
            test -s "hourly-artifacts/$sport/sports_v45.sqlite"
          done
      - name: Merge partitions
        run: python -m src.merge_partition_dbs --input-dir hourly-artifacts
      - name: Run robust adapters
        run: python -m src.robust_sport_adapters_v4
      - name: Repair F1 integrity
        run: python -m src.f1_integrity_cleanup --vacuum
      - name: Reconstruct verified outcomes
        run: python -m src.outcome_backfill
      - name: Build strict PIT replay snapshots
        run: python -m src.pit_replay_builder
      - name: Run strict PIT research cycle
        run: python -m src.research_cycle
      - name: Strict global quality gate
        run: python -m src.quality_gate --strict
      - name: Production invariants
        run: python -m src.production_invariants
      - name: Final validation
        run: python -m compileall -q src
      - name: Persist lightweight outputs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results models
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: update seven-sport research results'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
