name: 24H Autonomous Research Marathon

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_24h_research_stage_main.py"
      - "config/ACTIVE_SCOPE_9_SPORTS.json"
  schedule:
    - cron: "17 15 * * *"

permissions:
  contents: read

concurrency:
  group: 24h-autonomous-research-main
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: .
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  stage1:
    name: "24H Stage 1 / basketball"
    runs-on: ubuntu-latest
    timeout-minutes: 299
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Restore latest safe basketball DB
        uses: actions/cache/restore@v4
        with:
          path: data/db
          key: 24h-main-db-basketball-${{ github.run_id }}-stage-1
          restore-keys: |
            24h-main-db-basketball-
      - name: Initialize directories
        run: |
          set -euo pipefail
          mkdir -p data/db data/raw/http_cache results/research results/v45 models/research results/24h_marathon
      - name: Preflight evidence verifier test
        run: python scripts/test_24h_research_evidence.py
      - name: Preflight 24H workflow contract test
        run: python scripts/test_24h_workflow_contract.py
      - name: Run 24H stage
        run: python scripts/run_24h_research_stage_main.py --stage 1 --minutes 282 --research-interval-minutes 90
      - name: Save basketball DB checkpoint
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/db
          key: 24h-main-db-basketball-${{ github.run_id }}-stage-1
      - name: Upload stage evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: 24h-main-stage-1-${{ github.run_id }}
          path: |
            results/24h_marathon/**
            results/research/basketball.json
            results/research/basketball_ultimate_v13.json
            results/research/basketball_ultimate_intelligence.json
          if-no-files-found: warn
          retention-days: 2

  stage2:
    name: "24H Stage 2 / volleyball"
    runs-on: ubuntu-latest
    timeout-minutes: 299
    needs: stage1
    if: always()
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Restore latest safe volleyball DB
        uses: actions/cache/restore@v4
        with:
          path: data/db
          key: 24h-main-db-volleyball-${{ github.run_id }}-stage-2
          restore-keys: |
            24h-main-db-volleyball-
      - name: Initialize directories
        run: |
          set -euo pipefail
          mkdir -p data/db data/raw/http_cache results/research results/v45 models/research results/24h_marathon
      - name: Run 24H stage
        run: python scripts/run_24h_research_stage_main.py --stage 2 --minutes 282 --research-interval-minutes 90
      - name: Save volleyball DB checkpoint
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/db
          key: 24h-main-db-volleyball-${{ github.run_id }}-stage-2
      - name: Upload stage evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: 24h-main-stage-2-${{ github.run_id }}
          path: |
            results/24h_marathon/**
            results/research/volleyball.json
            results/research/volleyball_ultimate_v13.json
            results/research/volleyball_ultimate_intelligence.json
          if-no-files-found: warn
          retention-days: 2

  stage3:
    name: "24H Stage 3 / ufc"
    runs-on: ubuntu-latest
    timeout-minutes: 299
    needs: stage2
    if: always()
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Restore latest safe ufc DB
        uses: actions/cache/restore@v4
        with:
          path: data/db
          key: 24h-main-db-ufc-${{ github.run_id }}-stage-3
          restore-keys: |
            24h-main-db-ufc-
      - name: Initialize directories
        run: |
          set -euo pipefail
          mkdir -p data/db data/raw/http_cache results/research results/v45 models/research results/24h_marathon
      - name: Run 24H stage
        run: python scripts/run_24h_research_stage_main.py --stage 3 --minutes 282 --research-interval-minutes 90
      - name: Save ufc DB checkpoint
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/db
          key: 24h-main-db-ufc-${{ github.run_id }}-stage-3
      - name: Upload stage evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: 24h-main-stage-3-${{ github.run_id }}
          path: |
            results/24h_marathon/**
            results/research/ufc.json
            results/research/ufc_ultimate_v13.json
            results/research/ufc_ultimate_intelligence.json
          if-no-files-found: warn
          retention-days: 2

  stage4:
    name: "24H Stage 4 / rizin"
    runs-on: ubuntu-latest
    timeout-minutes: 299
    needs: stage3
    if: always()
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Restore latest safe rizin DB
        uses: actions/cache/restore@v4
        with:
          path: data/db
          key: 24h-main-db-rizin-${{ github.run_id }}-stage-4
          restore-keys: |
            24h-main-db-rizin-
      - name: Initialize directories
        run: |
          set -euo pipefail
          mkdir -p data/db data/raw/http_cache results/research results/v45 models/research results/24h_marathon
      - name: Run 24H stage
        run: python scripts/run_24h_research_stage_main.py --stage 4 --minutes 282 --research-interval-minutes 90
      - name: Save rizin DB checkpoint
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/db
          key: 24h-main-db-rizin-${{ github.run_id }}-stage-4
      - name: Upload stage evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: 24h-main-stage-4-${{ github.run_id }}
          path: |
            results/24h_marathon/**
            results/research/rizin.json
            results/research/rizin_ultimate_v13.json
            results/research/rizin_ultimate_intelligence.json
          if-no-files-found: warn
          retention-days: 2

  stage5:
    name: "24H Stage 5 / valorant"
    runs-on: ubuntu-latest
    timeout-minutes: 299
    needs: stage4
    if: always()
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Restore latest safe valorant DB
        uses: actions/cache/restore@v4
        with:
          path: data/db
          key: 24h-main-db-valorant-${{ github.run_id }}-stage-5
          restore-keys: |
            24h-main-db-valorant-
      - name: Initialize directories
        run: |
          set -euo pipefail
          mkdir -p data/db data/raw/http_cache results/research results/v45 models/research results/24h_marathon
      - name: Run 24H stage
        run: python scripts/run_24h_research_stage_main.py --stage 5 --minutes 282 --research-interval-minutes 90
      - name: Save valorant DB checkpoint
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/db
          key: 24h-main-db-valorant-${{ github.run_id }}-stage-5
      - name: Upload stage evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: 24h-main-stage-5-${{ github.run_id }}
          path: |
            results/24h_marathon/**
            results/research/valorant.json
            results/research/valorant_ultimate_v13.json
            results/research/valorant_ultimate_intelligence.json
          if-no-files-found: warn
          retention-days: 2



  finalize:
    name: "Final / 24H evidence reconciliation"
    needs: [stage1, stage2, stage3, stage4, stage5]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Download all stage evidence
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          pattern: 24h-main-stage-*-${{ github.run_id }}
          path: artifacts/24h
          merge-multiple: true
      - name: Reconcile immutable handoff
        env:
          S1: ${{ needs.stage1.result }}
          S2: ${{ needs.stage2.result }}
          S3: ${{ needs.stage3.result }}
          S4: ${{ needs.stage4.result }}
          S5: ${{ needs.stage5.result }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/final
          python - <<'PY'
          import json, os
          from pathlib import Path

          stage_results = {
              "stage1_basketball": os.environ["S1"],
              "stage2_volleyball": os.environ["S2"],
              "stage3_ufc": os.environ["S3"],
              "stage4_rizin": os.environ["S4"],
              "stage5_valorant": os.environ["S5"],
          }
          finals = sorted(Path("artifacts/24h").rglob("stage_*_final.json"))
          payload = {
              "schema_version": 1,
              "status": "COMPLETED" if all(v == "success" for v in stage_results.values()) else "PARTIAL_OR_BLOCKED",
              "github_sha": os.environ["GITHUB_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "stage_results": stage_results,
              "final_stage_evidence_count": len(finals),
              "research_only": True,
              "production_model_touched": False,
              "hard_exclusions": ["baseball", "soccer"],
          }

          if len(finals) != 5:
              payload["status"] = "PARTIAL_OR_BLOCKED"

          for path in finals:
              obj = json.loads(path.read_text(encoding="utf-8"))
              if obj.get("research_only") is not True:
                  raise SystemExit(f"research_only contract failed: {path}")
              if obj.get("production_model_touched") is not False:
                  raise SystemExit(f"production boundary claim failed: {path}")
              if set(obj.get("hard_exclusions", [])) != {"baseball", "soccer"}:
                  raise SystemExit(f"hard exclusion contract failed: {path}")

          Path("artifacts/final/24h_run_status.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
      - name: Upload reconciled 24H handoff
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: 24h-main-reconciled-${{ github.run_id }}
          path: artifacts/final/24h_run_status.json
          if-no-files-found: error
          retention-days: 7
