name: Matchday Horizon Research

on:
  schedule:
    - cron: '11 */12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matchday-horizon-research
  cancel-in-progress: true

jobs:
  horizon-research:
    strategy:
      fail-fast: false
      matrix:
        sport: [valorant, basketball, volleyball, ufc, rizin]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies with bounded network retry
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Restore latest sport database cache
        uses: actions/cache/restore@v4
        with:
          path: data/db
          key: nine-sport-target-db-v4-${{ matrix.sport }}-${{ github.run_id }}
          restore-keys: |
            nine-sport-target-db-v4-${{ matrix.sport }}-
      - name: Initialize schema when no usable cache exists
        run: |
          mkdir -p data/db
          python - <<'PY'
          from src.storage.db_v45 import connect
          c=connect()
          c.close()
          PY
      - name: Verify evaluator before execution
        run: python -m compileall -q src/matchday_horizon_eval.py scripts/test_matchday_horizon_eval.py
      - name: Evaluator smoke test
        run: PYTHONPATH=. python scripts/test_matchday_horizon_eval.py
      - name: Run multi-horizon research with bounded timeout
        shell: bash
        run: |
          set +e
          timeout --signal=TERM 1200s python -m src.matchday_horizon_eval --sport "${{ matrix.sport }}"
          rc=$?
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 143 ]; then
            echo "MATCHDAY_HORIZON_RESEARCH=TIMEOUT"
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/matchday_horizon_research.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({
              'status':'TIMEOUT',
              'policy':'research_only; timeout is explicit and never promotes a model',
          },ensure_ascii=False,indent=2),encoding='utf-8')
          PY
            exit 0
          fi
          exit "$rc"
      - name: Upload horizon research report
        uses: actions/upload-artifact@v4
        with:
          name: matchday-horizon-research-${{ matrix.sport }}-${{ github.run_id }}
          path: results/matchday_horizon_research.json
          retention-days: 14
