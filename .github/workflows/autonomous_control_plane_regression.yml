name: Autonomous Control Plane Regression

on:
  pull_request:
    paths:
      - "src/autonomous_control_plane.py"
      - "scripts/test_autonomous_control_plane.py"
      - "scripts/test_autonomous_control_plane_workflow.py"
      - ".github/workflows/autonomous_control_plane.yml"
      - ".github/workflows/autonomous_control_plane_regression.yml"
  push:
    branches: [main]
    paths:
      - "src/autonomous_control_plane.py"
      - "scripts/test_autonomous_control_plane.py"
      - "scripts/test_autonomous_control_plane_workflow.py"
      - ".github/workflows/autonomous_control_plane.yml"
      - ".github/workflows/autonomous_control_plane_regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomous-control-plane-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile autonomous control plane
        run: python -m compileall -q src/autonomous_control_plane.py

      - name: Run autonomous control-plane behavior regression
        run: python scripts/test_autonomous_control_plane.py

      - name: Run autonomous control-plane workflow regression
        run: python scripts/test_autonomous_control_plane_workflow.py
