name: UFC Greco PIT Probe

on:
  push:
    branches:
      - research/ufc-greco-pit-backfill-20260925
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ufc-greco-pit-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Probe upstream Git dataset
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          git clone --filter=blob:none --no-checkout https://github.com/Greco1899/scrape_ufc_stats.git "$tmp/repo"
          cd "$tmp/repo"
          echo '--- HEAD ---'
          git rev-parse HEAD
          echo '--- FILES ---'
          python - <<'PY'
          import subprocess
          files=subprocess.check_output(["git","ls-tree","-r","--name-only","HEAD"],text=True).splitlines()
          matches=[x for x in files if x.startswith("ufc_") and x.endswith(".csv")]
          print("\n".join(matches[:80]))
          PY
          echo '--- STATS HEADER/SAMPLE ---'
          python - <<'PY'
          import subprocess
          text=subprocess.check_output(["git","show","HEAD:ufc_fight_stats.csv"],text=True)
          print("\n".join(text.splitlines()[:6]))
          PY
          echo '--- STATS SIZE ---'
          git cat-file -s HEAD:ufc_fight_stats.csv
          echo '--- HISTORY ---'
          git log -n 40 --format='%H %cI %s' --follow -- ufc_fight_stats.csv
      - name: Quantify historical first-seen provenance
        run: |
          set -euo pipefail
          python scripts/ufc_greco_pit_provenance.py

      - name: Upload provenance index
        uses: actions/upload-artifact@v4
        with:
          name: ufc-greco-pit-provenance-${{ github.run_id }}
          path: results/ufc_greco_pit_provenance.json
          retention-days: 7

      - name: Clone parser source for reference
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('results/ufc_greco_probe.txt')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text('probe completed; upstream header/history are in job log\n',encoding='utf-8')
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: ufc-greco-pit-probe-${{ github.run_id }}
          path: results/ufc_greco_probe.txt
          retention-days: 7
