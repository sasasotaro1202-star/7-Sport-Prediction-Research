name: F1 Current Roster PIT Candidate Smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/future_predictor.py"
      - "scripts/test_f1_current_roster_pit.py"
      - ".github/workflows/f1_current_roster_pit_smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --retries 5 --timeout 60 beautifulsoup4 lxml numpy joblib scikit-learn pytest
      - name: Compile candidate
        run: python -m py_compile src/future_predictor.py scripts/test_f1_current_roster_pit.py
      - name: Run candidate smoke
        run: python scripts/test_f1_current_roster_pit.py
