name: Future Prior Candidate Smoke

on:
  push:
    branches:
      - research/future-prior-retrieval-pit-20260925
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  future-prior-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile touched source
        run: python -m compileall -q src/future_predictor.py scripts/test_future_predictor_pit_cutoff.py
      - name: Execute SQLite PIT and dedup fixture
        run: PYTHONPATH=. python scripts/test_future_predictor_pit_cutoff.py
