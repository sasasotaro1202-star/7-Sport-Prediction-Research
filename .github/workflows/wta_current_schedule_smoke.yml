name: WTA Current Schedule PIT-Isolated Smoke

on:
  push:
    branches:
      - research/tennis-wta-current-main-20260926
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wta-current-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Deterministic helper tests
        run: PYTHONPATH=. python scripts/test_wta_public_schedule.py
      - name: Live public WTA schedule smoke
        run: PYTHONPATH=. python scripts/test_wta_public_schedule_live.py
      - name: Compile touched source
        run: python -m compileall -q src/seven_sport_production.py scripts/test_wta_public_schedule.py scripts/test_wta_public_schedule_live.py
