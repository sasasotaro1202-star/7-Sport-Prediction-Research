name: Prediction-Core PyMC Research POC

on:
  push:
    paths:
      - ".github/workflows/prediction_core_pymc_poc.yml"
      - "scripts/research_poc_pymc.py"
      - "scripts/test_pymc_poc_contract.py"
      - "docs/PYMC_RESEARCH_POC.md"
  pull_request:
    paths:
      - ".github/workflows/prediction_core_pymc_poc.yml"
      - "scripts/research_poc_pymc.py"
      - "scripts/test_pymc_poc_contract.py"
      - "docs/PYMC_RESEARCH_POC.md"
  workflow_dispatch:
    inputs:
      seed:
        description: "Deterministic synthetic-data seed"
        required: false
        default: "7"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: prediction-core-pymc-poc
  cancel-in-progress: false

jobs:
  pymc-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install isolated PyMC research dependency
        run: python -m pip install --retries 5 --timeout 60 "pymc==6.3.2"
      - name: Validate POC contract
        run: PYTHONPATH=. python scripts/test_pymc_poc_contract.py
      - name: Execute synthetic hierarchical Bayesian POC
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          seed="${{ inputs.seed || '7' }}"
          python scripts/research_poc_pymc.py --seed "$seed" --output results/research/pymc_poc.json
      - name: Upload research-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: prediction-core-pymc-poc-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: results/research/pymc_poc.json
