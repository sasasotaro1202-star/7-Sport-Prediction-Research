name: Research Missing Feature Checkpoint Smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/research_cycle_strict.py"
      - "scripts/test_fold_missing_pruning.py"
      - "src/production_invariants.py"
      - ".github/workflows/v4_5_15_production.yml"
      - ".github/workflows/research_missing_checkpoint_smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile
        run: python -m py_compile src/research_cycle_strict.py src/production_invariants.py scripts/test_fold_missing_pruning.py
        env:
          PYTHONPATH: .
      - name: Run fold-local pruning smoke
        run: python scripts/test_fold_missing_pruning.py
        env:
          PYTHONPATH: .
      - name: Validate production checkpoint invariant
        run: python -m src.production_invariants
        env:
          PYTHONPATH: .
