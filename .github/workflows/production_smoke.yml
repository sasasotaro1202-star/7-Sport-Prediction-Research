name: Seven Sport Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/**'

concurrency:
  group: seven-sport-smoke
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  smoke:
    name: Smoke ${{ matrix.sport }}
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        sport: [valorant, basketball, volleyball, tennis, ufc, rizin, f1]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all source
        run: python -m compileall -q src
      - name: Initialize canonical schema
        run: python -c "from src.storage.db_v45 import connect; c=connect(); c.close(); print('schema-ok')"
      - name: Probe live source connectivity
        env:
          V45_PROBE_TIMEOUT: '12'
        run: python -m src.source_probe --sport ${{ matrix.sport }}
      - name: Run incremental collector
        env:
          V45_HTTP_TIMEOUT: '12'
          V45_HTTP_RETRIES: '2'
          V45_REQUEST_DELAY: '0.02'
          V45_HTTP_WORKERS: '8'
          V45_VLR_PAGES: '3'
        run: python -m src.seven_sport_production --sport ${{ matrix.sport }} --days-back 2
      - name: Run collection guard
        run: python -m src.collection_guard --sport ${{ matrix.sport }}
      - name: Verify collector report semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/v45/production_run.json')
          if not p.exists(): raise SystemExit('missing production_run.json')
          r=json.loads(p.read_text())
          if r.get('status') == 'FAILED':
              raise SystemExit('collector reported FAILED: '+json.dumps(r.get('errors', []), ensure_ascii=False))
          if r.get('status') not in ('OK','NO_DATA'):
              raise SystemExit('unknown collector status: '+repr(r.get('status')))
          print('collector status:', r['status'], 'evidence_rows:', r.get('evidence_rows'))
          PY
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.sport }}-${{ github.run_id }}
          path: |
            data/db/sports_v45.sqlite
            results/**
          if-no-files-found: warn
