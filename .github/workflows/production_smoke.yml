name: Seven Sport Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/**'

concurrency:
  group: seven-sport-smoke-v5
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  smoke:
    name: Smoke ${{ matrix.sport }}
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        sport: [valorant, basketball, volleyball, tennis, ufc, rizin, f1]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all source
        run: python -m compileall -q src
      - name: Initialize canonical schema
        run: python -c "from src.storage.db_v45 import connect; c=connect(); c.close(); print('schema-ok')"
      - name: Probe live source connectivity
        continue-on-error: true
        env:
          V45_PROBE_TIMEOUT: '12'
        run: python -m src.source_probe --sport ${{ matrix.sport }}
      - name: Run basketball CDN collector
        if: matrix.sport == 'basketball'
        run: python -m src.basketball_cdn_backfill --both
      - name: Run tennis historical collector
        if: matrix.sport == 'tennis'
        run: python -m src.tennis_bulk_backfill --start-year 2026 --end-year 2026 --timeout 45
      - name: Run UFC resilient historical collector
        if: matrix.sport == 'ufc'
        run: python -m src.ufc_api_backfill --limit 100
      - name: Run standard incremental collector
        if: matrix.sport != 'basketball' && matrix.sport != 'tennis' && matrix.sport != 'ufc'
        env:
          V45_HTTP_TIMEOUT: '12'
          V45_HTTP_RETRIES: '2'
          V45_REQUEST_DELAY: '0.02'
          V45_HTTP_WORKERS: '8'
          V45_VLR_PAGES: '3'
        run: python -m src.seven_sport_production --sport ${{ matrix.sport }} --days-back 2
      - name: Repair VALORANT event times for PIT eligibility
        if: matrix.sport == 'valorant'
        run: python -m src.repair_vlr_pit_times --timeout 12
      - name: Run collection guard
        run: python -m src.collection_guard --sport ${{ matrix.sport }}
      - name: Verify collector evidence
        run: |
          python - <<'PY'
          import sqlite3, json
          from pathlib import Path
          sport='${{ matrix.sport }}'
          p=Path('data/db/sports_v45.sqlite')
          c=sqlite3.connect(p)
          event_count=c.execute("select count(*) from event where sport=?",(sport,)).fetchone()[0]
          source_count=c.execute("select count(*) from source_snapshot where provenance_json like ?",(f'%\"sport\": \"{sport}\"%',)).fetchone()[0]
          participant_count=c.execute("select count(*) from participant where sport=?",(sport,)).fetchone()[0]
          timed_count=c.execute("select count(*) from event where sport=? and event_time_utc is not null",(sport,)).fetchone()[0]
          c.close()
          print(json.dumps({'sport':sport,'events':event_count,'timed_events':timed_count,'participants':participant_count,'source_snapshots':source_count}))
          if sport in ('tennis','ufc') and event_count == 0:
              raise SystemExit(f'{sport} required collector produced no events')
          PY
      - name: Verify collector report semantics
        if: matrix.sport != 'basketball' && matrix.sport != 'tennis' && matrix.sport != 'ufc'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/v45/production_run.json')
          if not p.exists(): raise SystemExit('missing production_run.json')
          r=json.loads(p.read_text())
          if r.get('status') == 'FAILED': raise SystemExit('collector FAILED: '+json.dumps(r.get('errors', []), ensure_ascii=False))
          if r.get('status') not in ('OK','NO_DATA'): raise SystemExit('unknown collector status: '+repr(r.get('status')))
          print('collector status:',r['status'],'evidence_rows:',r.get('evidence_rows'))
          PY
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.sport }}-${{ github.run_id }}
          path: |
            data/db/sports_v45.sqlite
            results/**
          if-no-files-found: warn
