name: UFC Fixed Archive PIT Backfill Research

on:
  push:
    branches:
      - research/ufc-fixed-archive-backfill-20260925
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ufc-fixed-archive-backfill-research
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt

      - name: Prepare directories
        run: mkdir -p data/db results

      - name: Restore latest safe UFC database
        uses: actions/cache/restore@v4
        with:
          path: data/db
          key: ufc-fixed-archive-${{ github.run_id }}
          restore-keys: |
            nine-sport-target-db-v4-ufc-pit-
            nine-sport-target-db-v4-ufc-
            pit-history-seed-ufc-

      - name: Validate database
        run: python -m src.cache_health --db data/db/sports_v45.sqlite --sport ufc

      - name: Compile source
        run: python -m compileall -q src

      - name: Regression
        run: PYTHONPATH=. python scripts/test_ufc_fixed_archive_backfill.py

      - name: Count strict PIT rows before
        run: |
          PYTHONPATH=. python - <<'PY'
          import sqlite3
          con = sqlite3.connect("data/db/sports_v45.sqlite")
          n = con.execute("""
              SELECT COUNT(*) FROM pit_replay
               WHERE replay_status='REPLAYABLE'
                 AND leakage_status='CLEAN'
                 AND event_id IN (SELECT event_id FROM event WHERE sport='ufc')
          """).fetchone()[0]
          print({"strict_replayable_rows_before": int(n)})
          con.close()
          PY

      - name: Materialize fixed historical archive
        run: PYTHONPATH=. python -m src.ufc_fixed_archive_backfill --db data/db/sports_v45.sqlite --output results/ufc_fixed_archive_backfill.json

      - name: Rebuild strict UFC PIT replay
        run: PYTHONPATH=. python -m src.pit_replay_builder --sport ufc --force

      - name: Count strict PIT rows after
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import sqlite3
          con = sqlite3.connect("data/db/sports_v45.sqlite")
          n = con.execute("""
              SELECT COUNT(*) FROM pit_replay
               WHERE replay_status='REPLAYABLE'
                 AND leakage_status='CLEAN'
                 AND event_id IN (SELECT event_id FROM event WHERE sport='ufc')
          """).fetchone()[0]
          with open("results/ufc_fixed_archive_backfill.json", encoding="utf-8") as fh:
              report = json.load(fh)
          report["strict_replayable_rows_after"] = int(n)
          report["strict_replayable_row_gain"] = int(n) - int(report["strict_replayable_rows_before"])
          with open("results/ufc_fixed_archive_backfill.json", "w", encoding="utf-8") as fh:
              json.dump(report, fh, ensure_ascii=False, indent=2)
          print({
              "strict_replayable_rows_after": int(n),
              "strict_replayable_row_gain": int(n) - int(report["strict_replayable_rows_before"]),
          })
          con.close()
          PY

      - name: Research UFC with frozen holdout on fixed-archive PIT DB
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 4500s python -m src.research_cycle_strict --sport ufc

      - name: Independent PIT leakage audit on research DB
        run: |
          set -euo pipefail
          python -m src.independent_leakage_audit

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: ufc-fixed-archive-backfill-${{ github.run_id }}
          path: results/ufc_fixed_archive_backfill.json
          retention-days: 14
          if-no-files-found: error
