name: Historical Source Version PIT Research

"on":
  pull_request:
    paths:
      - "src/historical_source_version_pit.py"
      - "scripts/test_historical_source_version_pit.py"
      - ".github/workflows/historical_source_version_pit_research.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 60 pytest
      - name: Compile and test
        run: |
          python -m py_compile src/historical_source_version_pit.py scripts/test_historical_source_version_pit.py
          python -m pytest -q scripts/test_historical_source_version_pit.py
      - name: PIT semantics smoke
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from src.historical_source_version_pit import latest_commit_at_or_before
          commits=[{"sha":"old","commit":{"author":{"date":"2021-01-01T00:00:00Z"}}},{"sha":"future","commit":{"author":{"date":"2021-03-01T00:00:00Z"}}}]
          out=latest_commit_at_or_before(commits, datetime(2021,2,1,tzinfo=timezone.utc))
          assert out["sha"]=="old"
          print({"status":"PASS","selected_sha":out["sha"],"research_only":True})
          PY