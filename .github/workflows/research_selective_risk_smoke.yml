name: Selective Risk Control Smoke

on:
  push:
    branches:
      - "research/selective-risk-control-20260925"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q src scripts
      - name: Existing case-risk regression
        run: python scripts/test_case_risk_oos.py
      - name: Selective-risk-control regression
        run: python scripts/test_selective_risk_control_oos.py
