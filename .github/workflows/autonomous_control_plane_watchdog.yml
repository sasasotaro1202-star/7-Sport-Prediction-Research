name: Autonomous Control Plane Watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/autonomous_control_plane_watchdog.yml"
      - ".github/workflows/autonomous_control_plane.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: autonomous-control-plane-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    name: Detect stale control plane and recover
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Resolve current main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          echo "sha=$remote_sha" >> "$GITHUB_OUTPUT"
          echo "WATCHDOG_CURRENT_MAIN_SHA=$remote_sha"

      - name: Checkout repository for GitHub CLI repository context
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Inspect control-plane state and live runs
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_MAIN_SHA: ${{ steps.main.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          workflow="autonomous_control_plane.yml"
          state_json="$(gh api "repos/$repo/contents/results/research/autonomous_control_plane.json?ref=main" 2>/dev/null || true)"
          state_sha=""
          state_generated=""
          if [ -n "$state_json" ]; then
            state_content="$(printf '%s' "$state_json" | jq -r '.content // ""' | tr -d '\n' | base64 -d 2>/dev/null || true)"
            if [ -n "$state_content" ] && printf '%s' "$state_content" | jq -e . >/dev/null 2>&1; then
              state_sha="$(printf '%s' "$state_content" | jq -r '.head_sha // ""')"
              state_generated="$(printf '%s' "$state_content" | jq -r '.generated_at_utc // ""')"
            fi
          fi

          runs="$(gh run list --repo "$repo" --workflow "$workflow" --branch main --limit 50 --json databaseId,status,conclusion,createdAt,updatedAt,headSha,event)"
          active_any="$(printf '%s' "$runs" | jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending")] | length')"
          active_in_progress="$(printf '%s' "$runs" | jq '[.[] | select(.status=="in_progress")] | length')"
          active_current_in_progress="$(printf '%s' "$runs" | jq --arg sha "$CURRENT_MAIN_SHA" '[.[] | select(.headSha==$sha and .status=="in_progress")] | length')"
          outdated_in_progress_ids="$(printf '%s' "$runs" | jq -r --arg sha "$CURRENT_MAIN_SHA" '.[] | select(.headSha!=$sha and .status=="in_progress") | .databaseId' | paste -sd ',' -)"
          outdated_in_progress_count=0
          if [ -n "$outdated_in_progress_ids" ]; then
            outdated_in_progress_count="$(printf '%s' "$outdated_in_progress_ids" | awk -F',' '{print NF}')"
          fi
          now_ts="$(date -u +%s)"
          stale_queued_ids="$(printf '%s' "$runs" | jq -r --argjson now "$now_ts" ' .[] | select(.status=="queued" or .status=="pending") | ((.updatedAt // .createdAt) | fromdateiso8601) as $ts | select(($now - $ts) >= 900) | .databaseId ' | paste -sd ',' -)"
          stale_queued_count=0
          if [ -n "$stale_queued_ids" ]; then
            stale_queued_count="$(printf '%s' "$stale_queued_ids" | tr ',' '\n' | awk 'NF {n++} END {print n+0}')"
          fi
          latest_created="$(printf '%s' "$runs" | jq -r '[.[] | .createdAt] | sort | last // ""')"
          stale_reason="NONE"
          recover=false
          state_provenance="UNKNOWN"
          if [ -z "$state_sha" ]; then
            recover=true
            stale_reason="CONTROL_STATE_MISSING_OR_INVALID"
          elif [ "$state_sha" = "$CURRENT_MAIN_SHA" ]; then
            state_provenance="EXACT_CURRENT_MAIN"
          else
            # State persistence can move main without changing code/config.
            # Only meaningful changes require control-plane recovery.
            compare_json="$(gh api "repos/$repo/compare/$state_sha...$CURRENT_MAIN_SHA" 2>/dev/null || true)"
            compare_status="$(printf '%s' "$compare_json" | jq -r '.status // ""')"
            non_durable_changes="$(printf '%s' "$compare_json" | jq '[.files[]?.filename | select(
              startswith("results/research/") or
              startswith("results/automation_state/") or
              . == "results/failure_memory.jsonl"
            ) | not] | length' 2>/dev/null || echo 999)"
            if [ "$compare_status" = "ahead" ] && [ "$non_durable_changes" -eq 0 ]; then
              state_provenance="DURABLE_ONLY_AHEAD"
            else
              recover=true
              stale_reason="CONTROL_STATE_SHA_STALE"
              state_provenance="MEANINGFUL_CHANGE_OR_DIVERGED"
            fi
          fi
          if [ "$state_provenance" = "EXACT_CURRENT_MAIN" ] || [ "$state_provenance" = "DURABLE_ONLY_AHEAD" ]; then
            now_ts="$(date -u +%s)"
            generated_ts="$(date -u -d "$state_generated" +%s 2>/dev/null || echo 0)"
            if [ "$generated_ts" -le 0 ]; then
              recover=true
              stale_reason="CONTROL_STATE_TIMESTAMP_INVALID"
            else
              age=$((now_ts-generated_ts))
              if [ "$age" -ge 12600 ]; then
                recover=true
                stale_reason="CONTROL_STATE_OLDER_THAN_3H30M"
              fi
            fi
          fi

          run_recovery_needed=false
          if [ "$outdated_in_progress_count" -gt 0 ]; then
            recover=true
            run_recovery_needed=true
            stale_reason="OUTDATED_IN_PROGRESS_CONTROL_RUN|CONTROL_RUN_MAIN_SHA_MISMATCH"
          fi

          if [ "$stale_queued_count" -gt 0 ]; then
            recover=true
            run_recovery_needed=true
            stale_reason="STALE_QUEUED_CONTROL_RUN|CONTROL_RUN_QUEUE_TIMEOUT"
          fi

          # Outdated runs are safe recovery targets. Current-main runs are
          # protected from cancellation and may continue normally.
          if [ "$active_current_in_progress" -gt 0 ] && [ "$run_recovery_needed" = false ]; then
            recover=false
            stale_reason="$stale_reason|ACTIVE_CURRENT_MAIN_CONTROL_RUN"
          fi

          if [ -n "$latest_created" ]; then
            latest_ts="$(date -u -d "$latest_created" +%s 2>/dev/null || echo 0)"
            now_ts="$(date -u +%s)"
            if [ "$latest_ts" -gt 0 ]; then
              latest_age=$((now_ts-latest_ts))
              if [ "$latest_age" -lt 1500 ]; then
                recover=false
                stale_reason="$stale_reason|RECENT_CONTROL_RUN"
              fi
            fi
          fi

          echo "recover=$recover" >> "$GITHUB_OUTPUT"
          echo "reason=$stale_reason" >> "$GITHUB_OUTPUT"
          echo "stale_queued_ids=$stale_queued_ids" >> "$GITHUB_OUTPUT"
          echo "queued_stale=$stale_queued_count" >> "$GITHUB_OUTPUT"
          echo "outdated_in_progress_ids=$outdated_in_progress_ids" >> "$GITHUB_OUTPUT"
          echo "outdated_in_progress=$outdated_in_progress_count" >> "$GITHUB_OUTPUT"
          echo "CONTROL_RUN_QUEUE_TIMEOUT count=$stale_queued_count ids=${stale_queued_ids:-NONE}"
          echo "CONTROL_RUN_OUTDATED_IN_PROGRESS count=$outdated_in_progress_count"
          echo "WATCHDOG_RECOVER=$recover reason=$stale_reason provenance=$state_provenance active_any=$active_any state_sha=${state_sha:-MISSING} current_main=$CURRENT_MAIN_SHA"

      - name: Dispatch current-main control plane
        if: steps.inspect.outputs.recover == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          current_sha="${{ steps.main.outputs.sha }}"
          remote_sha="$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')"
          test "$remote_sha" = "$current_sha" || {
            echo "STALE_MAIN_BEFORE_WATCHDOG_DISPATCH expected=$current_sha actual=$remote_sha" >&2
            exit 1
          }
          stale_queued_ids="${{ steps.inspect.outputs.stale_queued_ids }}"
          if [ -n "$stale_queued_ids" ]; then
            IFS=',' read -r -a stale_ids <<< "$stale_queued_ids"
            for stale_id in "${stale_ids[@]}"; do
              [ -n "$stale_id" ] || continue
              echo "CANCEL_STALE_QUEUED_CONTROL_RUN run_id=$stale_id"
              gh run cancel "$stale_id" --repo "$repo" || true
            done
          fi

          outdated_in_progress_ids="${{ steps.inspect.outputs.outdated_in_progress_ids }}"
          if [ -n "$outdated_in_progress_ids" ]; then
            for outdated_id in $(printf '%s' "$outdated_in_progress_ids" | tr ',' ' '); do
              [ -n "$outdated_id" ] || continue
              echo "CANCEL_OUTDATED_IN_PROGRESS_CONTROL_RUN run_id=$outdated_id"
              gh run cancel "$outdated_id" --repo "$repo" || true
            done
          fi

          refreshed="$(gh run list --repo "$repo" --workflow autonomous_control_plane.yml --branch main --limit 50 --json databaseId,status,headSha)"
          active_current_after="$(printf '%s' "$refreshed" | jq --arg sha "$current_sha" '[.[] | select(.headSha==$sha and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending"))] | length')"
          active_in_progress_after="$(printf '%s' "$refreshed" | jq '[.[] | select(.status=="in_progress")] | length')"
          if [ "$active_current_after" -gt 0 ]; then
            echo "CURRENT_MAIN_CONTROL_RUN_AFTER_RECOVERY count=$active_current_after sha=$current_sha"
            exit 0
          fi
          test "$active_in_progress_after" -eq 0 || {
            echo "ACTIVE_CONTROL_RUN_AFTER_OUTDATED_RECOVERY count=$active_in_progress_after" >&2
            exit 1
          }
          current_sha="${{ steps.main.outputs.sha }}"
          remote_sha="$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')"
          test "$remote_sha" = "$current_sha" || {
            echo "STALE_MAIN_BEFORE_WATCHDOG_DISPATCH expected=$current_sha actual=$remote_sha" >&2
            exit 1
          }
          echo "WATCHDOG_DISPATCH control_plane.yml ref=main reason=${{ steps.inspect.outputs.reason }} sha=$current_sha"
          gh workflow run autonomous_control_plane.yml --ref main --repo "$repo"

      - name: Watchdog status
        if: always()
        run: |
          set -euo pipefail
          echo "AUTONOMOUS_CONTROL_PLANE_WATCHDOG=COMPLETED_WITH_FAIL_CLOSED_RECOVERY"
