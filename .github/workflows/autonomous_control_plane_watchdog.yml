name: Autonomous Control Plane Watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/autonomous_control_plane_watchdog.yml"
      - ".github/workflows/autonomous_control_plane.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: autonomous-control-plane-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    name: Detect stale control plane and recover
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Resolve current main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          echo "sha=$remote_sha" >> "$GITHUB_OUTPUT"
          echo "WATCHDOG_CURRENT_MAIN_SHA=$remote_sha"

      - name: Checkout repository for GitHub CLI repository context
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Recover stale Production Watchdog heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          from datetime import datetime, timezone

          repo = os.environ['GITHUB_REPOSITORY']
          current_sha = '${{ steps.main.outputs.sha }}'

          def gh(*args: str) -> str:
              proc = subprocess.run(
                  ['gh', *args],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if proc.returncode != 0:
                  detail = proc.stderr.strip() or proc.stdout.strip() or f'exit={proc.returncode}'
                  raise RuntimeError(f'GH_COMMAND_FAILED:{detail}')
              return proc.stdout

          def parse_utc(value: str) -> datetime:
              return datetime.fromisoformat(value.replace('Z', '+00:00')).astimezone(timezone.utc)

          runs = json.loads(
              gh(
                  'run', 'list', '--repo', repo, '--workflow', 'production_watchdog.yml',
                  '--branch', 'main', '--limit', '30',
                  '--json', 'databaseId,status,conclusion,createdAt,updatedAt,headSha,event',
              )
          )
          active_statuses = {'queued', 'in_progress', 'waiting', 'requested', 'pending'}
          active_any = sum(1 for row in runs if row.get('status') in active_statuses)
          if active_any > 0:
              print(f'PRODUCTION_WATCHDOG_HEARTBEAT_OK active_runs={active_any}')
              sys.exit(0)

          current_runs = [row for row in runs if str(row.get('headSha') or '') == current_sha]
          current_runs.sort(key=lambda row: str(row.get('createdAt') or ''), reverse=True)
          latest_created = str(current_runs[0].get('createdAt') or '') if current_runs else ''
          now = datetime.now(timezone.utc)
          dispatch = False
          reason = 'NO_CURRENT_MAIN_WATCHDOG_RUN'

          if latest_created:
              try:
                  age_seconds = max(0, int((now - parse_utc(latest_created)).total_seconds()))
              except (TypeError, ValueError, OverflowError) as exc:
                  print(f'PRODUCTION_WATCHDOG_TIMESTAMP_UNVERIFIABLE error={type(exc).__name__}', file=sys.stderr)
                  dispatch = True
                  reason = 'LATEST_CURRENT_MAIN_WATCHDOG_TIMESTAMP_UNVERIFIABLE'
              else:
                  if age_seconds < 900:
                      print(f'PRODUCTION_WATCHDOG_HEARTBEAT_OK age={age_seconds}s current_main={current_sha}')
                      sys.exit(0)
                  dispatch = True
                  reason = f'LATEST_CURRENT_MAIN_WATCHDOG_AGE={age_seconds}s'
          else:
              dispatch = True

          remote_sha = gh('api', f'repos/{repo}/git/ref/heads/main', '--jq', '.object.sha').strip()
          if remote_sha != current_sha:
              print(
                  f'STALE_MAIN_BEFORE_PRODUCTION_WATCHDOG_RECOVERY expected={current_sha} actual={remote_sha}',
                  file=sys.stderr,
              )
              sys.exit(1)

          if not dispatch:
              print('PRODUCTION_WATCHDOG_HEARTBEAT_UNCHANGED')
              sys.exit(0)

          started_at = int(time.time())
          print(f'RECOVER_PRODUCTION_WATCHDOG reason={reason} main={current_sha}')
          gh('workflow', 'run', 'production_watchdog.yml', '--ref', 'main', '--repo', repo)

          for _ in range(5):
              time.sleep(2)
              refreshed = json.loads(
                  gh(
                      'run', 'list', '--repo', repo, '--workflow', 'production_watchdog.yml',
                      '--branch', 'main', '--limit', '30',
                      '--json', 'databaseId,status,createdAt,headSha',
                  )
              )
              verified = any(
                  str(row.get('headSha') or '') == current_sha
                  and int(parse_utc(str(row.get('createdAt'))).timestamp()) >= started_at
                  for row in refreshed
                  if row.get('createdAt')
              )
              if verified:
                  print(f'PRODUCTION_WATCHDOG_RECOVERY_VERIFIED main={current_sha}')
                  sys.exit(0)

          print(
              f'PRODUCTION_WATCHDOG_RECOVERY_UNVERIFIED main={current_sha} reason={reason}',
              file=sys.stderr,
          )
          sys.exit(1)
          PY
      - name: Inspect control-plane state and live runs
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_MAIN_SHA: ${{ steps.main.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          workflow="autonomous_control_plane.yml"
          state_json="$(gh api "repos/$repo/contents/results/research/autonomous_control_plane.json?ref=main" 2>/dev/null || true)"
          state_sha=""
          state_generated=""
          if [ -n "$state_json" ]; then
            state_content="$(printf '%s' "$state_json" | jq -r '.content // ""' | tr -d '\n' | base64 -d 2>/dev/null || true)"
            if [ -n "$state_content" ] && printf '%s' "$state_content" | jq -e . >/dev/null 2>&1; then
              state_sha="$(printf '%s' "$state_content" | jq -r '.head_sha // ""')"
              state_generated="$(printf '%s' "$state_content" | jq -r '.generated_at_utc // ""')"
            fi
          fi

          runs="$(gh run list --repo "$repo" --workflow "$workflow" --branch main --limit 50 --json databaseId,status,conclusion,createdAt,updatedAt,headSha,event)"
          active_any="$(printf '%s' "$runs" | jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending")] | length')"
          active_in_progress="$(printf '%s' "$runs" | jq '[.[] | select(.status=="in_progress")] | length')"
          active_current_in_progress="$(printf '%s' "$runs" | jq --arg sha "$CURRENT_MAIN_SHA" '[.[] | select(.headSha==$sha and .status=="in_progress")] | length')"
          outdated_in_progress_ids="$(printf '%s' "$runs" | jq -r --arg sha "$CURRENT_MAIN_SHA" '.[] | select(.headSha!=$sha and .status=="in_progress") | .databaseId' | paste -sd ',' -)"
          outdated_in_progress_count=0
          if [ -n "$outdated_in_progress_ids" ]; then
            outdated_in_progress_count="$(printf '%s' "$outdated_in_progress_ids" | awk -F',' '{print NF}')"
          fi
          now_ts="$(date -u +%s)"
          stale_queued_ids="$(printf '%s' "$runs" | jq -r --argjson now "$now_ts" ' .[] | select(.status=="queued" or .status=="pending") | ((.updatedAt // .createdAt) | fromdateiso8601) as $ts | select(($now - $ts) >= 900) | .databaseId ' | paste -sd ',' -)"
          stale_queued_count=0
          if [ -n "$stale_queued_ids" ]; then
            stale_queued_count="$(printf '%s' "$stale_queued_ids" | tr ',' '\n' | awk 'NF {n++} END {print n+0}')"
          fi
          latest_created="$(printf '%s' "$runs" | jq -r '[.[] | .createdAt] | sort | last // ""')"
          stale_reason="NONE"
          recover=false
          state_provenance="UNKNOWN"
          if [ -z "$state_sha" ]; then
            recover=true
            stale_reason="CONTROL_STATE_MISSING_OR_INVALID"
          elif [ "$state_sha" = "$CURRENT_MAIN_SHA" ]; then
            state_provenance="EXACT_CURRENT_MAIN"
          else
            # State persistence can move main without changing code/config.
            # Only meaningful changes require control-plane recovery.
            compare_json="$(gh api "repos/$repo/compare/$state_sha...$CURRENT_MAIN_SHA" 2>/dev/null || true)"
            compare_status="$(printf '%s' "$compare_json" | jq -r '.status // ""')"
            non_durable_changes="$(printf '%s' "$compare_json" | jq '[.files[]?.filename | select(
              startswith("results/research/") or
              startswith("results/automation_state/") or
              . == "results/failure_memory.jsonl"
            ) | not] | length' 2>/dev/null || echo 999)"
            if [ "$compare_status" = "ahead" ] && [ "$non_durable_changes" -eq 0 ]; then
              state_provenance="DURABLE_ONLY_AHEAD"
            else
              recover=true
              stale_reason="CONTROL_STATE_SHA_STALE"
              state_provenance="MEANINGFUL_CHANGE_OR_DIVERGED"
            fi
          fi
          if [ "$state_provenance" = "EXACT_CURRENT_MAIN" ] || [ "$state_provenance" = "DURABLE_ONLY_AHEAD" ]; then
            now_ts="$(date -u +%s)"
            generated_ts="$(date -u -d "$state_generated" +%s 2>/dev/null || echo 0)"
            if [ "$generated_ts" -le 0 ]; then
              recover=true
              stale_reason="CONTROL_STATE_TIMESTAMP_INVALID"
            else
              age=$((now_ts-generated_ts))
              if [ "$age" -ge 12600 ]; then