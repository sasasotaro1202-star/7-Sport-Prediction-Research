name: Rugby Production Coverage
on:
  workflow_dispatch:
  schedule:
    - cron: '29 * * * *'
  push:
    paths:
      - 'src/rugby_production.py'
      - '.github/workflows/rugby_production.yml'
permissions:
  contents: write
concurrency:
  group: rugby-production-coverage
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: '1'
jobs:
  rugby:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies with retry
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Restore rugby database cache
        uses: actions/cache/restore@v4
        with:
          path: data/db/rugby_v45.sqlite
          key: rugby-v45-db-${{ github.run_id }}
          restore-keys: rugby-v45-db-
      - name: Collect rugby coverage
        run: python -m src.rugby_production --max-pages 150
      - name: Validate rugby output
        run: |
          set -euo pipefail
          test -s data/db/rugby_v45.sqlite
          test -s results/v45/rugby_coverage.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/v45/rugby_coverage.json')
          r=json.loads(p.read_text())
          if r.get('sport') != 'rugby': raise SystemExit('wrong sport')
          status=r.get('status')
          if status not in ('PASS','DEFERRED'): raise SystemExit(f"invalid rugby coverage status: {status}")
          counts=r.get('counts',{})
          if status == 'PASS':
              if counts.get('events',0) <= 0: raise SystemExit('no rugby events')
              if counts.get('source_snapshots',0) <= 0: raise SystemExit('no rugby source snapshots')
          else:
              reason=r.get('deferred_reason')
              if not reason: raise SystemExit('DEFERRED without explicit reason')
              if counts.get('events',0) != 0 or counts.get('source_snapshots',0) != 0:
                  raise SystemExit('DEFERRED state has partial persisted data without explicit adoption state')
              print('RUGBY_DEFERRED:', reason)
          print(json.dumps(r, ensure_ascii=False, indent=2))
          PY
      - name: Save rugby database cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/db/rugby_v45.sqlite
          key: rugby-v45-db-${{ github.run_id }}
      - name: Persist rugby coverage report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/v45/rugby_coverage.json
          git diff --cached --quiet && exit 0 || true
          git commit -m 'chore: update rugby coverage report'
          git fetch origin main
          git rebase --autostash origin/main
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin main
            git rebase --autostash origin/main
            sleep $((attempt * 5))
          done
      - name: Upload rugby database artifact
        uses: actions/upload-artifact@v4
        with:
          name: rugby-v45-database
          path: data/db/rugby_v45.sqlite
          retention-days: 14
