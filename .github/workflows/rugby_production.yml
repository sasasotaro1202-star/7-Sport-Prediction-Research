name: Rugby Production Coverage
on:
  workflow_dispatch:
  schedule:
    - cron: '29 * * * *'
  push:
    paths:
      - 'src/rugby_production.py'
      - '.github/workflows/rugby_production.yml'
permissions:
  contents: write
concurrency:
  group: rugby-production-coverage
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: '1'
jobs:
  rugby:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies with retry
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Collect rugby coverage
        run: python -m src.rugby_production --max-pages 150
      - name: Validate rugby output
        run: |
          set -euo pipefail
          test -s data/db/rugby_v45.sqlite
          test -s results/v45/rugby_coverage.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/v45/rugby_coverage.json')
          r=json.loads(p.read_text())
          if r.get('sport') != 'rugby': raise SystemExit('wrong sport')
          if r.get('status') != 'PASS': raise SystemExit(f"rugby coverage not ready: {r.get('status')}")
          if r.get('counts',{}).get('events',0) <= 0: raise SystemExit('no rugby events')
          if r.get('counts',{}).get('source_snapshots',0) <= 0: raise SystemExit('no rugby source snapshots')
          print(json.dumps(r, ensure_ascii=False, indent=2))
          PY
      - name: Persist rugby coverage report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/v45/rugby_coverage.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: update rugby coverage report'
          git fetch origin main
          git rebase --autostash origin/main
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin main
            git rebase --autostash origin/main
            sleep $((attempt * 5))
          done
      - name: Upload rugby database artifact
        uses: actions/upload-artifact@v4
        with:
          name: rugby-v45-database
          path: data/db/rugby_v45.sqlite
          retention-days: 14
