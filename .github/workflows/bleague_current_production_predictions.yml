name: B.LEAGUE Current Production Predictions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '10 * * * *'

permissions:
  contents: write

concurrency:
  group: bleague-current-production-predictions
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Restore latest basketball database cache
        uses: actions/cache/restore@v4
        with:
          path: data/db
          key: bleague-predictions-db-${{ github.sha }}
          restore-keys: |
            nine-sport-target-db-v4-basketball-
      - name: Initialize database when cache is unavailable
        run: python -c "from src.storage.db_v45 import connect; c=connect(); c.close()"
      - name: Verify accepted basketball artifact
        run: |
          set -euo pipefail
          python - <<'PY'
          import joblib
          p='models/research/basketball_current.joblib'
          o=joblib.load(p)
          assert o.get('quality_status') in ('ACCEPTED_LOCKED_HOLDOUT','ACCEPTED_AFTER_LOCKED_HOLDOUT')
          print('ACCEPTED_BASKETBALL_ARTIFACT=PASS')
          print('MODEL_VERSION='+str(o.get('model_version')))
          print('FEATURE_VERSION='+str(o.get('feature_version')))
          PY
      - name: Ingest official upcoming B.LEAGUE and run production artifact
        run: python -m src.bleague_upcoming_predictions
      - name: Persist current predictions
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/future_predictions.json results/bleague_upcoming_predictions.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: update B.LEAGUE production predictions'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main