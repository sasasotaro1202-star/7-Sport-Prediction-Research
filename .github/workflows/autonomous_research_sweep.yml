name: Autonomous Research Sweep

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autonomous-research-sweep
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile source
        run: python -m compileall -q src
      - name: Research router regression
        run: PYTHONPATH=. python scripts/test_uncertainty_dynamic_router.py
      - name: Matchday intelligence regression
        run: PYTHONPATH=. python scripts/test_matchday_intelligence_oos.py
      - name: Generative world-model kernel regression
        run: PYTHONPATH=. python scripts/test_scenario_world_model.py
      - name: Generative world-model research regression
        run: PYTHONPATH=. python scripts/test_generative_world_model_research.py
      - name: Run PIT-safe generative world-model research
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m src.generative_world_model_research \
            --worlds 512 \
            --k 20 \
            --simulation-cases-per-fold 20 \
            --output results/research/generative_world_model_research.json
      - name: Production invariant contract
        run: PYTHONPATH=. python src/production_invariants.py
      - name: Prediction experience regression
        run: PYTHONPATH=. python scripts/test_prediction_experience.py
      - name: Experience learning regression
        run: PYTHONPATH=. python scripts/test_experience_learning.py
      - name: Refresh experience learning memory
        run: PYTHONPATH=. python -m src.experience_learning
      - name: Build prospective experience research candidates
        run: PYTHONPATH=. python -m src.experience_research_bridge
      - name: Experience research bridge regression
        run: PYTHONPATH=. python scripts/test_experience_research_bridge.py
      - name: Publish generative world-model research evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: generative-world-model-research-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: results/research/generative_world_model_research.json

      - name: Persist autonomous experience memory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          stage_dir="$(mktemp -d)"
          cleanup() { rm -rf "$stage_dir"; }
          trap cleanup EXIT

          # Preserve generated research artifacts before reconciling to the newest main.
          for path in             results/research/experience_learning.json             results/research/experience_research_candidates.json; do
            if [ -f "$path" ]; then
              mkdir -p "$stage_dir/$(dirname "$path")"
              cp "$path" "$stage_dir/$path"
            fi
          done

          git fetch origin main --depth=1
          git reset --hard origin/main
          merge_base="$(git rev-parse HEAD)"
          echo "RESEARCH_MEMORY_MERGE_BASE_SHA=$merge_base"

          for path in             results/research/experience_learning.json             results/research/experience_research_candidates.json; do
            if [ -f "$stage_dir/$path" ]; then
              mkdir -p "$(dirname "$path")"
              cp "$stage_dir/$path" "$path"
            fi
          done

          changed="$(git status --porcelain -- results/research/experience_learning.json results/research/experience_research_candidates.json)"
          if [ -z "$changed" ]; then
            echo "EXPERIENCE_MEMORY_PERSIST=NO_CHANGE"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/research/experience_learning.json results/research/experience_research_candidates.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "EXPERIENCE_MEMORY_PERSIST=NO_CHANGE_AFTER_STAGE"
            exit 0
          fi

          git commit -m "ops: persist autonomous experience memory"
          latest_remote_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$latest_remote_sha" != "$merge_base" ]; then
            echo "STALE_MAIN_BEFORE_RESEARCH_MEMORY_PUSH expected=$merge_base actual=$latest_remote_sha"
            exit 1
          fi

          git push origin HEAD:main
          echo "EXPERIENCE_MEMORY_PERSIST=PUSHED commit=$(git rev-parse HEAD)"
