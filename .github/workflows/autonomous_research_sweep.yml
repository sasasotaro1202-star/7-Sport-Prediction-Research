name: Autonomous Research Sweep

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autonomous-research-sweep
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile source
        run: python -m compileall -q src
      - name: Research router regression
        run: PYTHONPATH=. python scripts/test_uncertainty_dynamic_router.py
      - name: Matchday intelligence regression
        run: PYTHONPATH=. python scripts/test_matchday_intelligence_oos.py
      - name: Production invariant contract
        run: PYTHONPATH=. python src/production_invariants.py
      - name: Prediction experience regression
        run: PYTHONPATH=. python scripts/test_prediction_experience.py
      - name: Experience learning regression
        run: PYTHONPATH=. python scripts/test_experience_learning.py
      - name: Refresh experience learning memory
        run: PYTHONPATH=. python -m src.experience_learning
      - name: Build prospective experience research candidates
        run: PYTHONPATH=. python -m src.experience_research_bridge
      - name: Experience research bridge regression
        run: PYTHONPATH=. python scripts/test_experience_research_bridge.py
      - name: Persist autonomous experience memory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          remote_sha="$(git rev-parse origin/main)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "STALE_MAIN_BEFORE_RESEARCH_MEMORY_PUSH expected=$GITHUB_SHA actual=$remote_sha"
            exit 1
          fi

          changed="$(git status --porcelain -- results/research/experience_learning.json results/research/experience_research_candidates.json)"
          if [ -z "$changed" ]; then
            echo "EXPERIENCE_MEMORY_PERSIST=NO_CHANGE"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/research/experience_learning.json results/research/experience_research_candidates.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "EXPERIENCE_MEMORY_PERSIST=NO_CHANGE_AFTER_STAGE"
            exit 0
          fi

          git commit -m "ops: persist autonomous experience memory"
          remote_sha="$(git rev-parse origin/main)"
          latest_remote_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$latest_remote_sha" != "$GITHUB_SHA" ]; then
            echo "STALE_MAIN_BEFORE_RESEARCH_MEMORY_PUSH expected=$GITHUB_SHA actual=$latest_remote_sha"
            exit 1
          fi
          test "$remote_sha" = "$GITHUB_SHA" || {
            echo "LOCAL_REMOTE_MAIN_MISMATCH expected=$GITHUB_SHA actual=$remote_sha"
            exit 1
          }
          git push origin HEAD:main
          echo "EXPERIENCE_MEMORY_PERSIST=PUSHED commit=$(git rev-parse HEAD)"
