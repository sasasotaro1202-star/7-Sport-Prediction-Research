name: 24H Autonomous Research Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: 24h-autonomous-research-watchdog
  cancel-in-progress: true

jobs:
  watch:
    name: "Watch / recover 24H marathon"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect and recover stalled marathon
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: 24h_autonomous_research.yml
        shell: bash
        run: |
          set -euo pipefail

          runs="$(gh api "repos/${REPO}/actions/workflows/${WORKFLOW}/runs?per_page=30")"
          now="$(date -u +%s)"

          active_id="$(printf '%s' "${runs}" | jq -r '[.workflow_runs[] | select(.status == "in_progress")] | sort_by(.run_started_at) | reverse | .[0].id // empty')"
          active_started="$(printf '%s' "${runs}" | jq -r '[.workflow_runs[] | select(.status == "in_progress")] | sort_by(.run_started_at) | reverse | .[0].run_started_at // empty')"

          if [ -n "${active_id}" ] && [ -n "${active_started}" ]; then
            start_epoch="$(date -d "${active_started}" +%s 2>/dev/null || echo 0)"
            age_minutes="$(( (now-start_epoch)/60 ))"
            echo "MARATHON_ACTIVE run=${active_id} age_minutes=${age_minutes}"
            if [ "${age_minutes}" -gt 1450 ]; then
              echo "::warning title=24H marathon stale::cancelling run ${active_id} after ${age_minutes} minutes"
              gh run cancel "${active_id}" --repo "${REPO}"
              gh workflow run "${WORKFLOW}" --repo "${REPO}" --ref main
            fi
            exit 0
          fi

          failed_json="$(printf '%s' "${runs}" | jq '[.workflow_runs[] | select(.status == "completed") | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")] | map(select((.created_at | fromdateiso8601) >= (now - 21600)))')"
          recent_failures="$(printf '%s' "${failed_json}" | jq 'length')"
          if [ "${recent_failures}" -ge 3 ]; then
            echo "WATCHDOG: HOLD after 3 failures within the last 6 hours"
            exit 0
          fi

          latest="$(printf '%s' "${runs}" | jq -c '[.workflow_runs[] | select(.status == "completed")] | sort_by(.created_at) | reverse | .[0] // empty')"
          latest_conclusion="$(printf '%s' "${latest}" | jq -r '.conclusion // empty')"
          latest_created="$(printf '%s' "${latest}" | jq -r '.created_at // empty')"
          if [ -n "${latest_created}" ] && { [ "${latest_conclusion}" = "failure" ] || [ "${latest_conclusion}" = "cancelled" ] || [ "${latest_conclusion}" = "timed_out" ]; }; then
            latest_epoch="$(date -d "${latest_created}" +%s 2>/dev/null || echo 0)"
            failure_age="$(( (now-latest_epoch)/60 ))"
            if [ "${failure_age}" -ge 10 ]; then
              echo "WATCHDOG: recovering failed latest run ${latest_conclusion}; age_minutes=${failure_age}"
              gh workflow run "${WORKFLOW}" --repo "${REPO}" --ref main
              exit 0
            fi
          fi

          queued_id="$(printf '%s' "${runs}" | jq -r '[.workflow_runs[] | select(.status == "queued" or .status == "pending")] | sort_by(.created_at) | .[0].id // empty')"
          queued_created="$(printf '%s' "${runs}" | jq -r '[.workflow_runs[] | select(.status == "queued" or .status == "pending")] | sort_by(.created_at) | .[0].created_at // empty')"

          if [ -n "${queued_id}" ] && [ -n "${queued_created}" ]; then
            created_epoch="$(date -d "${queued_created}" +%s 2>/dev/null || echo 0)"
            age_minutes="$(( (now-created_epoch)/60 ))"
            echo "MARATHON_QUEUED run=${queued_id} age_minutes=${age_minutes}"
            if [ "${age_minutes}" -gt 60 ]; then
              echo "::warning title=24H marathon queue stall::cancelling run ${queued_id} after ${age_minutes} minutes"
              gh run cancel "${queued_id}" --repo "${REPO}"
              gh workflow run "${WORKFLOW}" --repo "${REPO}" --ref main
            fi
            exit 0
          fi

          echo "WATCHDOG: no recovery required"
