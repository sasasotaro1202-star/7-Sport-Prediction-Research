name: 24H Autonomous Research Watchdog

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/24h_autonomous_research.yml"
      - ".github/workflows/24h_autonomous_research_watchdog.yml"
      - "scripts/run_24h_research_stage_main.py"
      - "config/ACTIVE_SCOPE_9_SPORTS.json"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: 24h-autonomous-research-watchdog
  cancel-in-progress: true

jobs:
  watch:
    name: "Watch / recover latest-main 24H marathon"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect and recover stalled marathon
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: 24h_autonomous_research.yml
          SELF_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          gh_retry() {
            local attempt out rc
            for attempt in 1 2 3 4; do
              if out="$(gh "$@" 2>&1)"; then
                printf '%s\n' "$out"
                return 0
              else
                rc=$?
                echo "gh attempt ${attempt}/4 failed rc=${rc}: ${out}" >&2
              fi
              if [ "${attempt}" -lt 4 ]; then sleep $((attempt * 2)); fi
            done
            return "${rc}"
          }

          MAIN_SHA="$(gh_retry api "repos/${REPO}/git/ref/heads/main" --jq '.object.sha')"
          runs="$(gh_retry run list --repo "${REPO}" --workflow "${WORKFLOW}" --limit 50 --json databaseId,status,conclusion,headSha,createdAt,updatedAt)"

          python - "${MAIN_SHA}" "${SELF_RUN_ID}" "${runs}" <<'PY' > /tmp/decision.json
          import json
          import sys
          from datetime import datetime, timezone

          main_sha = sys.argv[1]
          self_id = int(sys.argv[2])
          runs = json.loads(sys.argv[3])
          now = datetime.now(timezone.utc)

          active = {"queued", "pending", "waiting", "requested", "in_progress"}

          def dt(raw):
              return datetime.fromisoformat(raw.replace("Z", "+00:00"))

          candidates = [r for r in runs if int(r.get("databaseId", -1)) != self_id]
          current = [r for r in candidates if r.get("headSha") == main_sha and r.get("status") in active]

          stale_current = []
          for r in current:
              age_min = (now - dt(r.get("updatedAt") or r.get("createdAt"))).total_seconds() / 60
              if r.get("status") == "in_progress" and age_min >= 350:
                  stale_current.append(r)
              elif r.get("status") in {"queued", "pending", "waiting", "requested"} and age_min >= 30:
                  stale_current.append(r)

          outdated_active = []
          for r in candidates:
              if r.get("headSha") != main_sha and r.get("status") in active:
                  age_min = (now - dt(r.get("updatedAt") or r.get("createdAt"))).total_seconds() / 60
                  if age_min >= 0:
                      outdated_active.append(r)

          outdated_queued = []
          for r in candidates:
              if r.get("headSha") != main_sha and r.get("status") in {"queued", "pending"}:
                  age_min = (now - dt(r.get("updatedAt") or r.get("createdAt"))).total_seconds() / 60
                  if age_min >= 0:
                      outdated_queued.append(r)

          completed = [
              r for r in candidates
              if r.get("headSha") == main_sha and r.get("status") == "completed"
          ]
          completed.sort(key=lambda r: dt(r.get("updatedAt") or r.get("createdAt")), reverse=True)

          # The marathon is scheduled once per UTC day at 15:17. The watchdog
          # must recover the case where GitHub never created that scheduled run.
          # Before today's boundary there is nothing to recover; after a small
          # grace window, absence of any current-main attempt in this boundary is
          # a real missed-cycle condition.
          daily_boundary_hour_utc = 15
          daily_boundary_minute_utc = 17
          daily_boundary_grace_minutes = 30
          today_boundary = now.replace(
              hour=daily_boundary_hour_utc,
              minute=daily_boundary_minute_utc,
              second=0,
              microsecond=0,
          )
          daily_boundary_started = now >= today_boundary
          daily_boundary = today_boundary if daily_boundary_started else today_boundary
          daily_boundary_epoch = int(daily_boundary.timestamp())
          daily_boundary_age_minutes = (
              (now - daily_boundary).total_seconds() / 60
              if daily_boundary_started
              else -1
          )
          next_daily_boundary_epoch = daily_boundary_epoch + 24 * 60 * 60
          current_boundary_runs = [
              r for r in candidates
              if r.get("headSha") == main_sha
              and daily_boundary_started
              and daily_boundary_epoch
              <= int(dt(r.get("createdAt") or r.get("updatedAt")).timestamp())
              < next_daily_boundary_epoch
          ]

          recent_failures = [
              r for r in completed
              if (now - dt(r.get("updatedAt") or r.get("createdAt"))).total_seconds() <= 6 * 3600
              and r.get("conclusion") in {"failure", "cancelled", "timed_out"}
          ]

          if len(recent_failures) >= 3:
              decision = {
                  "action": "HOLD",
                  "reason": "three_recent_failures_within_6h",
                  "main_sha": main_sha,
              }
          elif stale_current:
              decision = {
                  "action": "CANCEL_AND_DISPATCH",
                  "run_id": stale_current[0]["databaseId"],
                  "reason": "current_main_run_stale",
                  "main_sha": main_sha,
              }
          elif outdated_active:
              decision = {
                  "action": "CANCEL_OUTDATED_AND_DISPATCH",
                  "run_id": outdated_active[0]["databaseId"],
                  "reason": "outdated_main_run_still_active",
                  "main_sha": main_sha,
              }
          elif outdated_queued:
              decision = {
                  "action": "CANCEL_OUTDATED_AND_DISPATCH",
                  "run_id": outdated_queued[0]["databaseId"],
                  "reason": "outdated_main_queued_run_blocking_latest",
                  "main_sha": main_sha,
              }
          elif current:
              decision = {
                  "action": "WAIT",
                  "reason": "current_main_run_active",
                  "main_sha": main_sha,
              }
          elif (
              daily_boundary_started
              and daily_boundary_age_minutes >= daily_boundary_grace_minutes
              and not current_boundary_runs
          ):
              decision = {
                  "action": "DISPATCH",
                  "reason": "missed_daily_boundary",
                  "main_sha": main_sha,
                  "daily_boundary_epoch": daily_boundary_epoch,
                  "daily_boundary_grace_minutes": daily_boundary_grace_minutes,
                  "current_boundary_runs": len(current_boundary_runs),
              }
          elif not completed:
              # Initial 24H cycles are handled by the marathon's daily schedule/manual trigger.
              # The watchdog only recovers an existing stale or failed cycle.
              decision = {
                  "action": "WAIT",
                  "reason": "await_scheduled_cycle_for_current_main",
                  "main_sha": main_sha,
              }
          else:
              age_min = (now - dt(completed[0].get("updatedAt") or completed[0].get("createdAt"))).total_seconds() / 60
              if completed[0].get("conclusion") in {"failure", "cancelled", "timed_out"} and age_min >= 10:
                  decision = {
                      "action": "DISPATCH",
                      "reason": "latest_current_main_run_failed",
                      "main_sha": main_sha,
                  }
              elif age_min >= 1440:
                  decision = {
                      "action": "DISPATCH",
                      "reason": "current_main_24h_cycle_elapsed",
                      "main_sha": main_sha,
                  }
              else:
                  decision = {
                      "action": "WAIT",
                      "reason": "current_main_cycle_within_window",
                      "main_sha": main_sha,
                  }

          print(json.dumps(decision, sort_keys=True))
          PY

          cat /tmp/decision.json
          action="$(python -c 'import json; print(json.load(open("/tmp/decision.json"))["action"])')"
          run_id="$(python -c 'import json; print(json.load(open("/tmp/decision.json")).get("run_id",""))')"
          reason="$(python -c 'import json; print(json.load(open("/tmp/decision.json"))["reason"])')"
          main_sha="$(python -c 'import json; print(json.load(open("/tmp/decision.json"))["main_sha"])')"

          dispatch_and_verify() {
            local before after attempt
            before="$(date -u +%s)"
            gh_retry workflow run "${WORKFLOW}" --repo "${REPO}" --ref main
            for attempt in 1 2 3 4 5; do
              sleep 3
              after="$(gh_retry run list --repo "${REPO}" --workflow "${WORKFLOW}" --limit 20 --json databaseId,status,headSha,createdAt)"
              printf '%s' "${after}" > /tmp/dispatch_runs.json
              if python - "${main_sha}" "${before}" /tmp/dispatch_runs.json <<'PY'
          import json, sys
          from datetime import datetime, timezone
          main_sha = sys.argv[1]
          before = int(sys.argv[2])
          runs = json.load(open(sys.argv[3], encoding="utf-8"))
          for r in runs:
              if r.get("headSha") != main_sha:
                  continue
              raw = r.get("createdAt")
              if not raw:
                  continue
              created = int(datetime.fromisoformat(raw.replace("Z", "+00:00")).timestamp())
              if created >= before and r.get("status") in {"queued","pending","waiting","requested","in_progress"}:
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
              then
                echo "WATCHDOG: dispatch verified attempt ${attempt}/5"
                return 0
              fi
            done
            echo "WATCHDOG: dispatch verification failed" >&2
            return 1
          }

          case "${action}" in
            WAIT|HOLD)
              echo "WATCHDOG: ${action} (${reason})"
              ;;
            CANCEL_AND_DISPATCH)
              gh_retry run cancel "${run_id}" --repo "${REPO}"
              dispatch_and_verify
              ;;
            CANCEL_OUTDATED_AND_DISPATCH)
              gh_retry run cancel "${run_id}" --repo "${REPO}"
              dispatch_and_verify
              ;;
            DISPATCH)
              dispatch_and_verify
              ;;
            *)
              echo "WATCHDOG: unknown action ${action}" >&2
              exit 1
              ;;
          esac
