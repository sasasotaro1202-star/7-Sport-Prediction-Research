name: F1 Future Event Status Smoke

on:
  push:
    branches:
      - research/f1-future-event-status-20260925
  pull_request:
    branches:
      - main
    paths:
      - "src/seven_sport_production.py"
      - "scripts/test_f1_event_status.py"
      - ".github/workflows/f1_future_event_status_smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep deferred F1 status validation branch-scoped and avoid duplicate runs
  # when a research branch receives rapid successive commits.
  group: f1-future-event-status-smoke-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  f1-status-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile touched source
        run: python -m compileall -q src/seven_sport_production.py scripts/test_f1_event_status.py
      - name: Execute F1 status fixture
        run: PYTHONPATH=. python scripts/test_f1_event_status.py
