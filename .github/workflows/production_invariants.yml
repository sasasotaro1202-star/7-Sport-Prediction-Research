name: Production Invariants

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

concurrency:
  group: production-invariants-validation
  # These workflows are read-only validators. Only the newest commit needs validation.
  cancel-in-progress: true

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Validate canonical production workflow YAML
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; data = YAML.load_file(".github/workflows/v4_5_15_production.yml"); abort "workflow YAML is empty" unless data.is_a?(Hash) && data["jobs"].is_a?(Hash) && !data["jobs"].empty?; puts "PRODUCTION_WORKFLOW_YAML=PASS"'
      - name: Run model system smoke test
        run: PYTHONPATH=. python scripts/model_system_smoke.py
      - name: Run production invariants
        run: python -m src.production_invariants
      - name: Validate canonical production trigger contract
        run: python scripts/test_canonical_production_workflow_contract.py
      - name: Validate dynamic router syntax and import safety
        run: python scripts/validate_dynamic_router.py
      - name: Validate model pipeline regression contracts
        run: python scripts/validate_model_pipeline.py
      - name: Validate temporal feature immutability
        run: PYTHONPATH=. python scripts/test_feature_temporal_invariance.py
