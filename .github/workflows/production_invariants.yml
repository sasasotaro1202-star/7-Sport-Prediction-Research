name: Production Invariants

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-invariants-validation
  # These workflows are read-only validators. Only the newest commit needs validation.
  cancel-in-progress: true

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Run model system smoke test
        run: python scripts/model_system_smoke.py
      - name: Run production invariants
        run: python -m src.production_invariants
      - name: Validate dynamic router syntax and import safety
        run: python scripts/validate_dynamic_router.py
      - name: Validate model pipeline regression contracts
        run: python scripts/validate_model_pipeline.py
