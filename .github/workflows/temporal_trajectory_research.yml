name: Temporal Trajectory Intelligence Research

on:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:
    inputs:
      snapshots:
        description: "PIT-valid trajectory snapshot JSONL"
        required: false
        default: "results/research/trajectory_snapshots.jsonl"
      outcomes:
        description: "Verified event outcomes JSON"
        required: false
        default: "results/research/trajectory_outcomes.json"
      mode:
        description: "Trajectory timing contract"
        required: false
        default: "pre_event"
        type: choice
        options:
          - pre_event
          - in_event

permissions:
  contents: read

concurrency:
  group: temporal-trajectory-research
  cancel-in-progress: false

jobs:
  research:
    name: PIT / trajectory / chronological OOS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install research runtime
        run: python -m pip install --disable-pip-version-check --no-input "numpy>=1.26,<3"

      - name: Run trajectory regression tests
        env:
          PYTHONPATH: .
        run: python tests/test_trajectory_intelligence_oos.py

      - name: Run trajectory research gate
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          snapshots="${{ github.event.inputs.snapshots || 'results/research/trajectory_snapshots.jsonl' }}"
          outcomes="${{ github.event.inputs.outcomes || 'results/research/trajectory_outcomes.json' }}"
          mode="${{ github.event.inputs.mode || 'pre_event' }}"
          python scripts/trajectory_research_runner.py \
            --snapshots "$snapshots" \
            --outcomes "$outcomes" \
            --mode "$mode"

      - name: Preserve research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-trajectory-intelligence-${{ github.run_id }}
          path: results/research/trajectory_intelligence.json
          if-no-files-found: warn
          retention-days: 14
