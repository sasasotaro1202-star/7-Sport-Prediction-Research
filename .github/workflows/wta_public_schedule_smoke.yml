name: WTA Public Schedule Smoke

on:
  push:
    branches:
      - research/tennis-wta-current-schedule-20260925
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wta-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Probe public WTA calendar and match endpoint
        run: PYTHONPATH=. python scripts/test_wta_public_schedule_live.py
      - name: Compile source
        run: python -m compileall -q src scripts/test_wta_public_schedule_live.py
