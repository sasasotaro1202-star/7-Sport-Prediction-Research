name: Production Watchdog Event Relay

on:
  # Event-driven backup for the canonical Production Watchdog. Scheduled jobs
  # remain useful, but GitHub may delay/drop scheduled executions under load.
  # This relay never performs production work itself; it only wakes the existing
  # Production Watchdog after validation/PIT/control-plane completions.
  workflow_run:
    workflows:
      - Production Invariants
      - Lightweight Regression and Safety Checks
      - Production Safety Audit
      - PIT History Expansion
      - Autonomous Research Control Plane
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - ".github/workflows/production_watchdog_event_relay.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: production-watchdog-event-relay
  cancel-in-progress: true

jobs:
  relay:
    name: Wake canonical Production Watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch only when no watchdog is already active
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          current_sha="$(gh api "repos/$repo/git/ref/heads/main" --jq ".object.sha")"
          echo "RELAY_CURRENT_MAIN_SHA=$current_sha"

          runs="$(gh run list --repo "$repo" --workflow "production_watchdog.yml" --branch main --limit 50 --json databaseId,status,headSha,createdAt,event)"
          active_any="$(printf "%s" "$runs" | jq '.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending")' | jq -s 'length')"
          if [ "$active_any" -gt 0 ]; then
            echo "PRODUCTION_WATCHDOG_RELAY_SKIPPED active_watchdogs=$active_any"
            exit 0
          fi

          dispatch_started_at="$(date -u +%s)"
          remote_before="$(gh api "repos/$repo/git/ref/heads/main" --jq ".object.sha")"
          if [ "$remote_before" != "$current_sha" ]; then
            echo "RELAY_MAIN_ADVANCED_REFRESH old=$current_sha new=$remote_before"
            current_sha="$remote_before"
          fi

          # The relay is an event wake-up mechanism, not an evidence source.
          # Always dispatch against the latest remote main observed immediately
          # before the owner workflow is started.
          echo "RELAY_DISPATCH production_watchdog.yml ref=main sha=$current_sha"
          gh workflow run production_watchdog.yml --ref main --repo "$repo"

          sleep 3
          refreshed="$(gh run list --repo "$repo" --workflow "production_watchdog.yml" --branch main --limit 20 --json databaseId,status,headSha,createdAt)"
          verified="$(printf "%s" "$refreshed" | jq --arg sha "$current_sha" --argjson start "$dispatch_started_at" '[.[] | select(.headSha==$sha) | ((.createdAt | fromdateiso8601)) as $ts | select($ts >= $start)] | length')"
          if [ "$verified" -lt 1 ]; then
            echo "AUTO_WATCHDOG_RELAY_UNVERIFIED current_main=$current_sha started_at=$dispatch_started_at" >&2
            exit 1
          fi
          echo "AUTO_WATCHDOG_RELAY_VERIFIED current_main=$current_sha"
      - name: Relay status
        if: always()
        run: echo "PRODUCTION_WATCHDOG_EVENT_RELAY=COMPLETED"