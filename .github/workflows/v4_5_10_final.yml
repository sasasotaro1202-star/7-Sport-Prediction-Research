name: Seven Sport v4.5.11 Production Hourly

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    paths:
      - 'src/**'
      - '.github/workflows/v4_5_11_final.yml'
      - '.github/workflows/v4_5_10_final.yml'
      - '.gitignore'
      - 'requirements.txt'

concurrency:
  group: seven-sport-main-writer
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  collect:
    name: Incremental ${{ matrix.sport }}
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        sport: [valorant, basketball, volleyball, tennis, ufc, rizin, f1]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore source cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/http_cache
          key: seven-sport-http-${{ matrix.sport }}-${{ hashFiles('src/collectors/production_v45.py', 'src/seven_sport_production.py', 'src/robust_sport_adapters_v2.py', 'src/international_context.py') }}
          restore-keys: seven-sport-http-${{ matrix.sport }}-
      - name: Restore persistent sport database
        uses: actions/cache/restore@v4
        with:
          path: data/db/sports_v45.sqlite
          key: seven-sport-db-v3-${{ matrix.sport }}-${{ github.run_id }}
          restore-keys: seven-sport-db-v3-${{ matrix.sport }}-
      - run: python -m pip install -r requirements.txt
      - name: Prepare runtime directories
        run: mkdir -p data/raw/http_cache data/db results models
      - name: Initialize canonical schema
        run: python -c "from src.storage.db_v45 import connect; c=connect(); c.close(); print('schema-ok')"
      - name: Compile-check production code
        run: python -m compileall -q src
      - name: Collect one sport incrementally
        continue-on-error: true
        env:
          V45_HTTP_TIMEOUT: '10'
          V45_HTTP_RETRIES: '3'
          V45_REQUEST_DELAY: '0.02'
          V45_HTTP_WORKERS: '10'
          V45_VLR_PAGES: '20'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m src.seven_sport_production --sport ${{ matrix.sport }} --days-back 3; then exit 0; fi
            echo "collector attempt ${attempt} failed; retrying"
            sleep $((attempt * 3))
          done
          exit 1
      - name: Detect historical backfill need
        id: history_need
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3, os
          db="data/db/sports_v45.sqlite"
          need="true"
          if os.path.exists(db):
              try:
                  c=sqlite3.connect(db)
                  n=c.execute("SELECT COUNT(*) FROM event WHERE sport=?", ("${{ matrix.sport }}",)).fetchone()[0]
                  c.close()
                  thresholds={"basketball":5000,"tennis":5000,"valorant":500,"volleyball":500,"rizin":200}
                  need="true" if n < thresholds.get("${{ matrix.sport }}", 300) else "false"
                  print(f"sport=${{ matrix.sport }} events={n} history_need={need}")
              except Exception as e:
                  print(f"history detection failed: {e}; defaulting to true")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"need={need}\n")
          PY
      - name: Historical basketball backfill
        if: matrix.sport == 'basketball' && steps.history_need.outputs.need == 'true'
        continue-on-error: true
        run: python -m src.espn_backfill --sport basketball --leagues nba,wnba --start-year 2016 --end-year 2026
      - name: Basketball CDN/NBA public schedule fallback
        if: matrix.sport == 'basketball'
        continue-on-error: true
        run: python -m src.basketball_cdn_backfill --both
      - name: Historical tennis backfill
        if: matrix.sport == 'tennis' && steps.history_need.outputs.need == 'true'
        continue-on-error: true
        run: python -m src.espn_backfill --sport tennis --leagues atp,wta --start-year 2016 --end-year 2026
      - name: Free public history fallback
        continue-on-error: true
        run: |
          case "${{ matrix.sport }}" in
            valorant|basketball|volleyball|rizin) python -m src.public_history_backfill --sports ${{ matrix.sport }} ;;
            tennis) python -m src.tennis_public_backfill ;;
          esac
      - name: Validate collected partition
        continue-on-error: true
        run: python -m src.collection_guard --sport ${{ matrix.sport }}
      - name: Enrich F1 with incremental OpenF1 data
        if: matrix.sport == 'f1'
        continue-on-error: true
        run: python -m src.f1_openf1_backfill --start-year 2023 --end-year 2026 --timeout 30
      - name: Save persistent sport database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/db/sports_v45.sqlite
          key: seven-sport-db-v3-${{ matrix.sport }}-${{ github.run_id }}
      - name: Save source cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/http_cache
          key: seven-sport-http-${{ matrix.sport }}-${{ hashFiles('src/collectors/production_v45.py', 'src/seven_sport_production.py', 'src/robust_sport_adapters_v2.py', 'src/international_context.py') }}-${{ github.run_id }}

  merge:
    name: Merge hourly partitions
    needs: [collect]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Prepare partition directories
        run: mkdir -p hourly-artifacts/{valorant,basketball,volleyball,tennis,ufc,rizin,f1}
      - name: Restore VALORANT partition cache
        uses: actions/cache/restore@v4
        with:
          path: hourly-artifacts/valorant/sports_v45.sqlite
          key: seven-sport-db-v3-valorant-${{ github.run_id }}
      - name: Restore Basketball partition cache
        uses: actions/cache/restore@v4
        with:
          path: hourly-artifacts/basketball/sports_v45.sqlite
          key: seven-sport-db-v3-basketball-${{ github.run_id }}
      - name: Restore Volleyball partition cache
        uses: actions/cache/restore@v4
        with:
          path: hourly-artifacts/volleyball/sports_v45.sqlite
          key: seven-sport-db-v3-volleyball-${{ github.run_id }}
      - name: Restore Tennis partition cache
        uses: actions/cache/restore@v4
        with:
          path: hourly-artifacts/tennis/sports_v45.sqlite
          key: seven-sport-db-v3-tennis-${{ github.run_id }}
      - name: Restore UFC partition cache
        uses: actions/cache/restore@v4
        with:
          path: hourly-artifacts/ufc/sports_v45.sqlite
          key: seven-sport-db-v3-ufc-${{ github.run_id }}
      - name: Restore RIZIN partition cache
        uses: actions/cache/restore@v4
        with:
          path: hourly-artifacts/rizin/sports_v45.sqlite
          key: seven-sport-db-v3-rizin-${{ github.run_id }}
      - name: Restore F1 partition cache
        uses: actions/cache/restore@v4
        with:
          path: hourly-artifacts/f1/sports_v45.sqlite
          key: seven-sport-db-v3-f1-${{ github.run_id }}
      - name: Verify all seven partitions
        run: |
          set -euo pipefail
          for sport in valorant basketball volleyball tennis ufc rizin f1; do
            test -s "hourly-artifacts/${sport}/sports_v45.sqlite"
            echo "partition-ok ${sport}"
          done
      - name: Merge incremental databases safely
        run: python -m src.merge_partition_dbs --input-dir hourly-artifacts
      - name: Run robust adapters into merged database
        env:
          V45_HTTP_TIMEOUT: '20'
          V45_HTTP_RETRIES: '3'
          V45_REQUEST_DELAY: '0.08'
          V45_HTTP_WORKERS: '12'
        run: python -m src.robust_sport_adapters_v4
      - name: Repair malformed F1 participant relations
        run: python -m src.f1_integrity_cleanup --vacuum
      - name: Reconstruct verified outcomes once on merged database
        run: python -m src.outcome_backfill
      - name: Build strict PIT replay snapshots
        run: python -m src.pit_replay_builder
      - name: Run final merged strict PIT research cycle
        run: python -m src.research_cycle
      - name: Remove stale model artifacts before publish
        run: find models/research -type f -name '*.joblib' ! -name '*_current.joblib' -delete 2>/dev/null || true
      - name: Global structural quality gate
        run: python -m src.quality_gate
      - name: Prediction eligibility inventory
        continue-on-error: true
        run: python -m src.prediction_policy
      - name: Final repository validation
        run: python -m compileall -q src
      - name: Persist lightweight outputs safely
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          persist_dir="$RUNNER_TEMP/seven-sport-persist"
          rm -rf "$persist_dir" && mkdir -p "$persist_dir"
          cp -a results "$persist_dir/results" 2>/dev/null || true
          cp -a models "$persist_dir/models" 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          git clean -ffdx || true
          rm -rf results models && mkdir -p results models
          cp -a "$persist_dir/results/." results/ 2>/dev/null || true
          cp -a "$persist_dir/models/." models/ 2>/dev/null || true
          unexpected="$(git status --porcelain --untracked-files=all | awk '$2 !~ /^(results\/|models\/)/ {print}')"
          test -z "$unexpected" || { printf '%s\n' "$unexpected"; exit 1; }
          git add results models
          ! git diff --cached --name-only | grep -E '^(data/db/|data/raw/http_cache/)' || { echo 'generated data staged'; exit 1; }
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m "chore: update seven-sport research results"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git merge-base --is-ancestor origin/main HEAD && git push origin HEAD:main; then exit 0; fi
            git reset --hard origin/main
            git clean -ffdx || true
            rm -rf results models && mkdir -p results models
            cp -a "$persist_dir/results/." results/ 2>/dev/null || true
            cp -a "$persist_dir/models/." models/ 2>/dev/null || true
            git add results models
            if git diff --cached --quiet; then exit 0; fi
            git diff --cached --check
            git commit -m "chore: update seven-sport research results"
            sleep $((attempt * 2))
          done
          exit 1
      - name: Upload merged outputs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-5-11-merged-${{ github.run_id }}
          path: |
            results/**
            models/**
          if-no-files-found: warn
          retention-days: 1
