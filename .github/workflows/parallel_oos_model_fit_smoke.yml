name: Parallel OOS Model Fit Smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/research_cycle_strict.py"
      - "scripts/test_parallel_oos_model_fits.py"
      - ".github/workflows/parallel_oos_model_fit_smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile
        run: python -m py_compile src/research_cycle_strict.py scripts/test_parallel_oos_model_fits.py
        env:
          PYTHONPATH: .
      - name: Run parallel fit equivalence smoke
        run: python scripts/test_parallel_oos_model_fits.py
        env:
          PYTHONPATH: .
