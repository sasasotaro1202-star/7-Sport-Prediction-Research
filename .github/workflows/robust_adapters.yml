name: Robust Sport Adapters

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'results/**'
  workflow_dispatch:
    inputs:
      sport:
        description: 'Optional adapter: valorant, ufc, rizin, volleyball'
        required: false
        default: ''
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: seven-sport-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  robust-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install requests beautifulsoup4 lxml
      - name: Run dedicated adapters
        env:
          V45_HTTP_TIMEOUT: '20'
          V45_HTTP_RETRIES: '3'
          V45_REQUEST_DELAY: '0.08'
          V45_HTTP_WORKERS: '12'
        run: |
          set -euo pipefail
          SPORT='${{ inputs.sport }}'
          if [ -n "$SPORT" ]; then
            python -m src.robust_sport_adapters_v2 --sport "$SPORT"
          else
            python -m src.robust_sport_adapters_v2
          fi
      - name: Repair adapter timestamps
        run: python src/repair_adapter_timestamps.py
      - name: Validate adapter artifact
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/robust_adapter.json')
          if not p.exists(): raise SystemExit('robust_adapter.json missing')
          x=json.loads(p.read_text())
          if x.get('errors'): raise SystemExit(f"adapter errors: {x['errors']}")
          print(json.dumps(x, ensure_ascii=False, indent=2))
          PY
      - name: Run non-fatal sport inventory checks
        run: |
          set -euo pipefail
          for s in valorant ufc rizin volleyball; do
            python src/collection_guard.py --sport "$s"
          done
          python src/prediction_policy.py
      - name: Commit research state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data results
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
          else
            git commit -m 'Run robust sport adapters and inventory checks'
            git push
          fi
