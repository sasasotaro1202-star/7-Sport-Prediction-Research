name: Autonomous Research Control Plane

on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Active-Scope Target v4.5.15 Production
      - Pre-Event Adaptive Timing Prediction
      - PIT History Expansion
      - Production Failure Recovery
      - Autonomous Research Sweep
      - Autonomous Control Plane Regression
      - Autonomous Temporal Trajectory Loop
      - Active Source Feasibility Audit
      - Continuous Scope Autofill and Discovery
      - Production Runtime Health Audit
      - Production Safety Audit
      - Nine-Sport Lane Audit
      - 24H Autonomous Research Marathon
    types:
      - completed

permissions:
  contents: write
  actions: write


env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: .

jobs:
  control:
    # Only runnable control-plane jobs participate in this concurrency group.
    # workflow_run success events are filtered by `if` before this job-level gate,
    # so they cannot cancel a live failure-triage job. New failure evidence coalesces
    # older queued/in-progress triage and the control plane re-checks current main.
    concurrency:
      group: autonomous-control-plane-main
      cancel-in-progress: true
    name: Reconcile / Decide / Dispatch / Persist
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'startup_failure' ||
      github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Resolve current main and verify execution SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            git fetch origin main --depth=1
            git checkout --detach "$remote_sha"

            event_head="${{ github.event.workflow_run.head_sha || '' }}"
            ancestor=false
            relation="UNVERIFIED_OR_DIVERGED"
            if [ -n "$event_head" ]; then
              if [ "$event_head" = "$remote_sha" ]; then
                ancestor=true
                relation="SAME_CURRENT_MAIN"
              else
                compare_status="$(gh api "repos/${{ github.repository }}/compare/$event_head...$remote_sha" --jq '.status')"
                if [ "$compare_status" = "ahead" ]; then
                  ancestor=true
                  relation="ANCESTOR_OF_CURRENT_MAIN"
                fi
              fi
            fi
            echo "CONTROL_PLANE_EVENT_ANCESTOR_OF_MAIN=$ancestor" >> "$GITHUB_ENV"
            echo "CONTROL_PLANE_EVENT_RELATION=$relation" >> "$GITHUB_ENV"
            echo "CONTROL_PLANE_EVENT_WORKFLOW=${{ github.event.workflow_run.name || '' }}" >> "$GITHUB_ENV"
            echo "CONTROL_PLANE_EVENT_CONCLUSION=${{ github.event.workflow_run.conclusion || '' }}" >> "$GITHUB_ENV"
            echo "CONTROL_PLANE_EVENT_HEAD_SHA=${{ github.event.workflow_run.head_sha || '' }}" >> "$GITHUB_ENV"
            echo "CONTROL_PLANE_EVENT_RUN_ID=${{ github.event.workflow_run.id || '' }}" >> "$GITHUB_ENV"
            echo "CONTROL_PLANE_CURRENT_MAIN_SHA=$remote_sha" >> "$GITHUB_ENV"
            echo "CONTROL_PLANE_MAIN_RECONCILIATION relation=$relation current_main=$remote_sha event_head=$event_head"
          else
            test "$remote_sha" = "${{ github.sha }}" || {
              echo "STALE_MAIN_RUN expected=$remote_sha actual=${{ github.sha }}"
              exit 1
            }
            echo "CONTROL_PLANE_CURRENT_MAIN_SHA=$remote_sha" >> "$GITHUB_ENV"
            echo "CONTROL_PLANE_EVENT_ANCESTOR_OF_MAIN=false" >> "$GITHUB_ENV"
          fi

      - name: Run control-plane regression
        run: python scripts/test_autonomous_control_plane.py

      - name: Snapshot current GitHub Actions state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/automation_state
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          workflows = [
              # Auto-dispatch allowlist
              "source_feasibility_audit.yml",
              "scope_autofill.yml",
              "production_runtime_health.yml",
              "production_safety_audit.yml",
              "nine_sport_lane_audit.yml",
              "autonomous_research_sweep.yml",
              "24h_autonomous_research.yml",
              "pre_event_prediction.yml",
              "autonomous_temporal_trajectory_loop.yml",
              # Monitor-only production/recovery evidence
              "v4_5_15_production.yml",
              "pit_history_expansion.yml",
              "production_failure_recovery.yml",
              "production_watchdog.yml",
              "production_invariants.yml",
              "lightweight_regression.yml",
              "autonomous_control_plane_regression.yml",
          ]
          output = {"generated_at_utc": None, "head_sha": os.environ.get("GITHUB_SHA", ""), "workflows": {}, "errors": {}}
          for workflow in workflows:
              cmd = [
                  "gh", "run", "list", "--workflow", workflow, "--branch", "main",
                  "--limit", "20",
                  "--json", "databaseId,status,conclusion,createdAt,headSha,event,name",
              ]
              proc = subprocess.run(cmd, capture_output=True, text=True)
              if proc.returncode != 0:
                  output["errors"][workflow] = proc.stderr.strip() or f"exit={proc.returncode}"
                  continue
              try:
                  rows = json.loads(proc.stdout or "[]")
              except json.JSONDecodeError as exc:
                  output["errors"][workflow] = f"INVALID_JSON:{exc}"
                  continue
              rows = [x for x in rows if isinstance(x, dict)]
              rows.sort(key=lambda x: str(x.get("createdAt") or ""), reverse=True)
              output["workflows"][workflow] = {
                  "latest": rows[0] if rows else None,
                  "recent": rows[:20],
              }
          from datetime import datetime, timezone
          output["generated_at_utc"] = datetime.now(timezone.utc).isoformat()
          Path("results/automation_state/actions_snapshot.json").write_text(
              json.dumps(output, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(output, ensure_ascii=False))
          PY

      - name: Inspect current GitHub evidence
        id: control
        env:
          CONTROL_PLANE_EVENT_WORKFLOW: ${{ github.event.workflow_run.name || '' }}
          CONTROL_PLANE_EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          CONTROL_PLANE_EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          main_sha="${CONTROL_PLANE_CURRENT_MAIN_SHA:-${{ github.sha }}}"
          python src/autonomous_control_plane.py --head-sha "$main_sha" > control_output.json
          cat control_output.json
          python - <<'PY'
          import json
          o=json.load(open("control_output.json",encoding="utf-8"))
          assert o["automatic_promotion"] is False
          selected=o["selected_action"]
          allowed={
            "PIT_COVERAGE_REPAIR":"pit_history_expansion.yml",
            "PRODUCTION_HEARTBEAT":"pre_event_prediction.yml",
            "RESEARCH_HEALTH":"autonomous_research_sweep.yml",
            "TRAJECTORY_RESEARCH":"autonomous_temporal_trajectory_loop.yml",
            "DEEP_RESEARCH":"24h_autonomous_research.yml",
            "SOURCE_FEASIBILITY":"source_feasibility_audit.yml",
            "SCOPE_AUTOFILL":"scope_autofill.yml",
            "RUNTIME_HEALTH":"production_runtime_health.yml",
            "SAFETY_AUDIT":"production_safety_audit.yml",
            "LANE_AUDIT":"nine_sport_lane_audit.yml",
          }
          assert selected["workflow"] == allowed[selected["action"]]
          dispatch=o.get("dispatch_action")
          if dispatch:
              assert dispatch["workflow"] == allowed[dispatch["action"]]
              assert dispatch["automatic_promotion"] is False
          PY

          dispatch_action="$(python -c 'import json; o=json.load(open("control_output.json")); print((o.get("dispatch_action") or {}).get("action","NONE"))')"
          dispatch_workflow="$(python -c 'import json; o=json.load(open("control_output.json")); print((o.get("dispatch_action") or {}).get("workflow",""))')"
          echo "dispatch_action=$dispatch_action" >> "$GITHUB_OUTPUT"
          echo "dispatch_workflow=$dispatch_workflow" >> "$GITHUB_OUTPUT"

      - name: Persist deterministic control-plane state
        id: persist
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state_paths=(
            results/research/autonomous_control_plane.json
            results/research/automation_health.json
            results/research/research_queue.jsonl
            results/research/autonomous_action_log.jsonl
          )
          needs_persist=false
          for state_path in "${state_paths[@]}"; do
            if [ ! -f "$state_path" ]; then
              needs_persist=true
              break
            fi
          done

          # git diff does not report untracked files. A state file created earlier
          # in this run can therefore exist without being durable on main. Treat
          # every untracked state artifact as a required first-time persistence.
          for state_path in "${state_paths[@]}"; do
            if ! git ls-files --error-unmatch -- "$state_path" >/dev/null 2>&1; then
              needs_persist=true
              echo "CONTROL_PLANE_STATE_NOT_TRACKED path=$state_path"
            fi
          done

          if [ "$needs_persist" = false ] && git diff --quiet -- "${state_paths[@]}"; then
            remote_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
            test "$remote_sha" = "$CONTROL_PLANE_CURRENT_MAIN_SHA" || {
              echo "STALE_MAIN_NO_CHANGE expected=$CONTROL_PLANE_CURRENT_MAIN_SHA actual=$remote_sha" >&2
              exit 1
            }
            echo "persist_ok=true" >> "$GITHUB_OUTPUT"
            echo "main_sha=$remote_sha" >> "$GITHUB_OUTPUT"
            echo "CONTROL_PLANE_GIT=NO_CHANGE main_sha=$remote_sha"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${state_paths[@]}"
          git commit -m "ops: reconcile autonomous research control plane"

          remote_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          test "$remote_sha" = "$CONTROL_PLANE_CURRENT_MAIN_SHA" || {
            echo "STALE_MAIN_BEFORE_PUSH expected=$CONTROL_PLANE_CURRENT_MAIN_SHA actual=$remote_sha" >&2
            exit 1
          }

          git push origin HEAD:main

          new_main_sha="$(git rev-parse HEAD)"
          echo "persist_ok=true" >> "$GITHUB_OUTPUT"
          echo "main_sha=$new_main_sha" >> "$GITHUB_OUTPUT"
          echo "CONTROL_PLANE_GIT=PUSHED main_sha=$new_main_sha"


      - name: Dispatch at most one allowlisted autonomous workflow
        if: steps.control.outcome == 'success' && steps.persist.outputs.persist_ok == 'true' && steps.control.outputs.dispatch_action != 'NONE'
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_ACTION: ${{ steps.control.outputs.dispatch_action }}
          DISPATCH_WORKFLOW: ${{ steps.control.outputs.dispatch_workflow }}
        run: |
          set -euo pipefail
          case "$DISPATCH_WORKFLOW" in
            source_feasibility_audit.yml)
              cooldown=14400
              ;;
            scope_autofill.yml)
              cooldown=21600
              ;;
            production_runtime_health.yml)
              cooldown=5400
              ;;
            production_safety_audit.yml)
              cooldown=14400
              ;;
            nine_sport_lane_audit.yml)
              cooldown=21600
              ;;
            autonomous_research_sweep.yml)
              cooldown=21600
              ;;
            autonomous_temporal_trajectory_loop.yml)
              cooldown=1200
              ;;
            24h_autonomous_research.yml)
              cooldown=86400
              ;;
            *)
              echo "UNEXPECTED_AUTOMATION_WORKFLOW=$DISPATCH_WORKFLOW" >&2
              exit 1
              ;;
          esac

          main_sha="${{ steps.persist.outputs.main_sha }}"
          remote_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          test "$remote_sha" = "$main_sha" || {
            echo "STALE_MAIN_BEFORE_DISPATCH expected=$main_sha actual=$remote_sha" >&2
            exit 1
          }

          state="$(gh run list --workflow "$DISPATCH_WORKFLOW" --limit 100 \
            --json databaseId,status,createdAt,headSha,event,conclusion)"
          # Defense-in-depth: the final dispatch gate checks every recent run,
          # regardless of SHA, so an older-main run that is still active cannot
          # be duplicated by a new autonomous dispatch.
          active_any="$(printf '%s' "$state" | jq \
            '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending")] | length')"
          active_current="$(printf '%s' "$state" | jq --arg sha "$main_sha" \
            '[.[] | select(.headSha==$sha and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending"))] | length')"

          latest="$(printf '%s' "$state" | jq -r --arg sha "$main_sha" \
            '[.[] | select(.headSha==$sha) | .createdAt] | sort | last // ""')"

          dispatch=false
          reason="active_any=$active_any active_current=$active_current latest=$latest cooldown=${cooldown}s action=$DISPATCH_ACTION"

          if [ "$active_any" -eq 0 ]; then
            if [ -z "$latest" ]; then
              dispatch=true
            else
              latest_ts="$(date -u -d "$latest" +%s)"
              now_ts="$(date -u +%s)"
              age=$((now_ts-latest_ts))
              if [ "$age" -ge "$cooldown" ]; then
                dispatch=true
              else
                reason="$reason age=${age}s"
              fi
            fi
          fi

          if [ "$dispatch" = true ]; then
            echo "AUTO_DISPATCH workflow=$DISPATCH_WORKFLOW action=$DISPATCH_ACTION reason=$reason"
            gh workflow run "$DISPATCH_WORKFLOW" --ref main
          else
            echo "AUTO_DISPATCH_SKIPPED reason=$reason"
          fi


      - name: Final control-plane status
        if: always()
        run: |
          set -euo pipefail
          echo "CONTROL_PLANE_STATUS=COMPLETED_WITH_EXPLICIT_GATES"
          echo "AUTOMATIC_MODEL_PROMOTION=false"
          echo "PIT_AUTOMATIC_BYPASS=false"